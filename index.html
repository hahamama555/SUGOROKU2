<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>都道府県すごろく</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,
  "Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  background:#eee8ff;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

button,input,select{
  font-family:inherit;
}

.app{
  width:100%;
  height:100dvh;
  max-width:900px;
  background:#fff;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* =========================
   ヘッダー
========================= */

.header{
  flex:0 0 8.5%;
  min-height:55px;
  background:linear-gradient(135deg,#6d28d9,#8b5cf6);
  color:#fff;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  position:relative;
  padding:4px 65px 4px 8px;
}

.header h1{
  font-size:clamp(15px,3.7vw,28px);
  line-height:1.15;
  font-weight:900;
  text-align:center;
}

.header p{
  margin-top:3px;
  font-size:clamp(9px,2.2vw,15px);
  line-height:1.15;
}

.headerButtons{
  position:absolute;
  right:7px;
  top:50%;
  transform:translateY(-50%);
}

.headerButtons button{
  background:rgba(255,255,255,.2);
  color:#fff;
  border:1px solid rgba(255,255,255,.4);
  border-radius:7px;
  padding:6px 7px;
  font-size:10px;
  font-weight:900;
}

/* =========================
   メイン
========================= */

.main{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  padding:5px;
  gap:4px;
  overflow:hidden;
}

/* =========================
   選択中
========================= */

.selectedBox{
  flex:0 0 7%;
  min-height:38px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:5px;
  padding:3px 7px;
  background:#f3e8ff;
  border:2px solid #8b5cf6;
  border-radius:8px;
}

.selectedLabel{
  font-size:9px;
  color:#555;
}

.selectedName{
  font-size:14px;
  font-weight:900;
  color:#6d28d9;
  line-height:1.1;
}

.moveButton{
  flex:0 0 auto;
  background:#6d28d9;
  color:#fff;
  border:0;
  border-radius:7px;
  padding:7px 10px;
  font-size:10px;
  font-weight:900;
}

/* =========================
   盤面
========================= */

.boardWrap{
  flex:1;
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
}

.board{
  width:100%;
  height:100%;
  display:grid;
  grid-template-columns:repeat(6,1fr);
  grid-template-rows:repeat(5,1fr);
  gap:2px;
  padding:2px;
  border:2px solid #444;
  border-radius:8px;
  background:#d4d4d4;
}

.cell{
  min-width:0;
  min-height:0;
  position:relative;
  overflow:hidden;
  border:1px solid #777;
  border-radius:4px;
  background:#fff;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.cellNumber{
  position:absolute;
  left:2px;
  top:1px;
  font-size:clamp(7px,1.8vw,12px);
  line-height:1;
  font-weight:900;
  color:#555;
}

.cellTrick{
  font-size:clamp(6px,1.35vw,10px);
  font-weight:900;
  line-height:1.05;
  text-align:center;
  padding:1px;
  margin-top:4px;
}

.cell.start{
  background:#e0f2fe;
  border-color:#0284c7;
}

.cell.goal{
  background:#fff7cc;
  border-color:#eab308;
}

/* =========================
   コマ
========================= */

.pieces{
  width:100%;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  align-items:center;
  gap:2px;
  padding:2px;
}

.piece{
  max-width:96%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  color:#fff;
  border-radius:5px;
  padding:3px 4px;
  font-size:clamp(8px,1.6vw,12px);
  font-weight:900;
  line-height:1.05;
  box-shadow:0 1px 2px rgba(0,0,0,.25);
}

/* =========================
   ギフト
========================= */

.giftArea{
  flex:0 0 13%;
  min-height:60px;
  background:#faf5ff;
  border:2px solid #ddd6fe;
  border-radius:8px;
  padding:3px;
}

.giftTitle{
  height:18px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:10px;
  font-weight:900;
  color:#5b21b6;
}

.giftGrid{
  height:calc(100% - 18px);
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:3px;
}

.giftButton{
  min-width:0;
  min-height:0;
  border:0;
  border-radius:6px;
  color:#fff;
  background:#7c3aed;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:2px;
  font-weight:900;
}

.giftButton:nth-child(2){
  background:#ec4899;
}

.giftButton:nth-child(3){
  background:#f59e0b;
}

.giftIcon{
  font-size:16px;
  line-height:1;
}

.giftName{
  width:95%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  text-align:center;
  font-size:8px;
  line-height:1.1;
  margin-top:2px;
}

.giftMove{
  font-size:7px;
  line-height:1;
  margin-top:2px;
}

/* =========================
   下部ボタン
========================= */

.bottomSettings{
  flex:0 0 7%;
  min-height:38px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:3px;
}

.bottomSettings button{
  min-height:0;
  border-radius:6px;
  background:#eee;
  border:1px solid #ccc;
  font-size:9px;
  font-weight:900;
  color:#333;
}

/* =========================
   モーダル
========================= */

.modal{
  position:fixed;
  inset:0;
  z-index:1000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:10px;
  background:rgba(0,0,0,.55);
}

.modal.show{
  display:flex;
}

.modalBox{
  width:min(94vw,600px);
  max-height:90dvh;
  background:#fff;
  border-radius:12px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

.modalHeader{
  flex:0 0 auto;
  background:#6d28d9;
  color:#fff;
  text-align:center;
  padding:10px;
  font-size:15px;
  font-weight:900;
}

.modalBody{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:10px;
}

.modalFooter{
  flex:0 0 auto;
  display:flex;
  gap:5px;
  padding:6px;
  border-top:1px solid #ddd;
}

.modalFooter button{
  flex:1;
  border-radius:7px;
  padding:9px;
  font-weight:900;
}

.closeBtn{
  background:#eee;
  border:1px solid #ccc;
}

.saveBtn{
  background:#6d28d9;
  color:#fff;
  border:0;
}

.info{
  background:#f3e8ff;
  color:#4c1d95;
  border-radius:7px;
  padding:7px;
  font-size:10px;
  line-height:1.4;
  margin-bottom:8px;
}

/* =========================
   コマ選択
========================= */

.pieceSelectTitle{
  font-size:12px;
  font-weight:900;
  color:#5b21b6;
  margin-bottom:5px;
}

.pieceSelectList{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:4px;
  margin-bottom:10px;
  max-height:180px;
  overflow-y:auto;
  padding:2px;
}

.pieceSelectButton{
  min-width:0;
  display:flex;
  align-items:center;
  gap:5px;
  border:2px solid #ddd;
  background:#fff;
  border-radius:7px;
  padding:7px 5px;
  font-size:10px;
  font-weight:900;
  text-align:left;
}

.pieceSelectButton.selected{
  border-color:#6d28d9;
  background:#f3e8ff;
  box-shadow:0 0 0 1px #8b5cf6;
}

.pieceSelectDot{
  flex:0 0 15px;
  width:15px;
  height:15px;
  border-radius:50%;
  box-shadow:0 1px 3px rgba(0,0,0,.25);
}

.selectedInfo{
  background:#f3e8ff;
  border:1px solid #c4b5fd;
  border-radius:7px;
  padding:6px;
  text-align:center;
  font-size:10px;
  font-weight:900;
  color:#5b21b6;
  margin-bottom:8px;
}

/* =========================
   コマ設定
========================= */

.pieceCountBox{
  display:flex;
  gap:5px;
  align-items:center;
  margin-bottom:8px;
}

.pieceCountBox label{
  font-size:11px;
  font-weight:900;
  white-space:nowrap;
}

.pieceCountBox input{
  width:80px;
  border:1px solid #bbb;
  border-radius:6px;
  padding:7px;
  font-size:12px;
}

.pieceSetting{
  display:grid;
  grid-template-columns:40px 1fr 65px;
  gap:5px;
  align-items:center;
  border:1px solid #ddd;
  border-radius:7px;
  padding:5px;
  margin-bottom:4px;
  background:#fafafa;
}

.pieceNumber{
  text-align:center;
  font-size:10px;
  font-weight:900;
}

.pieceSetting input[type="text"]{
  width:100%;
  border:1px solid #bbb;
  border-radius:5px;
  padding:7px;
  font-size:11px;
  font-weight:700;
}

.pieceColor{
  width:100%;
  height:34px;
  padding:2px;
  border:1px solid #bbb;
  border-radius:5px;
  background:#fff;
}

/* =========================
   ギフト・仕掛け
========================= */

.giftSetting{
  border:1px solid #ddd;
  border-radius:8px;
  padding:8px;
  margin-bottom:7px;
  background:#fafafa;
}

.giftSettingTitle{
  color:#5b21b6;
  font-weight:900;
  font-size:12px;
  margin-bottom:5px;
}

.twoCol{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
}

.formGroup{
  margin-bottom:7px;
}

.formGroup label{
  display:block;
  font-size:10px;
  font-weight:900;
  margin-bottom:3px;
}

.formGroup input,
.formGroup select{
  width:100%;
  border:1px solid #bbb;
  border-radius:6px;
  padding:7px;
  font-size:12px;
}

.trickSetting{
  border:1px solid #ddd;
  border-radius:7px;
  padding:6px;
  margin-bottom:5px;
}

.trickSetting strong{
  display:block;
  font-size:10px;
  margin-bottom:3px;
}

.trickSetting select,
.trickSetting input{
  width:100%;
  border:1px solid #bbb;
  border-radius:5px;
  padding:6px;
  font-size:10px;
  margin-bottom:3px;
}

/* =========================
   ポップアップ
========================= */

.popup{
  position:fixed;
  inset:0;
  z-index:2000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  background:rgba(0,0,0,.45);
}

.popup.show{
  display:flex;
}

.popupBox{
  width:min(88vw,400px);
  background:#fff;
  border-radius:14px;
  padding:18px;
  text-align:center;
  box-shadow:0 10px 40px rgba(0,0,0,.3);
}

.popupIcon{
  font-size:40px;
}

.popupTitle{
  margin-top:5px;
  color:#5b21b6;
  font-size:19px;
  font-weight:900;
}

.popupText{
  margin-top:6px;
  font-size:13px;
  line-height:1.5;
  white-space:pre-line;
}

.popupButton{
  margin-top:12px;
  background:#6d28d9;
  color:#fff;
  border:0;
  border-radius:7px;
  padding:9px 24px;
  font-weight:900;
}

/* =========================
   サイコロ
========================= */

.diceOverlay{
  position:fixed;
  inset:0;
  z-index:5000;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.78);
}

.diceOverlay.show{
  display:flex;
}

.diceAnimationBox{
  width:280px;
  text-align:center;
}

.diceCaption{
  color:#fff;
  font-size:18px;
  font-weight:900;
  margin-bottom:20px;
}

.bigDice{
  width:170px;
  height:170px;
  margin:0 auto;
  background:#fff;
  border:7px solid #333;
  border-radius:28px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:105px;
  font-weight:900;
  color:#222;
  box-shadow:
    0 0 0 5px rgba(255,255,255,.2),
    0 15px 50px rgba(0,0,0,.7);
}

.bigDice.rolling{
  animation:
    diceRoll .12s infinite alternate,
    diceJump .24s infinite alternate;
}

.bigDice.stopped{
  animation:diceStop .35s ease-out;
}

.diceRollingText{
  margin-top:25px;
  color:#fff;
  font-size:21px;
  line-height:1.4;
  font-weight:900;
  text-shadow:0 2px 6px #000;
}

.diceTotal{
  margin-top:10px;
  color:#ffe600;
  font-size:30px;
  font-weight:900;
  text-shadow:0 2px 6px #000;
}

@keyframes diceRoll{
  0%{
    transform:rotate(-18deg) translateX(-12px) scale(.90);
  }
  25%{
    transform:rotate(12deg) translateX(12px) scale(1.08);
  }
  50%{
    transform:rotate(-8deg) translateX(-8px) scale(.96);
  }
  75%{
    transform:rotate(18deg) translateX(10px) scale(1.10);
  }
  100%{
    transform:rotate(-15deg) translateX(-10px) scale(.92);
  }
}

@keyframes diceJump{
  0%{margin-top:0;}
  100%{margin-top:-16px;}
}

@keyframes diceStop{
  0%{
    transform:scale(1.35) rotate(20deg);
  }
  60%{
    transform:scale(.92) rotate(-5deg);
  }
  100%{
    transform:scale(1) rotate(0deg);
  }
}

/* =========================
   小型スマホ
========================= */

@media(max-width:390px){

  .header{
    flex-basis:8%;
    min-height:50px;
  }

  .header h1{
    font-size:14px;
  }

  .header p{
    font-size:8px;
  }

  .selectedBox{
    flex-basis:6.5%;
    min-height:34px;
  }

  .selectedName{
    font-size:12px;
  }

  .moveButton{
    padding:6px 8px;
    font-size:9px;
  }

  .giftArea{
    flex-basis:12%;
    min-height:55px;
  }

  .giftIcon{
    font-size:14px;
  }

  .bottomSettings{
    flex-basis:6.5%;
    min-height:34px;
  }

  .bottomSettings button{
    font-size:8px;
  }

  .piece{
    font-size:8px;
    padding:3px;
  }

  .bigDice{
    width:145px;
    height:145px;
    font-size:88px;
    border-radius:24px;
  }

  .diceAnimationBox{
    width:250px;
  }

  .diceCaption{
    font-size:16px;
  }

  .diceRollingText{
    font-size:17px;
  }

  .diceTotal{
    font-size:25px;
  }

}
</style>
</head>

<body>

<div class="app">

<header class="header">

  <div class="headerButtons">
    <button onclick="openProjectSettings()">
      ⚙️設定
    </button>
  </div>

  <h1 id="titleText">
    🗾 出身県はどこ？県民パワーでGOALを目指せ！
  </h1>

  <p id="subtitleText">
    指定ギフトでコマを進めよう！
  </p>

</header>


<main class="main">

  <div class="selectedBox">

    <div>

      <div class="selectedLabel">
        現在選択中
      </div>

      <div class="selectedName"
           id="selectedName">
        未選択
      </div>

    </div>

    <button class="moveButton"
            onclick="moveSelected(1,'🎲')">
      🎲 1マス進む
    </button>

  </div>


  <div class="boardWrap">

    <div class="board"
         id="board">
    </div>

  </div>


  <section class="giftArea">

    <div class="giftTitle">
      🎁 指定ギフトでコマを進めよう！
    </div>

    <div class="giftGrid"
         id="giftGrid">
    </div>

  </section>


  <div class="bottomSettings">

    <button onclick="openPieceModal()">
      🏃 コマ設定
    </button>

    <button onclick="openGiftSettings()">
      🎁 ギフト設定
    </button>

    <button onclick="openTrickSettings()">
      ⭐ 仕掛け設定
    </button>

    <button onclick="resetGame()">
      🔄 リセット
    </button>

  </div>

</main>

</div>


<!-- =========================
     コマ設定
========================= -->

<div class="modal"
     id="pieceModal">

  <div class="modalBox">

    <div class="modalHeader">
      🏃 コマ設定・選択
    </div>

    <div class="modalBody">

      <div class="info">
        コマをタップすると、そのコマを操作できます。<br>
        下の欄からコマの数・名前・色も変更できます。
      </div>


      <!-- コマ選択 -->

      <div class="pieceSelectTitle">
        🏃 操作するコマを選択
      </div>

      <div class="selectedInfo"
           id="selectedInfo">
        現在：未選択
      </div>

      <div class="pieceSelectList"
           id="pieceSelectList">
      </div>


      <!-- コマ設定 -->

      <div class="pieceSelectTitle">
        📝 コマの数・名前・色
      </div>

      <div class="pieceCountBox">

        <label>
          コマの数
        </label>

        <input
          id="pieceCount"
          type="number"
          min="1"
          max="50"
          value="47"
          onchange="renderPieceSettings()"
        >

      </div>

      <div id="pieceSettingsList">
      </div>

    </div>

    <div class="modalFooter">

      <button class="closeBtn"
              onclick="closeModal('pieceModal')">
        閉じる
      </button>

      <button class="saveBtn"
              onclick="savePieceSettings()">
        保存する
      </button>

    </div>

  </div>

</div>


<!-- =========================
     ギフト設定
========================= -->

<div class="modal"
     id="giftModal">

  <div class="modalBox">

    <div class="modalHeader">
      🎁 ギフト設定
    </div>

    <div class="modalBody">

      <div class="info">
        「固定マス」なら決めたマス数だけ進みます。<br>
        「サイコロ」なら指定回数振って、出た目の合計だけ進みます。
      </div>

      <div id="giftSettingsList">
      </div>

    </div>

    <div class="modalFooter">

      <button class="closeBtn"
              onclick="closeModal('giftModal')">
        キャンセル
      </button>

      <button class="saveBtn"
              onclick="saveGiftSettings()">
        保存する
      </button>

    </div>

  </div>

</div>


<!-- =========================
     仕掛け設定
========================= -->

<div class="modal"
     id="trickModal">

  <div class="modalBox">

    <div class="modalHeader">
      ⭐ マスの仕掛け設定
    </div>

    <div class="modalBody">

      <div class="info">
        各マスに仕掛けを設定できます。
      </div>

      <div id="trickSettingsList">
      </div>

    </div>

    <div class="modalFooter">

      <button class="closeBtn"
              onclick="closeModal('trickModal')">
        キャンセル
      </button>

      <button class="saveBtn"
              onclick="saveTrickSettings()">
        保存する
      </button>

    </div>

  </div>

</div>


<!-- =========================
     プロジェクト設定
========================= -->

<div class="modal"
     id="projectModal">

  <div class="modalBox">

    <div class="modalHeader">
      ⚙️ プロジェクト設定
    </div>

    <div class="modalBody">

      <div class="formGroup">

        <label>
          タイトル
        </label>

        <input
          id="projectTitle"
          type="text"
        >

      </div>

      <div class="formGroup">

        <label>
          サブタイトル
        </label>

        <input
          id="projectSubtitle"
          type="text"
        >

      </div>

      <div class="formGroup">

        <label>
          GOALマス
        </label>

        <input
          id="projectGoal"
          type="number"
          min="1"
          max="99"
        >

      </div>

    </div>

    <div class="modalFooter">

      <button class="closeBtn"
              onclick="closeModal('projectModal')">
        キャンセル
      </button>

      <button class="saveBtn"
              onclick="saveProjectSettings()">
        保存する
      </button>

    </div>

  </div>

</div>


<!-- =========================
     ポップアップ
========================= -->

<div class="popup"
     id="popup">

  <div class="popupBox">

    <div class="popupIcon"
         id="popupIcon">
      🎲
    </div>

    <div class="popupTitle"
         id="popupTitle">
      サイコロ
    </div>

/* =================================================

================================================= */

function escapeHtml(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

/* =================================================
   コマ設定保存
================================================= */

function savePieceSettings(){

  const count =
    Math.max(
      1,
      Math.min(
        50,
        Number(
          document.getElementById(
            "pieceCount"
          ).value
        )||1
      )
    );


  const oldPieces =
    pieces.slice();


  const oldPositions={
    ...positions
  };


  const oldSelectedPiece=
    selectedPiece;


  const newPieces=[];


  for(let i=0;i<count;i++){

    const nameInput =
      document.getElementById(
        "pieceName"+i
      );

    const colorInput =
      document.getElementById(
        "pieceColor"+i
      );


    let name =
      nameInput?.value.trim() ||
      "コマ"+(i+1);


    let color =
      colorInput?.value ||
      getDefaultColor(i);


    newPieces.push({
      name:name,
      color:color
    });

  }


  /* 重複名を自動修正 */

  const used={};


  newPieces.forEach(piece=>{

    const base=
      piece.name;

    let name=
      base;

    let number=2;


    while(
      used[name]
    ){

      name=
        base+" "+number;

      number++;

    }


    piece.name=name;

    used[name]=true;

  });


  pieces=
    newPieces;


  positions={};


  pieces.forEach(
    (piece,index)=>{

      const oldPiece=
        oldPieces[index];


      if(
        oldPiece &&
        oldPositions[
          oldPiece.name
        ]!=null
      ){

        positions[
          piece.name
        ]=
          Math.min(
            GOAL,
            oldPositions[
              oldPiece.name
            ]
          );

      }else{

        positions[
          piece.name
        ]=0;

      }

    }
  );


  /* 選択中コマを引き継ぐ */

  if(
    oldSelectedPiece
  ){

    const oldIndex=
      oldPieces.findIndex(
        p=>
          p.name===
          oldSelectedPiece
      );


    if(
      oldIndex>=0 &&
      pieces[oldIndex]
    ){

      selectedPiece=
        pieces[oldIndex].name;

    }else{

      selectedPiece=
        null;

    }

  }


  renderBoard();

  updateSelected();

  renderPieceSelectList();


  closeModal(
    "pieceModal"
  );


  showPopup(
    "🏃",
    "コマ設定を保存しました！",
    "コマの数・名称・色を更新しました。"
  );

}

/* =================================================
   ギフト使用
================================================= */

function useGift(index){

  if(
    isRollingDice
  ){
    return;
  }


  if(
    !selectedPiece
  ){

    showPopup(
      "⚠️",
      "コマを選んでください",
      "先に「🏃 コマ設定」からコマを選択してください。"
    );

    return;

  }


  const gift=
    gifts[index];


  if(!gift){
    return;
  }


  if(
    gift.type==="dice"
  ){

    rollDiceForGift(
      gift
    );

  }else{

    const move=
      Math.max(
        0,
        Number(
          gift.move
        )||0
      );


    moveSelected(
      move,
      gift.icon
    );

  }

}


/* =================================================
   サイコロ
================================================= */

let isRollingDice=false;


async function rollDiceForGift(gift){

  if(
    !selectedPiece ||
    isRollingDice
  ){
    return;
  }


  isRollingDice=true;


  const count=
    Math.max(
      1,
      Math.min(
        20,
        Number(
          gift.diceCount
        )||1
      )
    );


  const rolls=[];


  const overlay=
    document.getElementById(
      "diceOverlay"
    );

  const dice=
    document.getElementById(
      "bigDice"
    );

  const rollingText=
    document.getElementById(
      "diceRollingText"
    );

  const totalText=
    document.getElementById(
      "diceTotal"
    );

  const caption=
    document.getElementById(
      "diceCaption"
    );


  overlay.classList.add(
    "show"
  );


  for(
    let i=0;
    i<count;
    i++
  ){

    caption.textContent=
      "🎲 "+(i+1)+"回目";


    rollingText.textContent=
      "サイコロを振っています！";


    totalText.textContent="";


    dice.classList.remove(
      "stopped"
    );

    dice.classList.add(
      "rolling"
    );


    for(
      let j=0;
      j<18;
      j++
    ){

      dice.textContent=
        Math.floor(
          Math.random()*6
        )+1;


      await wait(65);

    }


    const result=
      Math.floor(
        Math.random()*6
      )+1;


    rolls.push(
      result
    );


    dice.classList.remove(
      "rolling"
    );

    dice.classList.add(
      "stopped"
    );


    dice.textContent=
      result;


    rollingText.textContent=
      "🎲 出た目は "+
      result+
      "！";


    if(
      count>1
    ){

      totalText.textContent=
        "現在の合計："+

        rolls.reduce(
          (sum,num)=>
            sum+num,
          0
        );

    }


    await wait(
      1000
    );

  }


  const total=
    rolls.reduce(
      (sum,num)=>
        sum+num,
      0
    );


  caption.textContent=
    "🎉 サイコロ結果";


  dice.classList.remove(
    "rolling"
  );

  dice.classList.add(
    "stopped"
  );


  dice.textContent=
    total;


  rollingText.textContent=
    "出た目："+

    rolls.join(
      " ＋ "
    );


  totalText.textContent=
    "合計 "+
    total+
    "マス！";


  await wait(
    1300
  );


  overlay.classList.remove(
    "show"
  );


  await wait(
    150
  );


  moveSelected(
    total,
    "🎲",
    "🎲 出た目："+

    rolls.join(
      " ＋ "
    )+

    " ＝ "+

    total+

    "マス"
  );


  isRollingDice=false;

}


/* =================================================
   待機
================================================= */

function wait(ms){

  return new Promise(
    resolve=>
      setTimeout(
        resolve,
        ms
      )
  );

}


/* =================================================
   コマ移動
================================================= */

function moveSelected(
  move,
  icon="🎲",
  extraText=""
){

  if(
    !selectedPiece
  ){

    showPopup(
      "⚠️",
      "コマを選んでください",
      "先にコマを選択してください。"
    );

    return;

  }


  const current=
    positions[
      selectedPiece
    ]||0;


  let newPosition=
    current+
    Number(move);


  if(
    newPosition<1
  ){

    newPosition=1;

  }


  if(
    newPosition>=GOAL
  ){

    positions[
      selectedPiece
    ]=GOAL;


    renderBoard();


    showPopup(
      "🏆",
      "GOAL！",
      selectedPiece+
      " がゴールしました！"+
      (
        extraText
        ?
        "\n"+
        extraText
        :
        ""
      )
    );


    return;

  }


  positions[
    selectedPiece
  ]=
    newPosition;


  renderBoard();


  let message=
    selectedPiece+
    " が "+
    move+
    "マス進みました！";


  if(
    extraText
  ){

    message=
      extraText+
      "\n"+
      message;

  }


  const trick=
    tricks[
      newPosition
    ];


  if(
    trick &&
    trick.type!=="none"
  ){

    triggerTrick(
      selectedPiece,
      newPosition,
      trick,
      icon,
      message
    );

  }else{

    showPopup(
      icon,
      "コマが進みました！",
      message
    );

  }

}


/* =================================================
   仕掛け
================================================= */

function triggerTrick(
  piece,
  position,
  trick,
  giftIcon,
  sourceText
){

  switch(
    trick.type
  ){

    case "forward":{

      const amount=
        Number(
          trick.value
        )||0;


      positions[piece]=
        Math.min(
          GOAL,
          positions[piece]+
          amount
        );


      renderBoard();


      showPopup(
        "⬆️",
        "仕掛け発動！",
        sourceText+
        "\n\n"+
        piece+
        " はさらに "+
        amount+
        "マス進みます！"
      );


      break;

    }


    case "back":{

      const amount=
        Number(
          trick.value
        )||0;


      positions[piece]=
        Math.max(
          1,
          positions[piece]-
          amount
        );


      renderBoard();


      showPopup(
        "⬇️",
        "仕掛け発動！",
        sourceText+
        "\n\n"+
        piece+
        " は "+
        amount+
        "マス戻ります！"
      );


      break;

    }


    case "start":{

      positions[piece]=1;


      renderBoard();


      showPopup(
        "🔵",
        "STARTへ！",
        sourceText+
        "\n\n"+
        piece+
        " はSTARTへ戻りました。"
      );


      break;

    }


    case "goal":{

      positions[piece]=GOAL;


      renderBoard();


      showPopup(
        "🏆",
        "GOAL！",
        sourceText+
        "\n\n"+
        piece+
        " がゴールしました！"
      );


      break;

    }


    case "again":{

      showPopup(
        "🎲",
        "もう1回！",
        sourceText+
        "\n\n"+
        piece+
        " はもう一度進めます！"
      );


      break;

    }


    case "display":{

      showPopup(
        "🎁",
        "お楽しみ袋！",
        sourceText+
        "\n\n"+
        "お楽しみ袋が表示されました！"
      );


      break;

    }


    case "previousBack":{

      const index=
        pieces.findIndex(
          p=>p.name===piece
        );


      if(
        index>0
      ){

        const previous=
          pieces[
            index-1
          ].name;


        const amount=
          Number(
            trick.value
          )||0;


        positions[previous]=
          Math.max(
            1,
            positions[previous]-
            amount
          );


        renderBoard();


        showPopup(
          "👥",
          "前のコマが戻ります！",
          sourceText+
          "\n\n"+
          previous+
          " が "+
          amount+
          "マス戻りました。"
        );

      }else{

        showPopup(
          "👥",
          "仕掛け発動！",
          sourceText
        );

      }


      break;

    }


    case "previousStart":{

      const index=
        pieces.findIndex(
          p=>p.name===piece
        );


      if(
        index>0
      ){

        const previous=
          pieces[
            index-1
          ].name;


        positions[previous]=1;


        renderBoard();


        showPopup(
          "🔵",
          "前のコマがSTARTへ！",
          sourceText+
          "\n\n"+
          previous+
          " がSTARTへ戻りました。"
        );

      }else{

        showPopup(
          "👥",
          "仕掛け発動！",
          sourceText
        );

      }


      break;

    }


    case "swapPrevious":{

      const index=
        pieces.findIndex(
          p=>p.name===piece
        );


      if(
        index>0
      ){

        const previous=
          pieces[
            index-1
          ].name;


        const temp=
          positions[piece];


        positions[piece]=
          positions[previous];


        positions[previous]=
          temp;


        renderBoard();


        showPopup(
          "🔄",
          "位置入れ替え！",
          sourceText+
          "\n\n"+
          piece+
          " と "+
          previous+
          " の位置が入れ替わりました！"
        );

      }else{

        showPopup(
          "🔄",
          "仕掛け発動！",
          sourceText
        );

      }


      break;

    }


    case "leaderBack":{

      let leader=null;

      let leaderPosition=-1;


      pieces.forEach(
        pieceData=>{

          const pos=
            positions[
              pieceData.name
            ]||0;


          if(
            pos>
            leaderPosition
          ){

            leaderPosition=
              pos;

            leader=
              pieceData.name;

          }

        }
      );


      if(
        leader
      ){

        const amount=
          Number(
            trick.value
          )||0;


        positions[leader]=
          Math.max(
            1,
            positions[leader]-
            amount
          );


        renderBoard();


        showPopup(
          "👑",
          "先頭が戻ります！",
          sourceText+
          "\n\n"+
          leader+
          " が "+
          amount+
          "マス戻りました。"
        );

      }


      break;

    }


    case "lastForward":{

      let last=null;

      let lastPosition=
        Infinity;


      pieces.forEach(
        pieceData=>{

          const pos=
            positions[
              pieceData.name
            ]||0;


          if(
            pos>0 &&
            pos<
            lastPosition
          ){

            lastPosition=
              pos;

            last=
              pieceData.name;

          }

        }
      );


      if(
        last
      ){

        const amount=
          Number(
            trick.value
          )||0;


        positions[last]=
          Math.min(
            GOAL,
            positions[last]+
            amount
          );


        renderBoard();


        showPopup(
          "🚀",
          "最後尾が進みます！",
          sourceText+
          "\n\n"+
          last+
          " が "+
          amount+
          "マス進みました。"
        );

      }


      break;

    }


    default:{

      showPopup(
        giftIcon,
        "コマが進みました！",
        sourceText
      );

    }

  }

}


/* =================================================
   ギフト設定
================================================= */

function openGiftSettings(){

  const list=
    document.getElementById(
      "giftSettingsList"
    );


  list.innerHTML="";


  gifts.forEach(
    (gift,index)=>{

      const box=
        document.createElement(
          "div"
        );


      box.className=
        "giftSetting";


      box.innerHTML=`

        <div class="giftSettingTitle">
          ${index+1}️⃣ ギフト${index+1}
        </div>

        <div class="twoCol">

          <div class="formGroup">

            <label>
              アイコン
            </label>

            <input
              id="giftIcon${index}"
              type="text"
              value="${escapeHtml(gift.icon)}"
            >

          </div>

          <div class="formGroup">

            <label>
              ギフト名
            </label>

            <input
              id="giftName${index}"
              type="text"
              value="${escapeHtml(gift.name)}"
            >

          </div>

        </div>


        <div class="formGroup">

          <label>
            動き方
          </label>

          <select
            id="giftType${index}"
            onchange="updateGiftSettingFields(${index})"
          >

            <option
              value="fixed"
              ${gift.type==="fixed"?"selected":""}
            >
              固定マスで進む
            </option>

            <option
              value="dice"
              ${gift.type==="dice"?"selected":""}
            >
              サイコロを振る
            </option>

          </select>

        </div>


        <div id="giftMoveArea${index}">

          <div class="formGroup">

            <label>
              固定移動マス
            </label>

            <input
              id="giftMove${index}"
              type="number"
              min="0"
              max="99"
              value="${Number(gift.move)||0}"
            >

          </div>

        </div>


        <div id="giftDiceArea${index}">

          <div class="formGroup">

            <label>
              サイコロを振る回数
            </label>

            <input
              id="giftDice${index}"
              type="number"
              min="1"
              max="20"
              value="${Number(gift.diceCount)||1}"
            >

          </div>

        </div>

      `;


      list.appendChild(box);


      updateGiftSettingFields(
        index
      );

    }
  );


  openModal(
    "giftModal"
  );

}


function updateGiftSettingFields(
  index
){

  const type=
    document.getElementById(
      "giftType"+index
    )?.value;


  const moveArea=
    document.getElementById(
      "giftMoveArea"+index
    );

  const diceArea=
    document.getElementById(
      "giftDiceArea"+index
    );


  if(
    !moveArea ||
    !diceArea
  ){
    return;
  }


  if(
    type==="dice"
  ){

    moveArea.style.display=
      "none";

    diceArea.style.display=
      "block";

  }else{

    moveArea.style.display=
      "block";

    diceArea.style.display=
      "none";

  }

}


function saveGiftSettings(){

  gifts.forEach(
    (gift,index)=>{

      gift.icon=
        document.getElementById(
          "giftIcon"+index
        ).value ||
        "🎁";


      gift.name=
        document.getElementById(
          "giftName"+index
        ).value ||
        "指定ギフト";


      gift.type=
        document.getElementById(
          "giftType"+index
        ).value;


      gift.move=
        Math.max(
          0,
          Number(
            document.getElementById(
              "giftMove"+index
            ).value
          )||0
        );


      gift.diceCount=
        Math.max(
          1,
          Math.min(
            20,
            Number(
              document.getElementById(
                "giftDice"+index
              ).value
            )||1
          )
        );

    }
  );


  renderGifts();


  closeModal(
    "giftModal"
  );


  showPopup(
    "💾",
    "保存しました！",
    "ギフト設定を更新しました。"
  );

}


/* =================================================
   仕掛け設定
================================================= */

function openTrickSettings(){

  const list=
    document.getElementById(
      "trickSettingsList"
    );


  list.innerHTML="";


  for(
    let i=1;
    i<=GOAL;
    i++
  ){

    const trick=
      tricks[i] || {

        type:"none",
        value:0

      };


    const box=
      document.createElement(
        "div"
      );


    box.className=
      "trickSetting";


    box.innerHTML=`

      <strong>
        ${i}マス目
      </strong>

      <select
        id="trickType${i}"
      >

        <option value="none"
          ${trick.type==="none"?"selected":""}>
          仕掛けなし
        </option>

        <option value="forward"
          ${trick.type==="forward"?"selected":""}>
          ⬆️ 自分が進む
        </option>

        <option value="back"
          ${trick.type==="back"?"selected":""}>
          ⬇️ 自分が戻る
        </option>

        <option value="start"
          ${trick.type==="start"?"selected":""}>
          🔵 STARTへ戻る
        </option>

        <option value="goal"
          ${trick.type==="goal"?"selected":""}>
          🏆 GOALへ
        </option>

        <option value="again"
          ${trick.type==="again"?"selected":""}>
          🎲 もう1回
        </option>

        <option value="display"
          ${trick.type==="display"?"selected":""}>
          🎁 お楽しみ袋を表示
        </option>

        <option value="previousBack"
          ${trick.type==="previousBack"?"selected":""}>
          👥 前のコマを戻す
        </option>

        <option value="previousStart"
          ${trick.type==="previousStart"?"selected":""}>
          👥 前のコマをSTARTへ
        </option>

        <option value="swapPrevious"
          ${trick.type==="swapPrevious"?"selected":""}>
          🔄 前のコマと入れ替え
        </option>

        <option value="leaderBack"
          ${trick.type==="leaderBack"?"selected":""}>
          👑 先頭を戻す
        </option>

        <option value="lastForward"
          ${trick.type==="lastForward"?"selected":""}>
          🚀 最後尾を進める
        </option>

      </select>


      <input
        id="trickValue${i}"
        type="number"
        min="0"
        max="99"
        value="${Number(trick.value)||0}"
        placeholder="移動マス数"
      >

    `;


    list.appendChild(box);

  }


  openModal(
    "trickModal"
  );

}


/* =================================================
   仕掛け保存
================================================= */

function saveTrickSettings(){

  for(
    let i=1;
    i<=GOAL;
    i++
  ){

    const type=
      document.getElementById(
        "trickType"+i
      ).value;


    const value=
      Math.max(
        0,
        Number(
          document.getElementById(
            "trickValue"+i
          ).value
        )||0
      );


    tricks[i]={
      type:type,
      value:value
    };

  }


  renderBoard();


  closeModal(
    "trickModal"
  );


  showPopup(
    "💾",
    "保存しました！",
    "マスの仕掛けを更新しました。"
  );

}


/* =================================================
   プロジェクト設定
================================================= */

function openProjectSettings(){

  document.getElementById(
    "projectTitle"
  ).value=title;


  document.getElementById(
    "projectSubtitle"
  ).value=subtitle;


  document.getElementById(
    "projectGoal"
  ).value=GOAL;


  openModal(
    "projectModal"
  );

}


function saveProjectSettings(){

  title=
    document.getElementById(
      "projectTitle"
    ).value ||
    "都道府県すごろく";


  subtitle=
    document.getElementById(
      "projectSubtitle"
    ).value ||
    "指定ギフトでコマを進めよう！";


  let newGoal=
    Number(
      document.getElementById(
        "projectGoal"
      ).value
    );


  if(
    !newGoal ||
    newGoal<1
  ){

    newGoal=30;

  }


  GOAL=
    Math.min(
      99,
      Math.floor(
        newGoal
      )
    );


  document.getElementById(
    "titleText"
  ).textContent=
    title;


  document.getElementById(
    "subtitleText"
  ).textContent=
    subtitle;


  renderBoard();


  closeModal(
    "projectModal"
  );


  showPopup(
    "💾",
    "保存しました！",
    "プロジェクト設定を更新しました。"
  );

}


/* =================================================
   モーダル
================================================= */

function openModal(id){

  document
    .getElementById(id)
    .classList.add("show");

}


function closeModal(id){

  document
    .getElementById(id)
    .classList.remove("show");

}


/* =================================================
   ポップアップ
================================================= */

function showPopup(
  icon,
  titleText,
  text
){

  document.getElementById(
    "popupIcon"
  ).textContent=
    icon;


  document.getElementById(
    "popupTitle"
  ).textContent=
    titleText;


  document.getElementById(
    "popupText"
  ).textContent=
    text;


  document.getElementById(
    "popup"
  ).classList.add("show");

}


function closePopup(){

  document.getElementById(
    "popup"
  ).classList.remove("show");

}


/* =================================================
   リセット
================================================= */

function resetGame(){

  if(
    !confirm(
      "すべてのコマをリセットしますか？"
    )
  ){

    return;

  }


  pieces.forEach(
    piece=>{

      positions[
        piece.name
      ]=0;

    }
  );


  selectedPiece=null;


  updateSelected();

  renderPieceSelectList();

  renderBoard();


  showPopup(
    "🔄",
    "リセットしました！",
    "すべてのコマをSTART前に戻しました。"
  );

}


/* =================================================
   初期化
================================================= */

document.getElementById(
  "titleText"
).textContent=
  title;


document.getElementById(
  "subtitleText"
).textContent=
  subtitle;


renderBoard();

renderGifts();

updateSelected();

</script>
