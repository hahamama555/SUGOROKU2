<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>都道府県すごろく</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;
  background:#111;
}

button,
input,
select{
  font-family:inherit;
}

.app{
  width:100%;
  height:100vh;
  height:100dvh;
  max-width:600px;
  margin:auto;
  background:#f4f4f4;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* =========================
   ヘッダー
========================= */

.header{
  flex:0 0 auto;
  background:linear-gradient(135deg,#4c1d95,#7c3aed);
  color:#fff;
  text-align:center;
  padding:7px 8px 6px;
}

.title{
  font-size:clamp(17px,4.5vw,25px);
  font-weight:900;
  line-height:1.1;
}

.subtitle{
  font-size:clamp(9px,2.5vw,13px);
  margin-top:2px;
  opacity:.9;
}

/* =========================
   選択中
========================= */

.selectedArea{
  flex:0 0 auto;
  background:#fff;
  border-bottom:1px solid #ddd;
  padding:5px 8px;
}

.selectedInner{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  min-height:28px;
}

.selectedLabel{
  font-size:10px;
  color:#666;
  font-weight:bold;
}

.selectedColor{
  width:16px;
  height:16px;
  border-radius:50%;
  display:none;
  border:2px solid #fff;
  box-shadow:0 1px 4px rgba(0,0,0,.25);
}

.selectedName{
  font-size:clamp(13px,3.5vw,18px);
  font-weight:900;
  color:#222;
}

/* =========================
   ボード
========================= */

.boardWrap{
  flex:1 1 auto;
  min-height:0;
  padding:5px;
  overflow:hidden;
}

.board{
  width:100%;
  height:100%;
  display:grid;
  grid-template-columns:repeat(6,1fr);
  grid-template-rows:repeat(5,1fr);
  gap:4px;
}

.cell{
  position:relative;
  min-width:0;
  min-height:0;
  background:#fff;
  border:2px solid #ddd;
  border-radius:7px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  padding:3px 2px;
  overflow:hidden;
}

.cellNumber{
  font-size:clamp(9px,2.2vw,13px);
  font-weight:900;
  color:#555;
  line-height:1;
  margin-bottom:2px;
}

.goalCell{
  background:#fff3c4;
  border-color:#f59e0b;
}

.goalText{
  font-size:clamp(8px,2vw,12px);
  font-weight:900;
  color:#b45309;
}

.piecesInCell{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
  overflow:hidden;
}

/* コマ */
.piece{
  width:96%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  color:#fff;
  border-radius:5px;
  padding:4px 3px;
  font-size:clamp(8px,1.7vw,12px);
  font-weight:900;
  line-height:1.05;
  text-align:center;
  border:1px solid rgba(0,0,0,.15);
  box-shadow:0 1px 2px rgba(0,0,0,.15);
}

/* =========================
   ギフト
========================= */

.giftArea{
  flex:0 0 auto;
  padding:4px 5px;
  background:#fff;
  border-top:1px solid #ddd;
}

.giftGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:4px;
}

.giftBtn{
  border:0;
  border-radius:8px;
  min-height:40px;
  color:#fff;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 2px 4px rgba(0,0,0,.2);
}

.giftBtn:active{
  transform:scale(.96);
}

.giftIcon{
  font-size:18px;
  line-height:1;
}

.giftName{
  font-size:9px;
  margin-top:1px;
}

.gift1{
  background:#ef4444;
}

.gift2{
  background:#3b82f6;
}

.gift3{
  background:#22c55e;
}

/* =========================
   下部設定
========================= */

.bottomSettings{
  flex:0 0 auto;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:3px;
  padding:4px;
  background:#222;
}

.settingBtn{
  border:0;
  border-radius:6px;
  background:#444;
  color:#fff;
  min-height:34px;
  font-size:clamp(7px,1.9vw,10px);
  font-weight:900;
  cursor:pointer;
}

.settingBtn:active{
  background:#666;
  transform:scale(.97);
}

/* =========================
   モーダル
========================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:1000;
  padding:10px;
}

.modal.show{
  display:flex;
}

.modalBox{
  width:min(96vw,560px);
  max-height:92vh;
  max-height:92dvh;
  background:#fff;
  border-radius:14px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  box-shadow:0 10px 40px rgba(0,0,0,.4);
}

.modalHeader{
  flex:0 0 auto;
  background:#4c1d95;
  color:#fff;
  padding:11px;
  text-align:center;
  font-weight:900;
  font-size:17px;
}

.modalBody{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  padding:10px;
  -webkit-overflow-scrolling:touch;
}

.modalFooter{
  flex:0 0 auto;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  padding:7px;
  background:#f3f3f3;
  border-top:1px solid #ddd;
}

.modalFooter button{
  border:0;
  border-radius:8px;
  padding:10px;
  font-weight:900;
  cursor:pointer;
}

.cancelBtn{
  background:#ddd;
}

.okBtn{
  background:#4c1d95;
  color:#fff;
}

/* =========================
   コマ選択
========================= */

.pieceSelectList{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:6px;
}

.pieceSelectBtn{
  width:100%;
  border:2px solid #ddd;
  background:#fff;
  border-radius:9px;
  padding:8px 6px;
  display:flex;
  align-items:center;
  gap:7px;
  cursor:pointer;
  min-width:0;
}

.pieceSelectBtn:active{
  transform:scale(.97);
}

.pieceSelectBtn.selected{
  border-color:#4c1d95;
  background:#f1eafe;
  box-shadow:0 0 0 2px rgba(124,58,237,.15);
}

.colorDot{
  width:18px;
  height:18px;
  min-width:18px;
  border-radius:50%;
  border:2px solid #fff;
  box-shadow:0 1px 3px rgba(0,0,0,.25);
}

.pieceSelectName{
  flex:1;
  min-width:0;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  font-size:12px;
  font-weight:900;
  color:#222;
  text-align:left;
}

.checkMark{
  font-size:14px;
  font-weight:900;
  color:#4c1d95;
}

/* =========================
   フォーム
========================= */

.formGroup{
  margin-bottom:10px;
}

.formGroup label{
  display:block;
  font-size:11px;
  font-weight:900;
  margin-bottom:4px;
  color:#444;
}

.formGroup input,
.formGroup select{
  width:100%;
  border:1px solid #ccc;
  border-radius:7px;
  padding:8px;
  font-size:14px;
  background:#fff;
}

.twoCol{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

.smallAction{
  width:100%;
  border:0;
  border-radius:7px;
  padding:8px;
  background:#666;
  color:#fff;
  font-weight:900;
}

/* =========================
   コマ設定
========================= */

.pieceInfo{
  background:#f5f3ff;
  border-radius:8px;
  padding:8px;
  margin-bottom:8px;
  font-size:10px;
  line-height:1.5;
  color:#555;
}

.pieceSettingsList{
  display:flex;
  flex-direction:column;
  gap:4px;
}

.pieceSettingRow{
  display:grid;
  grid-template-columns:28px 1fr 42px;
  gap:5px;
  align-items:center;
  background:#f7f7f7;
  border-radius:7px;
  padding:4px;
}

.pieceSettingNo{
  text-align:center;
  font-size:10px;
  font-weight:900;
  color:#777;
}

.pieceSettingName{
  width:100%;
  min-width:0;
  border:1px solid #ccc;
  border-radius:6px;
  padding:6px;
  font-size:12px;
  font-weight:bold;
  background:#fff;
}

.pieceSettingColor{
  width:36px;
  height:32px;
  padding:1px;
  border:1px solid #bbb;
  border-radius:6px;
  background:#fff;
}

/* =========================
   ギフト設定
========================= */

.giftSettingCard{
  background:#f7f7f7;
  border-radius:9px;
  padding:8px;
  margin-bottom:8px;
}

.giftSettingTitle{
  font-size:12px;
  font-weight:900;
  margin-bottom:6px;
}

.giftPreview{
  display:flex;
  gap:5px;
  align-items:center;
  margin-bottom:6px;
}

.giftPreviewIcon{
  font-size:22px;
}

.giftSettingCard input,
.giftSettingCard select{
  width:100%;
  padding:7px;
  border:1px solid #ccc;
  border-radius:6px;
  margin-bottom:5px;
}

/* =========================
   仕掛け
========================= */

.trickCard{
  background:#f7f7f7;
  border-radius:9px;
  padding:8px;
  margin-bottom:7px;
}

.trickTitle{
  font-weight:900;
  font-size:12px;
  margin-bottom:5px;
}

.trickCard select,
.trickCard input{
  width:100%;
  padding:7px;
  border:1px solid #ccc;
  border-radius:6px;
}

/* =========================
   サイコロ
========================= */

.diceOverlay{
  position:fixed;
  inset:0;
  z-index:2000;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.72);
}

.diceOverlay.show{
  display:flex;
}

.diceBox{
  text-align:center;
  color:#fff;
}

.dice{
  width:125px;
  height:125px;
  border-radius:20px;
  background:#fff;
  color:#111;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:80px;
  font-weight:900;
  box-shadow:0 8px 30px rgba(0,0,0,.4);
  margin:auto;
}

.diceText{
  margin-top:12px;
  font-size:16px;
  font-weight:900;
}

/* =========================
   ポップアップ
========================= */

.popup{
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  z-index:3000;
  background:#222;
  color:#fff;
  padding:15px 20px;
  border-radius:12px;
  font-weight:900;
  font-size:14px;
  text-align:center;
  display:none;
  max-width:85vw;
  box-shadow:0 5px 30px rgba(0,0,0,.4);
}

.popup.show{
  display:block;
}

/* =========================
   小画面対応
========================= */

@media(max-width:360px){

  .pieceSelectList{
    grid-template-columns:1fr;
  }

  .giftBtn{
    min-height:36px;
  }

  .giftIcon{
    font-size:16px;
  }

  .giftName{
    font-size:8px;
  }

  .settingBtn{
    font-size:7px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- ヘッダー -->
  <header class="header">
    <div class="title" id="title">都道府県すごろく</div>
    <div class="subtitle" id="subtitle">ギフトでコマを進めよう！</div>
  </header>

  <!-- 選択中のコマ -->
  <div class="selectedArea">
    <div class="selectedInner">
      <span class="selectedLabel">選択中</span>
      <span class="selectedColor" id="selectedColor"></span>
      <span class="selectedName" id="selectedName">コマを選択してください</span>
    </div>
  </div>

  <!-- ボード -->
  <main class="boardWrap">
    <div class="board" id="board"></div>
  </main>

  <!-- ギフト -->
  <div class="giftArea">
    <div class="giftGrid" id="giftGrid"></div>
  </div>

  <!-- 設定 -->
  <div class="bottomSettings">

    <button class="settingBtn" onclick="openPieceModal()">
      🗾<br>コマ選択
    </button>

    <button class="settingBtn" onclick="openPieceSettings()">
      📝<br>コマ設定
    </button>

    <button class="settingBtn" onclick="openGiftSettings()">
      🎁<br>ギフト設定
    </button>

    <button class="settingBtn" onclick="openTrickSettings()">
      ⭐<br>仕掛け
    </button>

    <button class="settingBtn" onclick="resetGame()">
      🔄<br>リセット
    </button>

  </div>

</div>


<!-- =========================
     コマ選択モーダル
========================= -->

<div class="modal" id="pieceModal">

  <div class="modalBox">

    <div class="modalHeader">
      🗾 コマを選択
    </div>

    <div class="modalBody">

      <div class="pieceInfo">
        動かしたいコマをタップしてください。<br>
        選択したコマは「選択中」に表示されます。
      </div>

      <div class="pieceSelectList" id="pieceSelectList"></div>

    </div>

    <div class="modalFooter">

      <button class="cancelBtn" onclick="closeModal('pieceModal')">
        閉じる
      </button>

      <button class="okBtn" onclick="closeModal('pieceModal')">
        決定
      </button>

    </div>

  </div>

</div>


<!-- =========================
     コマ設定モーダル
========================= -->

<div class="modal" id="pieceSettingsModal">

  <div class="modalBox">

    <div class="modalHeader">
      📝 コマ設定
    </div>

    <div class="modalBody">

      <div class="pieceInfo">
        コマ数・コマの名称・色を変更できます。<br>
        最大50個まで設定できます。
      </div>

      <div class="twoCol">

        <div class="formGroup">
          <label>コマ数</label>
          <input
            type="number"
            id="pieceCount"
            min="1"
            max="50"
            onchange="updateEditingPieceCount()"
          >
        </div>

        <div class="formGroup">
          <label>一覧を更新</label>
          <button
            class="smallAction"
            onclick="updateEditingPieceCount()"
          >
            更新
          </button>
        </div>

      </div>

      <div class="pieceSettingsList" id="pieceSettingsList"></div>

    </div>

    <div class="modalFooter">

      <button class="cancelBtn" onclick="closeModal('pieceSettingsModal')">
        キャンセル
      </button>

      <button class="okBtn" onclick="savePieceSettings()">
        保存
      </button>

    </div>

  </div>

</div>


<!-- =========================
     ギフト設定
========================= -->

<div class="modal" id="giftSettingsModal">

  <div class="modalBox">

    <div class="modalHeader">
      🎁 ギフト設定
    </div>

    <div class="modalBody" id="giftSettingsBody"></div>

    <div class="modalFooter">

      <button class="cancelBtn" onclick="closeModal('giftSettingsModal')">
        閉じる
      </button>

      <button class="okBtn" onclick="saveGiftSettings()">
        保存
      </button>

    </div>

  </div>

</div>


<!-- =========================
     仕掛け設定
========================= -->

<div class="modal" id="trickSettingsModal">

  <div class="modalBox">

    <div class="modalHeader">
      ⭐ 仕掛け設定
    </div>

    <div class="modalBody" id="trickSettingsBody"></div>

    <div class="modalFooter">

      <button class="cancelBtn" onclick="closeModal('trickSettingsModal')">
        閉じる
      </button>

      <button class="okBtn" onclick="saveTrickSettings()">
        保存
      </button>

    </div>

  </div>

</div>


<!-- =========================
     サイコロ
========================= -->

<div class="diceOverlay" id="diceOverlay">

  <div class="diceBox">

    <div class="dice" id="dice">⚀</div>

    <div class="diceText" id="diceText">
      サイコロを振っています
    </div>

  </div>

</div>


<!-- ポップアップ -->
<div class="popup" id="popup"></div>


<script>

/* =====================================================
   初期コマ
===================================================== */

const defaultNames = [
  "北海道","青森県","岩手県","宮城県","秋田県",
  "山形県","福島県","茨城県","栃木県","群馬県",
  "埼玉県","千葉県","東京都","神奈川県","新潟県",
  "富山県","石川県","福井県","山梨県","長野県",
  "岐阜県","静岡県","愛知県","三重県","滋賀県",
  "京都府","大阪府","兵庫県","奈良県","和歌山県",
  "鳥取県","島根県","岡山県","広島県","山口県",
  "徳島県","香川県","愛媛県","高知県","福岡県",
  "佐賀県","長崎県","熊本県","大分県","宮崎県",
  "鹿児島県","沖縄県"
];


/* =====================================================
   色
===================================================== */

function hslToHex(h,s,l){

  s/=100;
  l/=100;

  const k=n=>(n+h/30)%12;
  const a=s*Math.min(l,1-l);

  const f=n=>
    l-a*Math.max(
      -1,
      Math.min(
        k(n)-3,
        Math.min(9-k(n),1)
      )
    );

  return "#"+
    [f(0),f(8),f(4)]
      .map(x=>Math.round(255*x)
      .toString(16)
      .padStart(2,"0"))
      .join("");
}

function defaultPieceColor(index){

  return hslToHex(
    (index*137.508)%360,
    72,
    45
  );

}


/* =====================================================
   コマデータ
===================================================== */

let pieces = defaultNames.map((name,index)=>({

  id:"piece"+(index+1),

  name:name,

  color:defaultPieceColor(index)

}));


/* =====================================================
   位置
===================================================== */

let positions = {};

pieces.forEach(piece=>{
  positions[piece.id] = 0;
});


/* =====================================================
   選択中コマ
===================================================== */

let selectedPiece = pieces[0].id;


/* =====================================================
   GOAL
===================================================== */

let GOAL = 30;


/* =====================================================
   ギフト
===================================================== */

let gifts = [

  {
    icon:"❤️",
    name:"ハートミー",
    type:"fixed",
    move:1,
    diceCount:1
  },

  {
    icon:"🍩",
    name:"ドーナツ",
    type:"fixed",
    move:3,
    diceCount:1
  },

  {
    icon:"🎁",
    name:"ギフト",
    type:"dice",
    move:0,
    diceCount:1
  },

  {
    icon:"🌟",
    name:"スター",
    type:"fixed",
    move:5,
    diceCount:1
  },

  {
    icon:"💎",
    name:"ダイヤ",
    type:"dice",
    move:0,
    diceCount:2
  }

];


/* =====================================================
   仕掛け
===================================================== */

let tricks = {};

for(let i=1;i<=99;i++){

  tricks[i] = {
    type:"none",
    value:1
  };

}


/* =====================================================
   ユーティリティ
===================================================== */

function getPiece(id){

  return pieces.find(piece=>piece.id===id);

}

function getPieceName(id){

  const piece = getPiece(id);

  return piece ? piece.name : "";

}

function closeModal(id){

  document.getElementById(id).classList.remove("show");

}

function openModal(id){

  document.getElementById(id).classList.add("show");

}

function showPopup(text){

  const popup = document.getElementById("popup");

  popup.textContent = text;

  popup.classList.add("show");

  setTimeout(()=>{
    popup.classList.remove("show");
  },1500);

}

function clamp(value,min,max){

  return Math.max(min,Math.min(max,value));

}

function escapeHtml(str){

  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   選択中表示
===================================================== */

function updateSelected(){

  const nameEl =
    document.getElementById("selectedName");

  const colorEl =
    document.getElementById("selectedColor");

  const piece = getPiece(selectedPiece);

  if(!piece){

    nameEl.textContent =
      "コマを選択してください";

    colorEl.style.display="none";

    return;

  }

  nameEl.textContent = piece.name;

  colorEl.style.display="inline-block";

  colorEl.style.background = piece.color;

}


/* =====================================================
   ボード描画
===================================================== */

function renderBoard(){

  const board =
    document.getElementById("board");

  board.innerHTML="";

  for(let i=0;i<GOAL;i++){

    const cell =
      document.createElement("div");

    cell.className="cell";

    if(i===GOAL-1){

      cell.classList.add("goalCell");

    }

    const number =
      document.createElement("div");

    number.className="cellNumber";

    number.textContent = i+1;

    cell.appendChild(number);


    if(i===GOAL-1){

      const goal =
        document.createElement("div");

      goal.className="goalText";

      goal.textContent="GOAL";

      cell.appendChild(goal);

    }


    const piecesBox =
      document.createElement("div");

    piecesBox.className="piecesInCell";


    pieces.forEach(piece=>{

      if(positions[piece.id]===i){

        const el =
          document.createElement("div");

        el.className="piece";

        el.textContent=piece.name;

        el.style.background=piece.color;

        piecesBox.appendChild(el);

      }

    });


    cell.appendChild(piecesBox);

    board.appendChild(cell);

  }

}

function openPieceModal(){

  const list =
    document.getElementById("pieceSelectList");

  list.innerHTML="";


  pieces.forEach(piece=>{

    const button =
      document.createElement("button");

    button.type="button";

    button.className="pieceSelectBtn";

    if(piece.id===selectedPiece){

      button.classList.add("selected");

    }


    /* 色 */
    const dot =
      document.createElement("span");

    dot.className="colorDot";

    dot.style.background=piece.color;


    /* 名前 */
    const name =
      document.createElement("span");

    name.className="pieceSelectName";

    name.textContent=piece.name;


    /* チェック */
    const check =
      document.createElement("span");

    check.className="checkMark";

    check.textContent =
      piece.id===selectedPiece ? "✓" : "";


    button.appendChild(dot);

    button.appendChild(name);

    button.appendChild(check);


    /*
      ★ここが重要
      ボタンを押した瞬間に
      selectedPieceを更新
    */
    button.addEventListener("click",()=>{

      selectedPiece=piece.id;

      updateSelected();

      renderBoard();

      /* 選択状態を画面上ですぐ更新 */
      document
        .querySelectorAll(".pieceSelectBtn")
        .forEach(btn=>{
          btn.classList.remove("selected");

          const mark =
            btn.querySelector(".checkMark");

          if(mark){
            mark.textContent="";
          }
        });

      button.classList.add("selected");

      check.textContent="✓";

      /*
        選択したらモーダルを閉じる
        → 次のギフト操作をすぐできる
      */
      closeModal("pieceModal");

      showPopup(
        "「"+piece.name+"」を選択しました"
      );

    });


    list.appendChild(button);

  });


  openModal("pieceModal");

}


/* =====================================================
   コマ設定
===================================================== */

let editingPieces=[];


function openPieceSettings(){

  /*
    現在のデータをコピー
    元データを直接壊さない
  */
  editingPieces =
    pieces.map(piece=>({
      id:piece.id,
      name:piece.name,
      color:piece.color
    }));

  document.getElementById("pieceCount").value =
    editingPieces.length;

  renderPieceSettingsList();

  openModal("pieceSettingsModal");

}


function syncEditingPieces(){

  editingPieces.forEach(piece=>{

    const nameInput =
      document.getElementById(
        "pieceName_"+piece.id
      );

    const colorInput =
      document.getElementById(
        "pieceColor_"+piece.id
      );

    if(nameInput){

      piece.name =
        nameInput.value;

    }

    if(colorInput){

      piece.color =
        colorInput.value;

    }

  });

}


function updateEditingPieceCount(){

  syncEditingPieces();

  let count =
    parseInt(
      document.getElementById("pieceCount").value,
      10
    );

  if(isNaN(count)) count=1;

  count=clamp(count,1,50);

  document.getElementById("pieceCount").value=count;


  /*
    コマを増やす
  */
  while(editingPieces.length<count){

    const index=editingPieces.length;

    editingPieces.push({

      id:"piece"+(index+1),

      name:
        defaultNames[index] ||
        "コマ"+(index+1),

      color:
        defaultPieceColor(index)

    });

  }


  /*
    コマを減らす
  */
  if(editingPieces.length>count){

    editingPieces =
      editingPieces.slice(0,count);

  }


  renderPieceSettingsList();

}


function renderPieceSettingsList(){

  const list =
    document.getElementById("pieceSettingsList");

  list.innerHTML="";


  editingPieces.forEach((piece,index)=>{

    const row =
      document.createElement("div");

    row.className="pieceSettingRow";


    const no =
      document.createElement("div");

    no.className="pieceSettingNo";

    no.textContent=index+1;


    const nameInput =
      document.createElement("input");

    nameInput.type="text";

    nameInput.className="pieceSettingName";

    nameInput.id=
      "pieceName_"+piece.id;

    nameInput.value=piece.name;

    nameInput.maxLength=20;


    nameInput.addEventListener("input",()=>{

      piece.name=nameInput.value;

    });


    const colorInput =
      document.createElement("input");

    colorInput.type="color";

    colorInput.className="pieceSettingColor";

    colorInput.id=
      "pieceColor_"+piece.id;

    colorInput.value =
      /^#[0-9A-Fa-f]{6}$/.test(piece.color)
        ? piece.color
        : defaultPieceColor(index);


    colorInput.addEventListener("input",()=>{

      piece.color=colorInput.value;

    });


    row.appendChild(no);

    row.appendChild(nameInput);

    row.appendChild(colorInput);

    list.appendChild(row);

  });

}


function savePieceSettings(){

  syncEditingPieces();

  let count =
    parseInt(
      document.getElementById("pieceCount").value,
      10
    );

  if(isNaN(count)) count=1;

  count=clamp(count,1,50);

  editingPieces =
    editingPieces.slice(0,count);


  /*
    空欄の名前を補正
  */
  editingPieces.forEach((piece,index)=>{

    piece.name =
      piece.name.trim() ||
      defaultNames[index] ||
      "コマ"+(index+1);

    if(!/^#[0-9A-Fa-f]{6}$/.test(piece.color)){

      piece.color =
        defaultPieceColor(index);

    }

  });


  const newIds =
    new Set(
      editingPieces.map(piece=>piece.id)
    );


  /*
    新しいコマを登録
  */
  editingPieces.forEach(piece=>{

    if(
      positions[piece.id] === undefined
    ){

      positions[piece.id]=0;

    }

  });


  /*
    消えたコマの位置を削除
  */
  Object.keys(positions).forEach(id=>{

    if(!newIds.has(id)){

      delete positions[id];

    }

  });


  /*
    コマデータを更新
  */
  pieces =
    editingPieces.map(piece=>({
      id:piece.id,
      name:piece.name,
      color:piece.color
    }));


  /*
    選択中コマが消えた場合
  */
  if(!newIds.has(selectedPiece)){

    selectedPiece =
      pieces.length
        ? pieces[0].id
        : null;

  }


  renderBoard();

  updateSelected();

  closeModal("pieceSettingsModal");

  showPopup(
    "コマ設定を保存しました"
  );

}

/* =====================================================
   ギフトで移動
===================================================== */

async function moveByGift(index){

  if(!selectedPiece){

    showPopup(
      "先にコマを選択してください"
    );

    return;

  }


  const gift=gifts[index];


  if(gift.type==="fixed"){

    moveSelected(gift.move);

  }else{

    await rollDice(gift.diceCount);

  }

}


/* =====================================================
   コマ移動
===================================================== */

function moveSelected(move){

  const piece =
    getPiece(selectedPiece);

  if(!piece) return;


  let oldPos =
    positions[selectedPiece] || 0;

  let newPos =
    oldPos + move;


  if(newPos>=GOAL){

    newPos=GOAL-1;

    positions[selectedPiece]=newPos;

    renderBoard();

    showPopup(
      piece.name+" がGOAL！"
    );

    triggerTrick(newPos+1);

    return;

  }


  positions[selectedPiece]=newPos;

  renderBoard();

  showPopup(
    piece.name+
    " が "+
    move+
    "マス進みました"
  );


  triggerTrick(newPos+1);

}


/* =====================================================
   サイコロ
===================================================== */

const diceFaces=[
  "⚀","⚁","⚂","⚃","⚄","⚅"
];


function sleep(ms){

  return new Promise(resolve=>
    setTimeout(resolve,ms)
  );

}


async function rollDice(count){

  const overlay =
    document.getElementById("diceOverlay");

  const dice =
    document.getElementById("dice");

  const text =
    document.getElementById("diceText");


  overlay.classList.add("show");


  let total=0;


  for(let i=0;i<count;i++){

    text.textContent =
      (i+1)+"回目のサイコロ";


    for(let j=0;j<18;j++){

      const n =
        Math.floor(Math.random()*6);

      dice.textContent=
        diceFaces[n];

      await sleep(65);

    }


    const result =
      Math.floor(Math.random()*6)+1;

    dice.textContent=
      diceFaces[result-1];

    total+=result;

    await sleep(500);

  }


  text.textContent=
    count===1
      ? "出目："+total
      : "合計："+total;


  await sleep(700);

  overlay.classList.remove("show");


  moveSelected(total);

}


/* =====================================================
   仕掛け
===================================================== */

function triggerTrick(cellNumber){

  const trick =
    tricks[cellNumber];

  if(!trick ||
     trick.type==="none"){

    return;

  }


  const piece =
    getPiece(selectedPiece);

  if(!piece) return;


  switch(trick.type){

    case "forward":

      positions[selectedPiece]=
        Math.min(
          GOAL-1,
          positions[selectedPiece]+trick.value
        );

      renderBoard();

      showPopup(
        piece.name+
        " が仕掛けで "+
        trick.value+
        "マス進みました"
      );

      break;


    case "back":

      positions[selectedPiece]=
        Math.max(
          0,
          positions[selectedPiece]-trick.value
        );

      renderBoard();

      showPopup(
        piece.name+
        " が仕掛けで "+
        trick.value+
        "マス戻りました"
      );

      break;


    case "start":

      positions[selectedPiece]=0;

      renderBoard();

      showPopup(
        piece.name+" はスタートへ！"
      );

      break;


    case "goal":

      positions[selectedPiece]=GOAL-1;

      renderBoard();

      showPopup(
        piece.name+" はGOALへ！"
      );

      break;


    case "again":

      showPopup(
        "もう一度！"
      );

      break;


    case "display":

      showPopup(
        trick.value
      );

      break;


    case "previousBack":{

      const index =
        pieces.findIndex(
          p=>p.id===selectedPiece
        );

      if(index>0){

        const previous =
          pieces[index-1];

        positions[previous.id]=
          Math.max(
            0,
            positions[previous.id]-trick.value
          );

        renderBoard();

        showPopup(
          previous.name+
          " が "+
          trick.value+
          "マス戻りました"
        );

      }

      break;

    }


    case "previousStart":{

      const index =
        pieces.findIndex(
          p=>p.id===selectedPiece
        );

      if(index>0){

        const previous =
          pieces[index-1];

        positions[previous.id]=0;

        renderBoard();

        showPopup(
          previous.name+
          " はスタートへ！"
        );

      }

      break;

    }


    case "swapPrevious":{

      const index =
        pieces.findIndex(
          p=>p.id===selectedPiece
        );

      if(index>0){

        const previous =
          pieces[index-1];

        const temp =
          positions[selectedPiece];

        positions[selectedPiece]=
          positions[previous.id];

        positions[previous.id]=temp;

        renderBoard();

        showPopup(
          piece.name+
          " と "+
          previous.name+
          " の位置を交換！"
        );

      }

      break;

    }


    case "leaderBack":{

      let leader=null;

      let max=-1;

      pieces.forEach(p=>{

        if(
          p.id!==selectedPiece &&
          positions[p.id]>max
        ){

          max=positions[p.id];

          leader=p;

        }

      });


      if(leader){

        positions[leader.id]=
          Math.max(
            0,
            positions[leader.id]-trick.value
          );

        renderBoard();

        showPopup(
          leader.name+
          " が "+
          trick.value+
          "マス戻りました"
        );

      }

      break;

    }


    case "lastForward":{

      let last=null;

      let min=Infinity;

      pieces.forEach(p=>{

        if(
          p.id!==selectedPiece &&
          positions[p.id]<min
        ){

          min=positions[p.id];

          last=p;

        }

      });


      if(last){

        positions[last.id]=
          Math.min(
            GOAL-1,
            positions[last.id]+trick.value
          );

        renderBoard();

        showPopup(
          last.name+
          " が "+
          trick.value+
          "マス進みました"
        );

      }

      break;

    }

  }

}

/* =====================================================
   仕掛け設定
===================================================== */

const trickOptions = [

  ["none","なし"],

  ["forward","このコマを指定マス進める"],

  ["back","このコマを指定マス戻す"],

  ["start","このコマをスタートへ"],

  ["goal","このコマをGOALへ"],

  ["again","もう一度"],

  ["display","文字を表示"],

  ["previousBack","一つ前のコマを指定マス戻す"],

  ["previousStart","一つ前のコマをスタートへ"],

  ["swapPrevious","一つ前のコマと位置交換"],

  ["leaderBack","先頭のコマを指定マス戻す"],

  ["lastForward","最後尾のコマを指定マス進める"]

];


function openTrickSettings(){

  const body =
    document.getElementById("trickSettingsBody");

  body.innerHTML="";


  for(let i=1;i<=GOAL;i++){

    const card =
      document.createElement("div");

    card.className="trickCard";


    const current =
      tricks[i] || {
        type:"none",
        value:1
      };


    let options="";

    trickOptions.forEach(option=>{

      options+=`

        <option
          value="${option[0]}"
          ${current.type===option[0]?"selected":""}
        >
          ${option[1]}
        </option>

      `;

    });


    card.innerHTML=`

      <div class="trickTitle">
        マス ${i}
      </div>

      <select
        id="trickType${i}"
      >
        ${options}
      </select>

      <input
        id="trickValue${i}"
        type="text"
        value="${escapeHtml(current.value)}"
        placeholder="マス数・表示文字"
      >

    `;


    body.appendChild(card);

  }


  openModal("trickSettingsModal");

}


function saveTrickSettings(){

  for(let i=1;i<=GOAL;i++){

    const type =
      document.getElementById(
        "trickType"+i
      ).value;

    const value =
      document.getElementById(
        "trickValue"+i
      ).value;


    tricks[i]={
      type:type,
      value:
        type==="display"
          ? value
          : (
              parseInt(value,10) || 1
            )
    };

  }


  closeModal("trickSettingsModal");

  showPopup(
    "仕掛け設定を保存しました"
  );

}

   リセット
===================================================== */

function resetGame(){

  if(!confirm("ゲームをリセットしますか？")){

    return;

  }


  pieces.forEach(piece=>{

    positions[piece.id]=0;

  });


  if(pieces.length){

    selectedPiece=
      pieces[0].id;

  }else{

    selectedPiece=null;

  }


  renderBoard();

  updateSelected();

  showPopup(
    "ゲームをリセットしました"
  );

}
