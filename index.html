<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>都道府県すごろく</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans JP",
    "Hiragino Kaku Gothic ProN",
    Meiryo,
    sans-serif;
  background:#222;
}

button,input{
  font-family:inherit;
}

/* =========================================
   9:16 メイン画面
========================================= */

#app{
  position:relative;
  width:100vw;
  height:100dvh;
  max-width:100vw;
  max-height:100dvh;
  overflow:hidden;
  background:linear-gradient(
    180deg,
    #fff7fb 0%,
    #f4f1ff 55%,
    #eefaff 100%
  );
}

/* =========================================
   タイトル
   ★ ここは固定高さ
========================================= */

#header{
  position:absolute;
  left:0;
  right:0;
  top:0;
  height:12dvh;
  min-height:72px;
  max-height:110px;
  z-index:50;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  padding:6px 10px;

  background:#ffffff;
  border-bottom:3px solid #222;
  box-shadow:0 2px 8px rgba(0,0,0,.12);
}

#title{
  width:100%;
  margin:0;
  padding:0;

  color:#111;
  font-size:clamp(16px,5vw,28px);
  font-weight:1000;
  line-height:1.15;
  text-align:center;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

#subtitle{
  width:100%;
  margin-top:5px;

  color:#666;
  font-size:clamp(9px,2.7vw,14px);
  font-weight:800;
  line-height:1.1;
  text-align:center;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* =========================================
   メインコンテンツ
========================================= */

#main{
  position:absolute;
  left:0;
  right:0;
  top:12dvh;
  bottom:0;

  padding:
    7px
    7px
    max(7px, env(safe-area-inset-bottom))
    7px;

  display:flex;
  flex-direction:column;
  gap:6px;

  overflow:hidden;
}

/* =========================================
   TOP3
========================================= */

#ranking{
  flex:0 0 7.5%;
  min-height:52px;

  background:#fff;
  border-radius:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.09);

  padding:4px;
}

#rankingTitle{
  height:25%;
  display:flex;
  align-items:center;
  justify-content:center;

  font-size:clamp(8px,2.5vw,13px);
  font-weight:1000;
}

#rankingList{
  height:75%;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:4px;
}

.rank{
  min-width:0;
  border-radius:8px;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:3px;

  overflow:hidden;
  font-weight:1000;
}

.rank:nth-child(1){
  background:#fff0a0;
}

.rank:nth-child(2){
  background:#eeeeee;
}

.rank:nth-child(3){
  background:#efd8c0;
}

.rankMedal{
  font-size:clamp(10px,3vw,16px);
}

.rankName{
  max-width:65%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;

  font-size:clamp(7px,2.1vw,12px);
}

/* =========================================
   コマ選択
========================================= */

#selectRow{
  flex:0 0 6%;
  min-height:42px;

  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
}

.actionButton{
  border:0;
  border-radius:10px;

  color:#fff;
  background:#222;

  font-size:clamp(9px,2.8vw,14px);
  font-weight:1000;
}

#selectedBox{
  flex:0 0 5%;
  min-height:34px;

  border-radius:9px;
  background:#fff;

  display:flex;
  align-items:center;
  justify-content:center;

  box-shadow:0 2px 7px rgba(0,0,0,.06);

  font-size:clamp(8px,2.5vw,13px);
  font-weight:1000;
}

#selectedLabel{
  color:#777;
  margin-right:6px;
}

#selectedName{
  max-width:65%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

/* =========================================
   すごろく盤
   ★ 一番大きく確保
========================================= */

#boardBox{
  flex:1 1 auto;
  min-height:0;

  background:#fff;
  border-radius:13px;

  padding:5px;

  box-shadow:0 3px 12px rgba(0,0,0,.1);

  display:flex;
  flex-direction:column;
  overflow:hidden;
}

#boardHeader{
  flex:0 0 8%;
  min-height:28px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:clamp(9px,2.8vw,14px);
  font-weight:1000;
}

#board{
  flex:1;
  min-height:0;

  display:grid;
  grid-template-columns:repeat(6,1fr);
  grid-template-rows:repeat(5,1fr);

  gap:4px;

  overflow:hidden;
}

/* =========================================
   マス
========================================= */

.cell{
  position:relative;

  min-width:0;
  min-height:0;

  border:2px solid #d7d7d7;
  border-radius:9px;

  background:#fafafa;

  overflow:hidden;
}

.cell.goal{
  background:#fff0a0;
  border-color:#d4aa00;
}

.cellNumber{
  position:absolute;
  top:2px;
  left:4px;

  font-size:clamp(6px,1.9vw,10px);
  color:#777;
  font-weight:1000;

  z-index:5;
}

.goalText{
  position:absolute;
  top:2px;
  right:3px;

  font-size:clamp(5px,1.6vw,9px);
  color:#8a6900;
  font-weight:1000;

  z-index:5;
}

.cellPieces{
  position:absolute;
  left:2px;
  right:2px;
  top:18%;
  bottom:2px;

  display:flex;
  flex-wrap:wrap;
  align-content:center;
  justify-content:center;

  gap:3px;

  overflow:hidden;
}

/* =========================================
   コマ
   ★ 大きめ
========================================= */

.piece{
  min-width:47%;
  max-width:98%;

  padding:5px 6px;

  border:2px solid #fff;
  border-radius:18px;

  color:#fff;

  font-size:clamp(6px,2vw,11px);
  font-weight:1000;
  line-height:1.05;

  text-align:center;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;

  box-shadow:0 2px 5px rgba(0,0,0,.28);

  cursor:pointer;
}

.piece.active{
  outline:3px solid #111;
  transform:scale(1.05);
  z-index:10;
}

/* =========================================
   ギフト
========================================= */

#giftBox{
  flex:0 0 11%;
  min-height:65px;

  background:#fff;
  border-radius:11px;

  padding:4px;

  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

#giftTitle{
  height:27%;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:clamp(7px,2.2vw,11px);
  font-weight:1000;
}

#giftButtons{
  height:73%;

  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:4px;
}

.giftButton{
  border:0;
  border-radius:8px;

  background:#f1f1f1;

  font-size:clamp(6px,2vw,10px);
  line-height:1.1;

  font-weight:1000;
}

.giftButton:active{
  transform:scale(.96);
}

/* =========================================
   下部操作
========================================= */

#bottomButtons{
  flex:0 0 6%;
  min-height:40px;

  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:4px;
}

.bottomButton{
  border:0;
  border-radius:9px;

  color:#fff;

  font-size:clamp(6px,2vw,10px);
  font-weight:1000;
}

#projectButton{
  background:#673ab7;
}

#giftSettingButton{
  background:#00897b;
}

#resetButton{
  background:#222;
}

/* =========================================
   モーダル
========================================= */

.modal{
  position:absolute;
  inset:0;

  z-index:100;

  display:none;
  align-items:center;
  justify-content:center;

  padding:12px;

  background:rgba(0,0,0,.7);
}

.modal.show{
  display:flex;
}

.modalBox{
  width:100%;
  max-width:430px;
  max-height:92%;

  background:#fff;
  border-radius:17px;

  padding:12px;

  display:flex;
  flex-direction:column;

  overflow:hidden;
}

.modalHeader{
  flex:0 0 42px;

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.modalTitle{
  font-size:clamp(15px,4.5vw,21px);
  font-weight:1000;
}

.closeButton{
  width:36px;
  height:36px;

  border:0;
  border-radius:50%;

  background:#eee;

  font-size:20px;
  font-weight:1000;
}

.modalScroll{
  flex:1;
  min-height:0;

  overflow:auto;

  padding:2px 1px;
}

.settingLabel{
  display:block;

  margin:10px 0 4px;

  font-size:11px;
  font-weight:1000;
}

.input{
  width:100%;
  height:40px;

  border:1px solid #ddd;
  border-radius:8px;

  padding:0 9px;

  font-size:12px;
  font-weight:800;

  outline:none;
}

.row2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
}

.smallHelp{
  margin-top:3px;

  color:#777;

  font-size:9px;
  font-weight:700;
}

.pieceInputs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
}

.pieceInput{
  display:grid;
  grid-template-columns:27px 1fr;
  gap:4px;
}

.pieceNumber{
  display:flex;
  align-items:center;
  justify-content:center;

  background:#eee;
  border-radius:6px;

  font-size:9px;
  font-weight:1000;
}

.modalButtons{
  flex:0 0 43px;

  margin-top:8px;

  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
}

.modalButton{
  border:0;
  border-radius:9px;

  font-size:12px;
  font-weight:1000;
}

.saveButton{
  background:#222;
  color:#fff;
}

.cancelButton{
  background:#eee;
}

/* =========================================
   コマ選択
========================================= */

.chooseGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
}

.chooseButton{
  min-height:48px;

  border:1px solid #ddd;
  border-radius:9px;

  background:#f7f7f7;

  font-size:clamp(8px,2.6vw,13px);
  font-weight:1000;
}

.chooseButton.current{
  background:#222;
  color:#fff;
}

/* =========================================
   ギフト設定
========================================= */

.giftSettingRow{
  margin-bottom:11px;
}

.giftSettingTitle{
  margin-bottom:4px;

  font-size:10px;
  font-weight:1000;
}

.giftSettingInputs{
  display:grid;
  grid-template-columns:45px 1fr 70px;
  gap:5px;
}

/* =========================================
   ポップアップ
========================================= */

#popup{
  position:absolute;
  inset:0;

  z-index:300;

  display:none;
  align-items:center;
  justify-content:center;

  background:rgba(0,0,0,.5);
}

#popup.show{
  display:flex;
}

.popupBox{
  width:80%;
  max-width:310px;

  background:#fff;
  border-radius:18px;

  padding:20px 15px;

  text-align:center;
}

.popupIcon{
  font-size:40px;
}

.popupTitle{
  margin-top:4px;

  font-size:18px;
  font-weight:1000;
}

.popupText{
  margin-top:7px;

  color:#555;

  font-size:12px;
  line-height:1.5;

  font-weight:800;
}

.popupClose{
  width:100%;
  height:42px;

  margin-top:14px;

  border:0;
  border-radius:9px;

  background:#222;
  color:#fff;

  font-weight:1000;
}

/* =========================================
   横幅が極端に小さい端末
========================================= */

@media(max-width:340px){

  #header{
    height:11dvh;
  }

  #main{
    top:11dvh;
  }

  #board{
    gap:2px;
  }

  .cell{
    border-width:1px;
    border-radius:6px;
  }

  .piece{
    padding:3px 4px;
    border-radius:13px;
  }

}
</style>
</head>

<body>

<div id="app">

  <!-- =====================================
       ★ タイトル固定
  ====================================== -->

  <header id="header">

    <h1 id="title">
      🗾 出身県はどこ？県民パワーでGOALを目指せ！
    </h1>

    <div id="subtitle">
      指定ギフトでコマを進めよう！
    </div>

  </header>


  <!-- =====================================
       メイン
  ====================================== -->

  <main id="main">


    <!-- TOP3 -->

    <section id="ranking">

      <div id="rankingTitle">
        🏆 現在のTOP3
      </div>

      <div id="rankingList"></div>

    </section>


    <!-- コマ操作 -->

    <section id="selectRow">

      <button
        class="actionButton"
        onclick="openChooseModal()">
        🎯 コマを選ぶ
      </button>

      <button
        class="actionButton"
        onclick="moveSelected(1,'🎲')">
        🎲 1マス進む
      </button>

    </section>


    <!-- 選択中 -->

    <div id="selectedBox">

      <span id="selectedLabel">
        選択中：
      </span>

      <span id="selectedName">
        コマを選んでください
      </span>

    </div>


    <!-- =================================
         すごろく
    ================================== -->

    <section id="boardBox">

      <div id="boardHeader">
        🏁 GOALまであと0マス
      </div>

      <div id="board"></div>

    </section>


    <!-- =================================
         ギフト
    ================================== -->

    <section id="giftBox">

      <div id="giftTitle">
        🎁 指定ギフトが来たらコマを進めよう！
      </div>

      <div id="giftButtons"></div>

    </section>


    <!-- =================================
         下部ボタン
    ================================== -->

    <section id="bottomButtons">

      <button
        id="projectButton"
        class="bottomButton"
        onclick="openProjectModal()">
        ⚙️ 企画設定
      </button>

      <button
        id="giftSettingButton"
        class="bottomButton"
        onclick="openGiftModal()">
        🎁 ギフト設定
      </button>

      <button
        id="resetButton"
        class="bottomButton"
        onclick="resetGame()">
        🔄 リセット
      </button>

    </section>


  </main>


  <!-- =====================================
       企画設定
  ====================================== -->

  <div
    id="projectModal"
    class="modal">

    <div class="modalBox">

      <div class="modalHeader">

        <div class="modalTitle">
          ⚙️ 企画設定
        </div>

        <button
          class="closeButton"
          onclick="closeProjectModal()">
          ×
        </button>

      </div>


      <div class="modalScroll">


        <label class="settingLabel">
          企画タイトル
        </label>

        <input
          id="titleInput"
          class="input"
          type="text">


        <label class="settingLabel">
          サブタイトル
        </label>

        <input
          id="subtitleInput"
          class="input"
          type="text">


        <label class="settingLabel">
          コマ数 ／ GOAL
        </label>

        <div class="row2">

          <input
            id="pieceCountInput"
            class="input"
            type="number"
            min="1"
            max="47"
            onchange="buildPieceInputs()">

          <input
            id="goalInput"
            class="input"
            type="number"
            min="1"
            max="30">

        </div>

        <div class="smallHelp">
          コマ数は1～47、GOALは1～30マス。
        </div>


        <label class="settingLabel">
          コマの名称
        </label>

        <div
          id="pieceInputs"
          class="pieceInputs">
        </div>


      </div>


      <div class="modalButtons">

        <button
          class="modalButton saveButton"
          onclick="saveProjectSettings()">
          保存
        </button>

        <button
          class="modalButton cancelButton"
          onclick="closeProjectModal()">
          キャンセル
        </button>

      </div>

    </div>

  </div>


  <!-- =====================================
       コマ選択
  ====================================== -->

  <div
    id="chooseModal"
    class="modal">

    <div
      class="modalBox"
      style="height:90%;">

      <div class="modalHeader">

        <div class="modalTitle">
          🎯 コマを選ぶ
        </div>

        <button
          class="closeButton"
          onclick="closeChooseModal()">
          ×
        </button>

      </div>

      <div class="modalScroll">

        <div
          id="chooseGrid"
          class="chooseGrid">
        </div>

      </div>

    </div>

  </div>


  <!-- =====================================
       ギフト設定
  ====================================== -->

  <div
    id="giftModal"
    class="modal">

    <div
      class="modalBox"
      style="height:90%;">

      <div class="modalHeader">

        <div class="modalTitle">
          🎁 ギフト設定
        </div>

        <button
          class="closeButton"
          onclick="closeGiftModal()">
          ×
        </button>

      </div>


      <div
        id="giftSettingRows"
        class="modalScroll">
      </div>


      <div class="modalButtons">

        <button
          class="modalButton saveButton"
          onclick="saveGiftSettings()">
          保存
        </button>

        <button
          class="modalButton cancelButton"
          onclick="closeGiftModal()">
          キャンセル
        </button>

      </div>

    </div>

  </div>


  <!-- =====================================
       ポップアップ
  ====================================== -->

  <div id="popup">

    <div class="popupBox">

      <div
        id="popupIcon"
        class="popupIcon">
        🎁
      </div>

      <div
        id="popupTitle"
        class="popupTitle">
        コマが進んだ！
      </div>

      <div
        id="popupText"
        class="popupText">
      </div>

      <button
        class="popupClose"
        onclick="closePopup()">
        閉じる
      </button>

    </div>

  </div>


</div>


<script>

/* =====================================================
   初期設定
===================================================== */

let projectTitle =
  "🗾 出身県はどこ？県民パワーでGOALを目指せ！";

let projectSubtitle =
  "指定ギフトでコマを進めよう！";

let GOAL = 30;


/* =====================================================
   47都道府県
===================================================== */

let pieces = [

  "北海道",

  "青森県",
  "岩手県",
  "宮城県",
  "秋田県",

  "福島県",

  "茨城県",

  "新潟県",

  "三重県",

  "和歌山県",

  "鳥取県",

  "広島県",
  "山口県",

  "徳島県",

  "高知県",

  "福岡県",
  "佐賀県",
  "長崎県",
  "熊本県",
  "大分県",
  "宮崎県",
  "鹿児島県",
  "沖縄県"

];


/* =====================================================
   カラフルなコマ
===================================================== */

const colors = [

  "#e53935",
  "#8e24aa",
  "#3949ab",
  "#1e88e5",
  "#00897b",
  "#43a047",
  "#7cb342",
  "#c0ca33",
  "#f9a825",

  "#f4511e",

  "#5e35b1",
  "#00acc1",
  "#00838f",
  "#2e7d32",
  "#558b2f",
  "#827717",
  "#ef6c00",
  "#bf360c",
  "#c62828",
  "#6a1b9a",
  "#283593",
  "#1565c0",
  "#00695c",
  "#689f38",
  "#9e9d24",
  "#ff6f00",
  "#e65100",
  "#b71c1c",
  "#880e4f",
  "#4527a0",
  "#311b92",
  "#0277bd",
  "#00838f",
  "#00695c",
  "#33691e",
  "#827717",
  "#ff8f00",
  "#e65100",
  "#4e342e",
  "#3949ab",
  "#00897b"

];


/* =====================================================
   位置
===================================================== */

let positions = {};

let selectedPiece = null;


/* =====================================================
   位置を初期化
===================================================== */

function initializePositions(){

  positions = {};

  pieces.forEach(function(name){

    positions[name] = 0;

  });

}


/* =====================================================
   ギフト
===================================================== */

let gifts = [

  {
    icon:"❤️",
    name:"ハートミー",
    move:1
  },

  {
    icon:"🍩",
    name:"ドーナツ",
    move:3
  },

  {
    icon:"🎁",
    name:"指定ギフト",
    move:5
  },

  {
    icon:"⭐",
    name:"スペシャル",
    move:10
  },

  {
    icon:"🌟",
    name:"特大ギフト",
    move:20
  }

];


/* =====================================================
   タイトル更新
===================================================== */

function updateTitle(){

  document.getElementById("title").textContent =
    projectTitle;

  document.getElementById("subtitle").textContent =
    projectSubtitle;

}


/* =====================================================
   盤面作成
===================================================== */

function createBoard(){

  const board =
    document.getElementById("board");

  board.innerHTML = "";

  /*
    30マスまでなら
    6列 × 5行で表示
  */

  for(
    let i = 1;
    i <= GOAL;
    i++
  ){

    const cell =
      document.createElement("div");

    cell.className = "cell";

    cell.id = "cell-" + i;


    /* マス番号 */

    const number =
      document.createElement("div");

    number.className = "cellNumber";

    number.textContent = i;


    /* コマ置き場 */

    const piecesArea =
      document.createElement("div");

    piecesArea.className =
      "cellPieces";

    piecesArea.id =
      "cellPieces-" + i;


    cell.appendChild(number);

    cell.appendChild(piecesArea);


    /* GOAL */

    if(i === GOAL){

      cell.classList.add("goal");

      const goal =
        document.createElement("div");

      goal.className = "goalText";

      goal.textContent = "🏁GOAL";

      cell.appendChild(goal);

    }


    board.appendChild(cell);

  }

}


/* =====================================================
   コマを描画
===================================================== */

function renderPieces(){

  document
    .querySelectorAll(".cellPieces")
    .forEach(function(el){

      el.innerHTML = "";

    });


  pieces.forEach(function(name,index){

    const position =
      positions[name] || 0;


    /*
      START位置0の場合は
      盤面には表示しない
    */

    if(position <= 0){
      return;
    }


    const area =
      document.getElementById(
        "cellPieces-" + position
      );

    if(!area){
      return;
    }


    const piece =
      document.createElement("div");

    piece.className = "piece";


    if(name === selectedPiece){

      piece.classList.add("active");

    }


    piece.textContent = name;


    piece.style.background =
      colors[index % colors.length];


    piece.onclick = function(){

      selectPiece(name);

    };


    area.appendChild(piece);

  });


  updateBoardHeader();

}


/* =====================================================
   盤面ヘッダー
===================================================== */

function updateBoardHeader(){

  if(!selectedPiece){

    document.getElementById("boardHeader").textContent =
      "🏁 GOALまであと" + GOAL + "マス";

    return;

  }


  const position =
    positions[selectedPiece] || 0;


  const remaining =
    Math.max(
      0,
      GOAL - position
    );


  document.getElementById("boardHeader").textContent =
    "🎯 " +
    selectedPiece +
    "　｜　GOALまであと" +
    remaining +
    "マス";

}


/* =====================================================
   ランキング
===================================================== */

function updateRanking(){

  const list =
    document.getElementById("rankingList");

  list.innerHTML = "";


  const sorted =
    pieces
      .map(function(name){

        return {
          name:name,
          position:positions[name] || 0
        };

      })
      .sort(function(a,b){

        return b.position - a.position;

      });


  const top =
    sorted.slice(0,3);


  const medals = [
    "🥇",
    "🥈",
    "🥉"
  ];


  top.forEach(function(item,index){

    const div =
      document.createElement("div");

    div.className = "rank";


    div.innerHTML =
      '<span class="rankMedal">' +
      medals[index] +
      '</span>' +

      '<span class="rankName">' +
      escapeHTML(item.name) +
      '</span>';


    list.appendChild(div);

  });

}


/* =====================================================
   HTMLエスケープ
===================================================== */

function escapeHTML(str){

  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   コマ選択
===================================================== */

function selectPiece(name){

  selectedPiece = name;


  document.getElementById("selectedName")
    .textContent = name;


  renderPieces();

  updateRanking();

}


/* =====================================================
   コマ選択画面
===================================================== */

function openChooseModal(){

  createChooseButtons();

  document
    .getElementById("chooseModal")
    .classList.add("show");

}


function closeChooseModal(){

  document
    .getElementById("chooseModal")
    .classList.remove("show");

}


function createChooseButtons(){

  const grid =
    document.getElementById("chooseGrid");

  grid.innerHTML = "";


  pieces.forEach(function(name){

    const button =
      document.createElement("button");

    button.className =
      "chooseButton";


    if(name === selectedPiece){

      button.classList.add("current");

    }


    button.textContent = name;


    button.onclick = function(){

      selectPiece(name);

      closeChooseModal();

    };


    grid.appendChild(button);

  });

}


/* =====================================================
   ギフトボタン
===================================================== */

function createGiftButtons(){

  const area =
    document.getElementById("giftButtons");

  area.innerHTML = "";


  /*
    画面には3種類表示
  */

  gifts
    .slice(0,3)
    .forEach(function(gift){

      const button =
        document.createElement("button");

      button.className =
        "giftButton";


      button.innerHTML =
        escapeHTML(gift.icon) +
        " " +
        escapeHTML(gift.name) +
        "<br>＋" +
        gift.move +
        "マス";


      button.onclick = function(){

        moveSelected(
          gift.move,
          gift.icon
        );

      };


      area.appendChild(button);

    });

}


/* =====================================================
   コマを進める
===================================================== */

function moveSelected(
  move,
  icon
){

  if(!selectedPiece){

    showPopup(
      "⚠️",
      "コマを選んでね！",
      "先に「🎯 コマを選ぶ」から都道府県を選択してください。"
    );

    return;

  }


  const oldPosition =
    positions[selectedPiece] || 0;


  if(oldPosition >= GOAL){

    showPopup(
      "🏁",
      "GOAL済み！",
      selectedPiece + "はすでにゴールしています。"
    );

    return;

  }


  const nextPosition =
    Math.min(
      GOAL,
      oldPosition + move
    );


  positions[selectedPiece] =
    nextPosition;


  renderPieces();

  updateRanking();


  if(nextPosition >= GOAL){

    showPopup(
      "🏆",
      "GOAL！",
      selectedPiece +
      "がゴールしました！"
    );

  }
  else{

    showPopup(
      icon,
      "コマが進んだ！",
      selectedPiece +
      "が" +
      (nextPosition-oldPosition) +
      "マス進みました！"
    );

  }

}


/* =====================================================
   企画設定
===================================================== */

function openProjectModal(){

  document.getElementById("titleInput").value =
    projectTitle;

  document.getElementById("subtitleInput").value =
    projectSubtitle;

  document.getElementById("pieceCountInput").value =
    pieces.length;

  document.getElementById("goalInput").value =
    GOAL;


  buildPieceInputs();


  document
    .getElementById("projectModal")
    .classList.add("show");

}


function closeProjectModal(){

  document
    .getElementById("projectModal")
    .classList.remove("show");

}


/* =====================================================
   コマ名称入力欄
===================================================== */

function buildPieceInputs(){

  let count =
    Number(
      document.getElementById(
        "pieceCountInput"
      ).value
    );


  if(!count || count < 1){
    count = 1;
  }

  if(count > 47){
    count = 47;
  }


  const area =
    document.getElementById("pieceInputs");

  area.innerHTML = "";


  for(let i=0;i<count;i++){

    const row =
      document.createElement("div");

    row.className = "pieceInput";


    const number =
      document.createElement("div");

    number.className =
      "pieceNumber";

    number.textContent =
      i+1;


    const input =
      document.createElement("input");

    input.className = "input";

    input.id =
      "pieceInput-" + i;

    input.type = "text";

    input.maxLength = 20;

    input.value =
      pieces[i] ||
      "コマ" + (i+1);


    row.appendChild(number);

    row.appendChild(input);

    area.appendChild(row);

  }

}


/* =====================================================
   企画設定保存
===================================================== */

function saveProjectSettings(){

  const title =
    document.getElementById("titleInput")
      .value
      .trim();


  const subtitle =
    document.getElementById("subtitleInput")
      .value
      .trim();


  let count =
    Number(
      document.getElementById(
        "pieceCountInput"
      ).value
    );


  if(!count || count < 1){
    count = 1;
  }

  if(count > 47){
    count = 47;
  }


  let goal =
    Number(
      document.getElementById("goalInput")
        .value
    );


  if(!goal || goal < 1){
    goal = 1;
  }

  if(goal > 30){
    goal = 30;
  }


  const oldPositions =
    {...positions};


  const newPieces = [];


  for(let i=0;i<count;i++){

    const input =
      document.getElementById(
        "pieceInput-" + i
      );


    let name =
      input
      ? input.value.trim()
      : "";


    if(!name){

      name =
        "コマ" + (i+1);

    }


    /*
      同名を防止
    */

    if(newPieces.includes(name)){

      name =
        name + " " + (i+1);

    }


    newPieces.push(name);

  }


  projectTitle =
    title ||
    "すごろく企画";


  projectSubtitle =
    subtitle ||
    "指定ギフトでコマを進めよう！";


  GOAL = goal;

  pieces = newPieces;


  positions = {};


  pieces.forEach(function(name){

    positions[name] =
      Math.min(
        oldPositions[name] || 0,
        GOAL
      );

  });


  if(
    !selectedPiece ||
    !pieces.includes(selectedPiece)
  ){

    selectedPiece = null;

    document.getElementById(
      "selectedName"
    ).textContent =
      "コマを選んでください";

  }


  closeProjectModal();


  updateAll();


  showPopup(
    "⚙️",
    "設定完了！",
    "企画内容を変更しました。"
  );

}


/* =====================================================
   ギフト設定
===================================================== */

function openGiftModal(){

  const area =
    document.getElementById(
      "giftSettingRows"
    );

  area.innerHTML = "";


  gifts.forEach(function(gift,index){

    const row =
      document.createElement("div");

    row.className =
      "giftSettingRow";


    row.innerHTML =

      '<div class="giftSettingTitle">' +
      '🎁 ギフト ' + (index+1) +
      '</div>' +

      '<div class="giftSettingInputs">' +

      '<input ' +
      'class="input" ' +
      'id="giftIcon-' + index + '" ' +
      'value="' + escapeHTML(gift.icon) + '">' +

      '<input ' +
      'class="input" ' +
      'id="giftName-' + index + '" ' +
      'value="' + escapeHTML(gift.name) + '">' +

      '<input ' +
      'class="input" ' +
      'id="giftMove-' + index + '" ' +
      'type="number" ' +
      'min="0" ' +
      'max="100" ' +
      'value="' + gift.move + '">' +

      '</div>';


    area.appendChild(row);

  });


  document
    .getElementById("giftModal")
    .classList.add("show");

}


function closeGiftModal(){

  document
    .getElementById("giftModal")
    .classList.remove("show");

}


/* =====================================================
   ギフト設定保存
===================================================== */

function saveGiftSettings(){

  gifts.forEach(function(gift,index){

    const icon =
      document.getElementById(
        "giftIcon-" + index
      ).value.trim();


    const name =
      document.getElementById(
        "giftName-" + index
      ).value.trim();


    let move =
      Number(
        document.getElementById(
          "giftMove-" + index
        ).value
      );


    if(isNaN(move)){
      move = 0;
    }

    if(move < 0){
      move = 0;
    }

    if(move > 100){
      move = 100;
    }


    gift.icon =
      icon || "🎁";

    gift.name =
      name || "ギフト";

    gift.move =
      move;

  });


  closeGiftModal();

  createGiftButtons();


  showPopup(
    "🎁",
    "ギフト設定完了！",
    "ギフト名と進むマス数を変更しました。"
  );

}


/* =====================================================
   リセット
===================================================== */

function resetGame(){

  const ok =
    confirm(
      "全てのコマをSTARTに戻しますか？"
    );


  if(!ok){
    return;
  }


  pieces.forEach(function(name){

    positions[name] = 0;

  });


  updateAll();


  showPopup(
    "🔄",
    "リセット完了",
    "全てのコマがSTARTに戻りました。"
  );

}


/* =====================================================
   ポップアップ
===================================================== */

function showPopup(
  icon,
  title,
  text
){

  document.getElementById(
    "popupIcon"
  ).textContent = icon;


  document.getElementById(
    "popupTitle"
  ).textContent = title;


  document.getElementById(
    "popupText"
  ).textContent = text;


  document
    .getElementById("popup")
    .classList.add("show");

}


function closePopup(){

  document
    .getElementById("popup")
    .classList.remove("show");

}


/* =====================================================
   全更新
===================================================== */

function updateAll(){

  updateTitle();

  createBoard();

  renderPieces();

  updateRanking();

  createGiftButtons();

}


/* =====================================================
   初期起動
===================================================== */

initializePositions();

updateAll();

</script>
