<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>都道府県すごろく</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    Meiryo,
    sans-serif;
  background:#f4f0ff;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

button,
input,
select{
  font-family:inherit;
}

button{
  cursor:pointer;
  border:none;
}

/* =========================
   アプリ全体
========================= */

.app{
  width:100%;
  max-width:900px;
  height:100vh;
  max-height:1000px;
  background:#fff;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  box-shadow:0 0 30px rgba(0,0,0,.12);
}

/* =========================
   ヘッダー
========================= */

.header{
  flex:0 0 auto;
  background:linear-gradient(135deg,#6d28d9,#8b5cf6);
  color:white;
  padding:12px 14px;
  text-align:center;
  position:relative;
}

.header h1{
  font-size:clamp(18px,4vw,30px);
  font-weight:900;
  line-height:1.25;
}

.header p{
  margin-top:3px;
  font-size:clamp(11px,2.5vw,16px);
  opacity:.95;
}

.headerButtons{
  position:absolute;
  right:8px;
  top:8px;
  display:flex;
  gap:5px;
}

.headerButtons button{
  background:rgba(255,255,255,.2);
  color:#fff;
  border:1px solid rgba(255,255,255,.35);
  border-radius:8px;
  padding:5px 8px;
  font-size:11px;
}

/* =========================
   メイン
========================= */

.main{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  padding:8px;
  gap:7px;
  overflow:hidden;
}

/* =========================
   選択中
========================= */

.selectedBox{
  flex:0 0 auto;
  background:#f3e8ff;
  border:2px solid #8b5cf6;
  border-radius:10px;
  padding:6px 10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.selectedLabel{
  font-size:12px;
  color:#555;
}

.selectedName{
  font-size:17px;
  font-weight:900;
  color:#6d28d9;
}

.moveButton{
  background:#6d28d9;
  color:#fff;
  border-radius:9px;
  padding:8px 12px;
  font-weight:900;
  font-size:13px;
  white-space:nowrap;
}

.moveButton:active{
  transform:scale(.96);
}

/* =========================
   すごろく盤
========================= */

.boardWrap{
  flex:1;
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
}

.board{
  width:100%;
  height:100%;
  max-height:100%;
  display:grid;
  grid-template-columns:repeat(6,1fr);
  grid-template-rows:repeat(5,1fr);
  gap:4px;
  background:#ddd;
  border:3px solid #444;
  border-radius:10px;
  padding:4px;
}

/* =========================
   マス
========================= */

.cell{
  min-width:0;
  min-height:0;
  position:relative;
  border:2px solid #777;
  border-radius:7px;
  background:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  transition:.2s;
}

.cellNumber{
  position:absolute;
  top:2px;
  left:4px;
  font-size:clamp(8px,1.7vw,12px);
  font-weight:900;
  color:#555;
}

.cellTrick{
  font-size:clamp(7px,1.5vw,11px);
  font-weight:800;
  text-align:center;
  line-height:1.1;
  padding:2px;
  margin-top:5px;
}

.cell.goal{
  background:#fff7cc;
  border-color:#eab308;
}

.cell.start{
  background:#e0f2fe;
  border-color:#0284c7;
}

.pieces{
  width:100%;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:2px;
  padding:2px;
  margin-top:2px;
}

.piece{
  max-width:90%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  background:#6d28d9;
  color:#fff;
  border-radius:4px;
  padding:2px 4px;
  font-size:clamp(7px,1.4vw,10px);
  font-weight:900;
  line-height:1.1;
}

/* =========================
   ギフト
========================= */

.giftArea{
  flex:0 0 auto;
  background:#faf5ff;
  border:2px solid #ddd6fe;
  border-radius:10px;
  padding:6px;
}

.giftTitle{
  text-align:center;
  font-size:12px;
  font-weight:900;
  color:#5b21b6;
  margin-bottom:5px;
}

.giftGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5px;
}

.giftButton{
  min-width:0;
  min-height:45px;
  border-radius:9px;
  color:#fff;
  background:#7c3aed;
  padding:4px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-weight:900;
  line-height:1.05;
  box-shadow:0 2px 3px rgba(0,0,0,.15);
}

.giftButton:nth-child(2){
  background:#ec4899;
}

.giftButton:nth-child(3){
  background:#f59e0b;
}

.giftButton:active{
  transform:scale(.96);
}

.giftIcon{
  font-size:18px;
}

.giftName{
  max-width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:10px;
}

.giftMove{
  font-size:9px;
  opacity:.95;
  margin-top:2px;
}

/* =========================
   下部設定
========================= */

.bottomSettings{
  flex:0 0 auto;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px;
}

.bottomSettings button{
  background:#eee;
  border:1px solid #ccc;
  border-radius:8px;
  padding:7px 3px;
  font-size:10px;
  font-weight:800;
  color:#333;
}

.bottomSettings button:active{
  transform:scale(.97);
}

/* =========================
   モーダル
========================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:1000;
  padding:12px;
}

.modal.show{
  display:flex;
}

.modalBox{
  width:min(94vw,600px);
  max-height:92vh;
  background:#fff;
  border-radius:16px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  box-shadow:0 10px 40px rgba(0,0,0,.3);
}

.modalHeader{
  flex:0 0 auto;
  background:#6d28d9;
  color:#fff;
  padding:12px;
  text-align:center;
  font-weight:900;
  font-size:17px;
}

.modalBody{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:12px;
}

.modalFooter{
  flex:0 0 auto;
  display:flex;
  gap:6px;
  padding:8px;
  border-top:1px solid #ddd;
}

.modalFooter button{
  flex:1;
  padding:10px;
  border-radius:9px;
  font-weight:900;
}

.saveBtn{
  background:#6d28d9;
  color:#fff;
}

.closeBtn{
  background:#eee;
}

/* =========================
   フォーム
========================= */

.formGroup{
  margin-bottom:12px;
}

.formGroup label{
  display:block;
  font-size:12px;
  font-weight:900;
  margin-bottom:4px;
  color:#444;
}

.formGroup input,
.formGroup select{
  width:100%;
  border:1px solid #bbb;
  border-radius:8px;
  padding:9px;
  font-size:14px;
  background:#fff;
}

.giftSetting{
  border:1px solid #ddd;
  border-radius:10px;
  padding:9px;
  margin-bottom:9px;
  background:#fafafa;
}

.giftSettingTitle{
  font-weight:900;
  margin-bottom:7px;
  color:#5b21b6;
}

.twoCol{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

.info{
  background:#f3e8ff;
  border-radius:8px;
  padding:8px;
  font-size:11px;
  line-height:1.5;
  color:#4c1d95;
  margin-bottom:10px;
}

/* =========================
   候補選択
========================= */

.pieceGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5px;
}

.pieceSelect{
  background:#f3f4f6;
  border:2px solid #ddd;
  border-radius:8px;
  padding:8px 3px;
  font-size:11px;
  font-weight:800;
}

.pieceSelect.selected{
  background:#ede9fe;
  border-color:#7c3aed;
  color:#5b21b6;
}

/* =========================
   仕掛け設定
========================= */

.trickSetting{
  border:1px solid #ddd;
  border-radius:9px;
  padding:8px;
  margin-bottom:7px;
}

.trickSetting strong{
  display:block;
  font-size:12px;
  margin-bottom:5px;
}

.trickSetting select,
.trickSetting input{
  width:100%;
  padding:7px;
  border:1px solid #bbb;
  border-radius:7px;
  margin-bottom:5px;
}

/* =========================
   ポップアップ
========================= */

.popup{
  position:fixed;
  inset:0;
  z-index:2000;
  background:rgba(0,0,0,.45);
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.popup.show{
  display:flex;
}

.popupBox{
  width:min(88vw,420px);
  background:#fff;
  border-radius:18px;
  padding:20px;
  text-align:center;
  box-shadow:0 15px 50px rgba(0,0,0,.3);
}

.popupIcon{
  font-size:48px;
}

.popupTitle{
  margin-top:7px;
  font-size:21px;
  font-weight:900;
  color:#5b21b6;
}

.popupText{
  margin-top:7px;
  font-size:14px;
  line-height:1.5;
  white-space:pre-line;
}

.popupButton{
  margin-top:15px;
  background:#6d28d9;
  color:#fff;
  border-radius:9px;
  padding:10px 25px;
  font-weight:900;
}

/* =========================
   サイコロ表示
========================= */

.diceDisplay{
  margin:10px auto;
  width:70px;
  height:70px;
  border:3px solid #333;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:42px;
  font-weight:900;
  background:#fff;
  box-shadow:0 3px 8px rgba(0,0,0,.15);
}

.diceRolling{
  animation:diceShake .25s infinite alternate;
}

@keyframes diceShake{
  from{
    transform:rotate(-8deg) scale(1);
  }
  to{
    transform:rotate(8deg) scale(1.08);
  }
}

/* =========================
   レスポンシブ
========================= */

@media(max-width:600px){

  .header{
    padding:10px 70px 8px 10px;
  }

  .header h1{
    font-size:17px;
  }

  .header p{
    font-size:10px;
  }

  .main{
    padding:5px;
    gap:5px;
  }

  .selectedBox{
    padding:5px 7px;
  }

  .selectedName{
    font-size:14px;
  }

  .moveButton{
    font-size:11px;
    padding:7px 9px;
  }

  .board{
    gap:3px;
    padding:3px;
    border-width:2px;
  }

  .cell{
    border-width:1px;
  }

  .giftArea{
    padding:4px;
  }

  .giftButton{
    min-height:40px;
  }

  .giftIcon{
    font-size:16px;
  }

  .bottomSettings button{
    font-size:9px;
    padding:6px 2px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- =========================
       ヘッダー
  ========================== -->
  <header class="header">

    <div class="headerButtons">
      <button onclick="openProjectSettings()">⚙️ 設定</button>
    </div>

    <h1 id="titleText">
      🗾 出身県はどこ？県民パワーでGOALを目指せ！
    </h1>

    <p id="subtitleText">
      指定ギフトでコマを進めよう！
    </p>

  </header>


  <main class="main">

    <!-- =========================
         選択中
    ========================== -->

    <div class="selectedBox">

      <div>
        <div class="selectedLabel">現在選択中</div>
        <div class="selectedName" id="selectedName">
          未選択
        </div>
      </div>

      <button class="moveButton" onclick="moveSelected(1,'🎲')">
        🎲 1マス進む
      </button>

    </div>


    <!-- =========================
         すごろく盤
    ========================== -->

    <div class="boardWrap">

      <div class="board" id="board"></div>

    </div>


    <!-- =========================
         ギフト
    ========================== -->

    <section class="giftArea">

      <div class="giftTitle">
        🎁 指定ギフトでコマを進めよう！
      </div>

      <div class="giftGrid" id="giftGrid"></div>

    </section>


    <!-- =========================
         下部設定
    ========================== -->

    <div class="bottomSettings">

      <button onclick="openPieceModal()">
        🗾 コマを選ぶ
      </button>

      <button onclick="openGiftSettings()">
        🎁 ギフト設定
      </button>

      <button onclick="openTrickSettings()">
        ⭐ 仕掛け設定
      </button>

      <button onclick="resetGame()">
        🔄 リセット
      </button>

    </div>

  </main>

</div>


<!-- =====================================================
     コマ選択モーダル
===================================================== -->

<div class="modal" id="pieceModal">

  <div class="modalBox">

    <div class="modalHeader">
      🗾 コマを選択
    </div>

    <div class="modalBody">

      <div class="info">
        進めたい都道府県をタップして選択してください。
      </div>

      <div class="pieceGrid" id="pieceGrid"></div>

    </div>

    <div class="modalFooter">

      <button class="closeBtn" onclick="closeModal('pieceModal')">
        閉じる
      </button>

    </div>

  </div>

</div>


<!-- =====================================================
     ギフト設定モーダル
===================================================== -->

<div class="modal" id="giftModal">

  <div class="modalBox">

    <div class="modalHeader">
      🎁 ギフト設定
    </div>

    <div class="modalBody">

      <div class="info">
        各ギフトについて「固定マス」または「サイコロ」を選べます。<br>
        サイコロを選んだ場合は、指定回数サイコロを振り、出た目の合計だけコマが進みます。
      </div>

      <div id="giftSettingsList"></div>

    </div>

    <div class="modalFooter">

      <button class="closeBtn" onclick="closeModal('giftModal')">
        キャンセル
      </button>

      <button class="saveBtn" onclick="saveGiftSettings()">
        保存する
      </button>

    </div>

  </div>

</div>


<!-- =====================================================
     仕掛け設定モーダル
===================================================== -->

<div class="modal" id="trickModal">

  <div class="modalBox">

    <div class="modalHeader">
      ⭐ マスの仕掛け設定
    </div>

    <div class="modalBody">

      <div class="info">
        マスごとに仕掛けを設定できます。
      </div>

      <div id="trickSettingsList"></div>

    </div>

    <div class="modalFooter">

      <button class="closeBtn" onclick="closeModal('trickModal')">
        キャンセル
      </button>

      <button class="saveBtn" onclick="saveTrickSettings()">
        保存する
      </button>

    </div>

  </div>

</div>


<!-- =====================================================
     プロジェクト設定
===================================================== -->

<div class="modal" id="projectModal">

  <div class="modalBox">

    <div class="modalHeader">
      ⚙️ プロジェクト設定
    </div>

    <div class="modalBody">

      <div class="formGroup">

        <label>
          タイトル
        </label>

        <input
          id="projectTitle"
          type="text"
        >

      </div>


      <div class="formGroup">

        <label>
          サブタイトル
        </label>

        <input
          id="projectSubtitle"
          type="text"
        >

      </div>


      <div class="formGroup">

        <label>
          GOALマス
        </label>

        <input
          id="projectGoal"
          type="number"
          min="1"
          max="99"
        >

      </div>

    </div>

    <div class="modalFooter">

      <button class="closeBtn" onclick="closeModal('projectModal')">
        キャンセル
      </button>

      <button class="saveBtn" onclick="saveProjectSettings()">
        保存する
      </button>

    </div>

  </div>

</div>


<!-- =====================================================
     ポップアップ
===================================================== -->

<div class="popup" id="popup">

  <div class="popupBox">

    <div class="popupIcon" id="popupIcon">
      🎲
    </div>

    <div class="popupTitle" id="popupTitle">
      サイコロ
    </div>

    <div class="diceDisplay" id="diceDisplay">
      🎲
    </div>

    <div class="popupText" id="popupText">
    </div>

    <button class="popupButton" onclick="closePopup()">
      閉じる
    </button>

  </div>

</div>


<script>

/* =====================================================
   基本設定
===================================================== */

let title =
  "🗾 出身県はどこ？県民パワーでGOALを目指せ！";

let subtitle =
  "指定ギフトでコマを進めよう！";

let GOAL = 30;


/* =====================================================
   都道府県
===================================================== */

const prefectures = [
  "北海道",
  "青森県",
  "岩手県",
  "宮城県",
  "秋田県",
  "山形県",
  "福島県",
  "茨城県",
  "栃木県",
  "群馬県",
  "埼玉県",
  "千葉県",
  "東京都",
  "神奈川県",
  "新潟県",
  "富山県",
  "石川県",
  "福井県",
  "山梨県",
  "長野県",
  "岐阜県",
  "静岡県",
  "愛知県",
  "三重県",
  "滋賀県",
  "京都府",
  "大阪府",
  "兵庫県",
  "奈良県",
  "和歌山県",
  "鳥取県",
  "島根県",
  "岡山県",
  "広島県",
  "山口県",
  "徳島県",
  "香川県",
  "愛媛県",
  "高知県",
  "福岡県",
  "佐賀県",
  "長崎県",
  "熊本県",
  "大分県",
  "宮崎県",
  "鹿児島県",
  "沖縄県"
];


/* =====================================================
   コマ位置
===================================================== */

let positions = {};

prefectures.forEach(name=>{
  positions[name] = 0;
});


let selectedPiece = null;


/* =====================================================
   ギフト設定
=====================================================

   type:
   fixed = 固定マス
   dice  = サイコロ

===================================================== */

let gifts = [

  {
    icon:"❤️",
    name:"ハートミー",
    type:"fixed",
    move:1,
    diceCount:1
  },

  {
    icon:"🍩",
    name:"ドーナツ",
    type:"fixed",
    move:3,
    diceCount:1
  },

  {
    icon:"🎁",
    name:"指定ギフト",
    type:"fixed",
    move:5,
    diceCount:1
  },

  {
    icon:"⭐",
    name:"スペシャル",
    type:"fixed",
    move:10,
    diceCount:1
  },

  {
    icon:"🌟",
    name:"特大ギフト",
    type:"fixed",
    move:20,
    diceCount:1
  }

];


/* =====================================================
   マスの仕掛け
===================================================== */

let tricks = {};

for(let i=1;i<=99;i++){

  tricks[i] = {
    type:"none",
    value:0
  };

}


/*
  仕掛けタイプ

  none
  forward
  back
  start
  goal
  again
  display
  previousBack
  previousStart
  swapPrevious
  leaderBack
  lastForward
*/


/* =====================================================
   初期サンプル仕掛け
===================================================== */

tricks[5] = {
  type:"forward",
  value:2
};

tricks[8] = {
  type:"back",
  value:2
};

tricks[12] = {
  type:"again",
  value:0
};

tricks[15] = {
  type:"display",
  value:0
};

tricks[18] = {
  type:"previousBack",
  value:2
};

tricks[21] = {
  type:"previousStart",
  value:0
};

tricks[24] = {
  type:"swapPrevious",
  value:0
};

tricks[26] = {
  type:"leaderBack",
  value:2
};

tricks[28] = {
  type:"lastForward",
  value:2
};


/* =====================================================
   仕掛け表示
===================================================== */

function trickText(trick){

  if(!trick) return "";

  switch(trick.type){

    case "forward":
      return "⬆️ "+trick.value+"マス進む";

    case "back":
      return "⬇️ "+trick.value+"マス戻る";

    case "start":
      return "🔵 STARTへ";

    case "goal":
      return "🏆 GOALへ";

    case "again":
      return "🎲 もう1回";

    case "display":
      return "🎁 お楽しみ袋";

    case "previousBack":
      return "👥 前の県が "+trick.value+"マス戻る";

    case "previousStart":
      return "👥 前の県がSTARTへ";

    case "swapPrevious":
      return "🔄 前の県と入替";

    case "leaderBack":
      return "👑 先頭が "+trick.value+"マス戻る";

    case "lastForward":
      return "🚀 最後尾が "+trick.value+"マス進む";

    default:
      return "";

  }

}


/* =====================================================
   盤面描画
===================================================== */

function renderBoard(){

  const board =
    document.getElementById("board");

  board.innerHTML = "";

  for(let i=1;i<=GOAL;i++){

    const cell =
      document.createElement("div");

    cell.className = "cell";

    if(i === 1){
      cell.classList.add("start");
    }

    if(i === GOAL){
      cell.classList.add("goal");
    }

    const number =
      document.createElement("div");

    number.className = "cellNumber";

    number.textContent = i;

    cell.appendChild(number);


    const trick =
      tricks[i];

    if(trick && trick.type !== "none"){

      const trickDiv =
        document.createElement("div");

      trickDiv.className =
        "cellTrick";

      trickDiv.textContent =
        trickText(trick);

      cell.appendChild(trickDiv);

    }


    const piecesDiv =
      document.createElement("div");

    piecesDiv.className = "pieces";


    prefectures.forEach(name=>{

      if(positions[name] === i){

        const piece =
          document.createElement("div");

        piece.className = "piece";

        piece.textContent = name;

        piecesDiv.appendChild(piece);

      }

    });


    cell.appendChild(piecesDiv);

    board.appendChild(cell);

  }

}

/* =====================================================
   HTMLエスケープ
===================================================== */

function escapeHtml(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   ギフト使用
===================================================== */

function useGift(index){

  if(isRollingDice){
    return;
  }

  if(!selectedPiece){

    showPopup(
      "⚠️",
      "コマを選んでください",
      "先に「コマを選ぶ」から都道府県を選択してください。"
    );

    return;
  }


  const gift =
    gifts[index];


  if(!gift){
    return;
  }


  if(gift.type === "dice"){

    rollDiceForGift(gift);

  }else{

    const move =
      Math.max(
        0,
        Number(gift.move) || 0
      );

    moveSelected(
      move,
      gift.icon
    );

  }

}


/* =====================================================
   サイコロ
===================================================== */

let isRollingDice = false;


/*
  サイコロを指定回数振る
  → 出た目の合計
  → コマを合計マス進める
*/

async function rollDiceForGift(gift){

  if(!selectedPiece){
    return;
  }

  if(isRollingDice){
    return;
  }

  isRollingDice = true;


  const count =
    Math.max(
      1,
      Math.min(
        20,
        Number(gift.diceCount) || 1
      )
    );


  let rolls = [];


  showDicePopup();


  for(let i=0;i<count;i++){

    const dice =
      Math.floor(Math.random()*6)+1;

    rolls.push(dice);


    const diceDisplay =
      document.getElementById("diceDisplay");

    const popupText =
      document.getElementById("popupText");

    const popupTitle =
      document.getElementById("popupTitle");


    popupTitle.textContent =
      "🎲 "+(i+1)+"回目";


    diceDisplay.classList.add(
      "diceRolling"
    );


    /*
      少しだけ数字を動かして
      サイコロを振っている感じにする
    */

    for(let j=0;j<5;j++){

      diceDisplay.textContent =
        Math.floor(Math.random()*6)+1;

      await wait(70);

    }


    diceDisplay.classList.remove(
      "diceRolling"
    );


    diceDisplay.textContent =
      dice;


    popupText.textContent =
      "出た目： "+dice+
      "\n"+
      "累計："+rolls.reduce((a,b)=>a+b,0)+"マス";


    await wait(450);

  }


  const total =
    rolls.reduce(
      (sum,num)=>sum+num,
      0
    );


  closePopup();


  await wait(150);


  moveSelected(
    total,
    "🎲",
    "出た目："+rolls.join(" ＋ ")+" ＝ "+total+"マス"
  );


  isRollingDice = false;

}


function wait(ms){

  return new Promise(
    resolve=>setTimeout(resolve,ms)
  );

}

/* =====================================================
   コマを進める
===================================================== */

function moveSelected(
  move,
  icon="🎲",
  extraText=""
){

  if(!selectedPiece){

    showPopup(
      "⚠️",
      "コマを選んでください",
      "先に都道府県を選択してください。"
    );

    return;
  }


  let current =
    positions[selectedPiece] || 0;


  let newPosition =
    current + Number(move);


  if(newPosition < 1){
    newPosition = 1;
  }


  if(newPosition >= GOAL){

    positions[selectedPiece] =
      GOAL;

    renderBoard();

    showPopup(
      "🏆",
      "GOAL！",
      selectedPiece+
      " がゴールしました！"+
      (extraText ? "\n"+extraText : "")
    );

    return;
  }


  positions[selectedPiece] =
    newPosition;


  renderBoard();


  let message =
    selectedPiece+
    " が "+
    move+
    "マス進みました！";


  if(extraText){
    message =
      extraText+
      "\n"+
      message;
  }


  const trick =
    tricks[newPosition];


  if(trick && trick.type !== "none"){

    triggerTrick(
      selectedPiece,
      newPosition,
      trick,
      icon,
      message
    );

  }else{

    showPopup(
      icon,
      "コマが進みました！",
      message
    );

  }

}


/* =====================================================
   仕掛け発動
===================================================== */

function triggerTrick(
  piece,
  position,
  trick,
  giftIcon,
  sourceText=""
){

  switch(trick.type){

    case "forward":{

      const amount =
        Number(trick.value)||0;

      positions[piece] =
        Math.min(
          GOAL,
          positions[piece]+amount
        );

      renderBoard();

      showPopup(
        "⬆️",
        "仕掛け発動！",
        sourceText+
        "\n\n"+
        piece+
        " はさらに "+
        amount+
        "マス進みます！"
      );

      break;
    }


    case "back":{

      const amount =
        Number(trick.value)||0;

      positions[piece] =
        Math.max(
          1,
          positions[piece]-amount
        );

      renderBoard();

      showPopup(
        "⬇️",
        "仕掛け発動！",
        sourceText+
        "\n\n"+
        piece+
        " は "+
        amount+
        "マス戻ります！"
      );

      break;
    }


    case "start":{

      positions[piece] = 1;

      renderBoard();

      showPopup(
        "🔵",
        "STARTへ！",
        sourceText+
        "\n\n"+
        piece+
        " はSTARTへ戻りました。"
      );

      break;
    }


    case "goal":{

      positions[piece] =
        GOAL;

      renderBoard();

      showPopup(
        "🏆",
        "GOAL！",
        sourceText+
        "\n\n"+
        piece+
        " がゴールしました！"
      );

      break;
    }


    case "again":{

      showPopup(
        "🎲",
        "もう1回！",
        sourceText+
        "\n\n"+
        piece+
        " はもう一度進めます！"
      );

      break;
    }


    case "display":{

      showPopup(
        "🎁",
        "お楽しみ袋！",
        sourceText+
        "\n\n"+
        "お楽しみ袋が表示されました！"
      );

      break;
    }


    case "previousBack":{

      const index =
        prefectures.indexOf(piece);

      if(index > 0){

        const previous =
          prefectures[index-1];

        const amount =
          Number(trick.value)||0;

        positions[previous] =
          Math.max(
            1,
            positions[previous]-amount
          );

        renderBoard();

        showPopup(
          "👥",
          "前の県が戻ります！",
          sourceText+
          "\n\n"+
          previous+
          " が "+
          amount+
          "マス戻りました。"
        );

      }else{

        showPopup(
          "👥",
          "仕掛け発動！",
          sourceText
        );

      }

      break;
    }


    case "previousStart":{

      const index =
        prefectures.indexOf(piece);

      if(index > 0){

        const previous =
          prefectures[index-1];

        positions[previous] = 1;

        renderBoard();

        showPopup(
          "🔵",
          "前の県がSTARTへ！",
          sourceText+
          "\n\n"+
          previous+
          " がSTARTへ戻りました。"
        );

      }else{

        showPopup(
          "👥",
          "仕掛け発動！",
          sourceText
        );

      }

      break;
    }


    case "swapPrevious":{

      const index =
        prefectures.indexOf(piece);

      if(index > 0){

        const previous =
          prefectures[index-1];

        const temp =
          positions[piece];

        positions[piece] =
          positions[previous];

        positions[previous] =
          temp;

        renderBoard();

        showPopup(
          "🔄",
          "位置入れ替え！",
          sourceText+
          "\n\n"+
          piece+
          " と "+
          previous+
          " の位置が入れ替わりました！"
        );

      }else{

        showPopup(
          "🔄",
          "仕掛け発動！",
          sourceText
        );

      }

      break;
    }


    case "leaderBack":{

      let leader = null;
      let leaderPosition = -1;


      prefectures.forEach(name=>{

        const pos =
          positions[name] || 0;

        if(pos > leaderPosition){

          leaderPosition = pos;
          leader = name;

        }

      });


      if(leader){

        const amount =
          Number(trick.value)||0;

        positions[leader] =
          Math.max(
            1,
            positions[leader]-amount
          );

        renderBoard();

        showPopup(
          "👑",
          "先頭が戻ります！",
          sourceText+
          "\n\n"+
          leader+
          " が "+
          amount+
          "マス戻りました。"
        );

      }else{

        showPopup(
          "👑",
          "仕掛け発動！",
          sourceText
        );

      }

      break;
    }


    case "lastForward":{

      let last = null;
      let lastPosition = Infinity;


      prefectures.forEach(name=>{

        const pos =
          positions[name] || 0;

        if(pos > 0 && pos < lastPosition){

          lastPosition = pos;
          last = name;

        }

      });


      if(last){

        const amount =
          Number(trick.value)||0;

        positions[last] =
          Math.min(
            GOAL,
            positions[last]+amount
          );

        renderBoard();

        showPopup(
          "🚀",
          "最後尾が進みます！",
          sourceText+
          "\n\n"+
          last+
          " が "+
          amount+
          "マス進みました。"
        );

      }else{

        showPopup(
          "🚀",
          "仕掛け発動！",
          sourceText
        );

      }

      break;
    }


    default:

      showPopup(
        giftIcon,
        "コマが進みました！",
        sourceText
      );

  }

}

    );

    document.getElementById(

    .classList.add("show");

}


function closeModal(id){

  document
    .getElementById(id)
    .classList.remove("show");

}


/* =====================================================
   ポップアップ
===================================================== */

function showPopup(
  icon,
  titleText,
  text
){

  const popup =
    document.getElementById(
      "popup"
    );

  document.getElementById(
    "popupIcon"
  ).textContent =
    icon;


  document.getElementById(
    "popupTitle"
  ).textContent =
    titleText;


  document.getElementById(
    "popupText"
  ).textContent =
    text;


  document.getElementById(
    "diceDisplay"
  ).style.display =
    icon === "🎲" ? "flex" : "none";


  popup.classList.add("show");

}


function closePopup(){

  document
    .getElementById("popup")
    .classList.remove("show");

}


/* =====================================================
   リセット
===================================================== */

function resetGame(){

  if(
    !confirm(
      "すべてのコマをSTARTに戻しますか？"
    )
  ){
    return;
  }


  prefectures.forEach(name=>{

    positions[name] = 0;

  });


  selectedPiece = null;

  updateSelected();

  renderBoard();


  showPopup(
    "🔄",
    "リセットしました！",
    "すべてのコマをSTART前に戻しました。"
  );

}


/* =====================================================
   初期化
===================================================== */

document.getElementById(
  "titleText"
).textContent =
  title;


document.getElementById(
  "subtitleText"
).textContent =
  subtitle;


renderBoard();

renderGifts();

updateSelected();

</script>
