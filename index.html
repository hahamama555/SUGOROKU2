<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>都道府県すごろく</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans JP",
    "Hiragino Kaku Gothic ProN",
    Meiryo,
    sans-serif;
  background:#222;
}

button,input,select{
  font-family:inherit;
}

button{
  cursor:pointer;
}

/* ========================================
   9:16 メイン画面
======================================== */

#app{
  position:relative;
  width:100vw;
  height:100dvh;
  overflow:hidden;

  background:
    linear-gradient(
      180deg,
      #fff8fc 0%,
      #f4f0ff 55%,
      #eefaff 100%
    );
}

/* ========================================
   タイトル
======================================== */

#header{
  position:absolute;
  top:0;
  left:0;
  right:0;

  height:11dvh;
  min-height:65px;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  padding:5px 8px;

  background:#fff;

  border-bottom:3px solid #222;

  z-index:50;

  box-shadow:0 2px 8px rgba(0,0,0,.12);
}

#title{
  width:100%;

  margin:0;

  text-align:center;

  font-size:clamp(15px,4.8vw,27px);
  line-height:1.15;

  font-weight:1000;

  color:#111;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

#subtitle{
  margin-top:4px;

  width:100%;

  text-align:center;

  font-size:clamp(8px,2.5vw,13px);

  color:#666;

  font-weight:900;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* ========================================
   メイン
======================================== */

#main{
  position:absolute;

  top:11dvh;
  left:0;
  right:0;
  bottom:0;

  padding:5px;

  display:flex;
  flex-direction:column;

  gap:5px;

  overflow:hidden;
}

/* ========================================
   操作エリア
======================================== */

#selectRow{
  flex:0 0 6%;
  min-height:38px;

  display:grid;
  grid-template-columns:1fr 1fr;

  gap:5px;
}

.actionButton{
  border:0;
  border-radius:9px;

  background:#222;
  color:#fff;

  font-size:clamp(9px,2.8vw,14px);
  font-weight:1000;
}

/* ========================================
   選択中
======================================== */

#selectedBox{
  flex:0 0 5%;
  min-height:31px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#fff;

  border-radius:8px;

  box-shadow:0 2px 6px rgba(0,0,0,.07);

  font-size:clamp(8px,2.5vw,13px);
  font-weight:1000;
}

#selectedLabel{
  color:#777;
  margin-right:5px;
}

#selectedName{
  max-width:72%;

  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

/* ========================================
   すごろく盤面
======================================== */

#boardBox{
  flex:1 1 auto;
  min-height:0;

  display:flex;
  flex-direction:column;

  background:#fff;

  border-radius:12px;

  padding:5px;

  box-shadow:0 3px 12px rgba(0,0,0,.10);

  overflow:hidden;
}

#boardHeader{
  flex:0 0 7%;
  min-height:25px;

  display:flex;
  justify-content:center;
  align-items:center;

  font-size:clamp(8px,2.7vw,14px);

  font-weight:1000;

  color:#222;
}

/* ========================================
   盤面
======================================== */

#board{
  flex:1;

  min-height:0;

  display:grid;

  grid-template-columns:repeat(6,1fr);
  grid-template-rows:repeat(5,1fr);

  gap:4px;

  overflow:hidden;
}

/* ========================================
   マス
======================================== */

.cell{
  position:relative;

  min-width:0;
  min-height:0;

  background:#fafafa;

  border:2px solid #cfcfcf;

  border-radius:10px;

  overflow:hidden;
}

.cell.goal{
  background:#fff0a5;

  border-color:#d4a600;
}

.cell.start{
  background:#dff5ff;

  border-color:#168bc4;
}

.cellNumber{
  position:absolute;

  top:2px;
  left:4px;

  z-index:20;

  color:#666;

  font-size:clamp(7px,2vw,11px);

  font-weight:1000;
}

/* ========================================
   仕掛け
======================================== */

.trick{
  position:absolute;

  top:17px;
  left:2px;
  right:2px;

  z-index:15;

  padding:3px 2px;

  border-radius:5px;

  background:#ffe1e1;

  color:#c40000;

  text-align:center;

  font-size:clamp(5px,1.65vw,9px);

  font-weight:1000;

  line-height:1.05;

  overflow:hidden;
}

/* ========================================
   コマ置き場
======================================== */

.cellPieces{
  position:absolute;

  left:2px;
  right:2px;

  top:36%;
  bottom:2px;

  display:flex;

  flex-wrap:wrap;

  align-content:center;

  justify-content:center;

  gap:3px;

  overflow:hidden;
}

/* ========================================
   大きめカラフルコマ
======================================== */

.piece{
  min-width:47%;
  max-width:98%;

  padding:5px 6px;

  border:2px solid #fff;

  border-radius:18px;

  color:#fff;

  font-size:clamp(6px,2vw,11px);

  font-weight:1000;

  line-height:1;

  text-align:center;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

  box-shadow:
    0 2px 5px rgba(0,0,0,.3);
}

.piece.active{
  outline:3px solid #111;

  transform:scale(1.06);

  z-index:30;
}

/* ========================================
   ギフト
======================================== */

#giftBox{
  flex:0 0 10%;
  min-height:56px;

  background:#fff;

  border-radius:10px;

  padding:4px;

  box-shadow:0 2px 7px rgba(0,0,0,.08);
}

#giftTitle{
  height:28%;

  display:flex;
  justify-content:center;
  align-items:center;

  font-size:clamp(7px,2.3vw,12px);

  font-weight:1000;
}

#giftButtons{
  height:72%;

  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:4px;
}

.giftButton{
  border:0;

  border-radius:8px;

  background:#f0f0f0;

  font-size:clamp(6px,2vw,10px);

  line-height:1.1;

  font-weight:1000;
}

/* ========================================
   下部設定
======================================== */

#bottomButtons{
  flex:0 0 6%;
  min-height:38px;

  display:grid;

  grid-template-columns:repeat(4,1fr);

  gap:4px;
}

.bottomButton{
  border:0;

  border-radius:8px;

  color:#fff;

  font-size:clamp(6px,1.9vw,10px);

  font-weight:1000;
}

#projectButton{
  background:#673ab7;
}

#giftSettingButton{
  background:#00897b;
}

#trickSettingButton{
  background:#e65100;
}

#resetButton{
  background:#222;
}

/* ========================================
   モーダル
======================================== */

.modal{
  position:absolute;

  inset:0;

  z-index:100;

  display:none;

  align-items:center;
  justify-content:center;

  padding:10px;

  background:rgba(0,0,0,.72);
}

.modal.show{
  display:flex;
}

.modalBox{
  width:100%;
  max-width:440px;

  max-height:95%;

  background:#fff;

  border-radius:17px;

  padding:11px;

  display:flex;
  flex-direction:column;

  overflow:hidden;
}

.modalHeader{
  flex:0 0 40px;

  display:flex;

  align-items:center;
  justify-content:space-between;
}

.modalTitle{
  font-size:clamp(14px,4.3vw,21px);

  font-weight:1000;
}

.closeButton{
  width:34px;
  height:34px;

  border:0;

  border-radius:50%;

  background:#eee;

  font-size:20px;

  font-weight:1000;
}

.modalScroll{
  flex:1;

  min-height:0;

  overflow:auto;

  padding:2px;
}

.settingLabel{
  display:block;

  margin:9px 0 4px;

  font-size:10px;

  font-weight:1000;
}

.input,
.select{
  width:100%;

  height:38px;

  border:1px solid #ddd;

  border-radius:8px;

  padding:0 8px;

  background:#fff;

  font-size:11px;

  font-weight:800;

  outline:none;
}

.row2{
  display:grid;

  grid-template-columns:1fr 1fr;

  gap:5px;
}

.modalButtons{
  flex:0 0 42px;

  margin-top:7px;

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:5px;
}

.modalButton{
  border:0;

  border-radius:8px;

  font-size:11px;

  font-weight:1000;
}

.saveButton{
  background:#222;
  color:#fff;
}

.cancelButton{
  background:#eee;
}

/* ========================================
   コマ選択
======================================== */

.chooseGrid{
  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:5px;
}

.chooseButton{
  min-height:46px;

  border:1px solid #ddd;

  border-radius:8px;

  background:#f7f7f7;

  font-size:clamp(7px,2.4vw,12px);

  font-weight:1000;
}

.chooseButton.current{
  background:#222;

  color:#fff;
}

/* ========================================
   コマ設定
======================================== */

.pieceInputs{
  display:grid;

  grid-template-columns:1fr 1fr;

  gap:5px;
}

.pieceInput{
  display:grid;

  grid-template-columns:25px 1fr;

  gap:3px;
}

.pieceNumber{
  display:flex;

  align-items:center;
  justify-content:center;

  background:#eee;

  border-radius:6px;

  font-size:9px;

  font-weight:1000;
}

/* ========================================
   ギフト設定
======================================== */

.giftSettingRow{
  margin-bottom:10px;
}

.giftSettingTitle{
  margin-bottom:3px;

  font-size:10px;

  font-weight:1000;
}

.giftSettingInputs{
  display:grid;

  grid-template-columns:45px 1fr 65px;

  gap:4px;
}

/* ========================================
   仕掛け設定
======================================== */

.trickRow{
  margin-bottom:7px;

  padding:7px;

  background:#f7f7f7;

  border-radius:8px;
}

.trickRowTitle{
  margin-bottom:4px;

  font-size:10px;

  font-weight:1000;
}

.trickInputs{
  display:grid;

  grid-template-columns:42px 1fr 58px;

  gap:4px;
}

.trickMessage{
  margin-top:4px;
}

.trickDescription{
  margin-top:3px;

  color:#777;

  font-size:8px;

  font-weight:700;
}

/* ========================================
   ポップアップ
======================================== */

#popup{
  position:absolute;

  inset:0;

  z-index:300;

  display:none;

  align-items:center;
  justify-content:center;

  background:rgba(0,0,0,.55);
}

#popup.show{
  display:flex;
}

.popupBox{
  width:82%;

  max-width:330px;

  padding:18px 14px;

  background:#fff;

  border-radius:18px;

  text-align:center;

  box-shadow:
    0 8px 30px rgba(0,0,0,.3);
}

.popupIcon{
  font-size:42px;
}

.popupTitle{
  margin-top:3px;

  font-size:18px;

  font-weight:1000;
}

.popupText{
  margin-top:7px;

  color:#555;

  font-size:12px;

  line-height:1.5;

  font-weight:800;
}

.popupClose{
  width:100%;

  height:40px;

  margin-top:13px;

  border:0;

  border-radius:9px;

  background:#222;

  color:#fff;

  font-size:12px;

  font-weight:1000;
}

/* ========================================
   小さい画面
======================================== */

@media(max-width:340px){

  #header{
    height:11dvh;
  }

  #main{
    top:11dvh;

    padding:3px;

    gap:3px;
  }

  #board{
    gap:2px;
  }

  .cell{
    border-width:1px;

    border-radius:6px;
  }

  .piece{
    padding:3px 4px;
  }

}
</style>
</head>


<body>

<div id="app">

<!-- ======================================
     タイトル
====================================== -->

<header id="header">

  <h1 id="title">
    🗾 出身県はどこ？県民パワーでGOALを目指せ！
  </h1>

  <div id="subtitle">
    指定ギフトでコマを進めよう！
  </div>

</header>


<!-- ======================================
     メイン
====================================== -->

<main id="main">


  <!-- コマ選択・1マス -->
  <section id="selectRow">

    <button
      class="actionButton"
      onclick="openChooseModal()">

      🎯 コマを選ぶ

    </button>


    <button
      class="actionButton"
      onclick="moveSelected(1,'🎲')">

      🎲 1マス進む

    </button>

  </section>


  <!-- 選択中 -->
  <div id="selectedBox">

    <span id="selectedLabel">
      選択中：
    </span>

    <span id="selectedName">
      コマを選んでください
    </span>

  </div>


  <!-- ====================================
       すごろく
  ===================================== -->

  <section id="boardBox">

    <div id="boardHeader">
      🏁 GOALまであと30マス
    </div>

    <div id="board"></div>

  </section>


  <!-- ====================================
       ギフト
  ===================================== -->

  <section id="giftBox">

    <div id="giftTitle">
      🎁 指定ギフトが来たらコマを進めよう！
    </div>

    <div id="giftButtons"></div>

  </section>


  <!-- ====================================
       設定
  ===================================== -->

  <section id="bottomButtons">

    <button
      id="projectButton"
      class="bottomButton"
      onclick="openProjectModal()">

      ⚙️ 企画

    </button>


    <button
      id="giftSettingButton"
      class="bottomButton"
      onclick="openGiftModal()">

      🎁 ギフト

    </button>


    <button
      id="trickSettingButton"
      class="bottomButton"
      onclick="openTrickModal()">

      💥 仕掛け

    </button>


    <button
      id="resetButton"
      class="bottomButton"
      onclick="resetGame()">

      🔄 リセット

    </button>

  </section>

</main>


<!-- ======================================
     企画設定
====================================== -->

<div
  id="projectModal"
  class="modal">

  <div class="modalBox">

    <div class="modalHeader">

      <div class="modalTitle">
        ⚙️ 企画設定
      </div>

      <button
        class="closeButton"
        onclick="closeProjectModal()">

        ×

      </button>

    </div>


    <div class="modalScroll">

      <label class="settingLabel">
        企画タイトル
      </label>

      <input
        id="titleInput"
        class="input"
        type="text">


      <label class="settingLabel">
        サブタイトル
      </label>

      <input
        id="subtitleInput"
        class="input"
        type="text">


      <label class="settingLabel">
        コマ数 ／ GOAL
      </label>

      <div class="row2">

        <input
          id="pieceCountInput"
          class="input"
          type="number"
          min="1"
          max="47"
          onchange="buildPieceInputs()">

        <input
          id="goalInput"
          class="input"
          type="number"
          min="1"
          max="30">

      </div>


      <label class="settingLabel">
        コマの名称
      </label>

      <div
        id="pieceInputs"
        class="pieceInputs">
      </div>

    </div>


    <div class="modalButtons">

      <button
        class="modalButton saveButton"
        onclick="saveProjectSettings()">

        保存

      </button>


      <button
        class="modalButton cancelButton"
        onclick="closeProjectModal()">

        キャンセル

      </button>

    </div>

  </div>

</div>


<!-- ======================================
     コマ選択
====================================== -->

<div
  id="chooseModal"
  class="modal">

  <div
    class="modalBox"
    style="height:90%;">

    <div class="modalHeader">

      <div class="modalTitle">
        🎯 コマを選ぶ
      </div>

      <button
        class="closeButton"
        onclick="closeChooseModal()">

        ×

      </button>

    </div>


    <div class="modalScroll">

      <div
        id="chooseGrid"
        class="chooseGrid">
      </div>

    </div>

  </div>

</div>


<!-- ======================================
     ギフト設定
====================================== -->

<div
  id="giftModal"
  class="modal">

  <div
    class="modalBox"
    style="height:90%;">

    <div class="modalHeader">

      <div class="modalTitle">
        🎁 ギフト設定
      </div>

      <button
        class="closeButton"
        onclick="closeGiftModal()">

        ×

      </button>

    </div>


    <div
      id="giftSettingRows"
      class="modalScroll">
    </div>


    <div class="modalButtons">

      <button
        class="modalButton saveButton"
        onclick="saveGiftSettings()">

        保存

      </button>


      <button
        class="modalButton cancelButton"
        onclick="closeGiftModal()">

        キャンセル

      </button>

    </div>

  </div>

</div>


<!-- ======================================
     仕掛け設定
====================================== -->

<div
  id="trickModal"
  class="modal">

  <div
    class="modalBox"
    style="height:94%;">

    <div class="modalHeader">

      <div class="modalTitle">
        💥 仕掛けマス設定
      </div>

      <button
        class="closeButton"
        onclick="closeTrickModal()">

        ×

      </button>

    </div>


    <div class="modalScroll">

      <div
        style="
        padding:8px;
        background:#fff4e8;
        border-radius:8px;
        margin-bottom:7px;
        font-size:9px;
        font-weight:800;
        line-height:1.45;
        ">

        <b>仕掛けを設定したいマスだけON。</b><br>

        「表示だけ」の仕掛けはコマを動かさず、
        メッセージだけ表示します。<br>

        「一つ前の県」は、そのコマより前の位置にいる
        一番近い県が対象です。

      </div>


      <div id="trickSettingRows"></div>

    </div>


    <div class="modalButtons">

      <button
        class="modalButton saveButton"
        onclick="saveTrickSettings()">

        保存

      </button>


      <button
        class="modalButton cancelButton"
        onclick="closeTrickModal()">

        キャンセル

      </button>

    </div>

  </div>

</div>


<!-- ======================================
     ポップアップ
====================================== -->

<div id="popup">

  <div class="popupBox">

    <div
      id="popupIcon"
      class="popupIcon">

      🎁

    </div>


    <div
      id="popupTitle"
      class="popupTitle">

      コマが進んだ！

    </div>


    <div
      id="popupText"
      class="popupText">
    </div>


    <button
      class="popupClose"
      onclick="closePopup()">

      閉じる

    </button>

  </div>

</div>


<script>

let projectTitle =
  "🗾 出身県はどこ？県民パワーでGOALを目指せ！";

/* ==================================================

const colors=[

  "#e53935",

/* ==================================================
   HTMLエスケープ
================================================== */

function escapeHTML(str){

  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

/* ==================================================
   盤面作成
================================================== */

function createBoard(){

  const board=
    document.getElementById("board");

  board.innerHTML="";


  for(
    let i=1;
    i<=GOAL;
    i++
  ){

    const cell=
      document.createElement("div");

    cell.className="cell";

    cell.id="cell-"+i;


    if(i===GOAL){

      cell.classList.add("goal");

    }


    if(i===1){

      cell.classList.add("start");

    }


    const number=
      document.createElement("div");

    number.className="cellNumber";

    number.textContent=
      i===1
        ? "START"
        : i;

    cell.appendChild(number);


    const trick=
      tricks[i];


    if(
      trick &&
      trick.enabled &&
      trick.type!=="none"
    ){

      const trickEl=
        document.createElement("div");

      trickEl.className="trick";

      trickEl.textContent=
        getTrickDisplay(trick);

      cell.appendChild(trickEl);

    }


    const area=
      document.createElement("div");

    area.className="cellPieces";

    area.id="cellPieces-"+i;

    cell.appendChild(area);

    board.appendChild(cell);

  }

}


/* ==================================================
   仕掛け表示
================================================== */

function getTrickDisplay(trick){

  if(
    trick.text &&
    trick.text.trim()
  ){

    return trick.text.trim();

  }


  switch(trick.type){

    case "forward":
      return "🚀 +"+trick.value;

    case "back":
      return "↩️ -"+trick.value;

    case "start":
      return "💥 START";

    case "goal":
      return "🏆 GOAL";

    case "again":
      return "🔄 もう1回";

    case "display":
      return "🎁 お楽しみ";

    case "previousBack":
      return "🗾 前の県 -"+trick.value;

    case "previousStart":
      return "💥 前の県→START";

    case "swapPrevious":
      return "🔁 前の県と交換";

    case "leaderBack":
      return "🥇 1位 -"+trick.value;

    case "lastForward":
      return "🥉 最下位 +"+trick.value;

    default:
      return "";

  }

}

function renderPieces(){

  document
    .querySelectorAll(".cellPieces")
    .forEach(function(el){

      el.innerHTML="";

    });


  pieces.forEach(function(name,index){

    const position=
      positions[name] || 0;


    if(position<=0){

      return;

    }


    const area=
      document.getElementById(
        "cellPieces-"+position
      );


    if(!area){

      return;

    }


    const piece=
      document.createElement("div");

    piece.className="piece";


    if(name===selectedPiece){

      piece.classList.add("active");

    }


    piece.textContent=name;

    piece.style.background=
      colors[index % colors.length];


    piece.onclick=function(){

      selectPiece(name);

    };


    area.appendChild(piece);

  });


  updateBoardHeader();

}

    document.getElementById("boardHeader")
      .textContent=

  const position=

/* ==================================================
   コマ移動
================================================== */

function moveSelected(move,icon){

  if(!selectedPiece){

    showPopup(
      "⚠️",
      "コマを選んでね！",
      "「🎯 コマを選ぶ」から都道府県を選択してください。"
    );

    return;

  }


  const oldPosition=
    positions[selectedPiece] || 0;


  if(oldPosition>=GOAL){

    showPopup(
      "🏁",
      "GOAL済み！",
      selectedPiece+
      "はすでにゴールしています。"
    );

    return;

  }


  const nextPosition=
    Math.min(
      GOAL,
      oldPosition+
      Number(move)
    );


  positions[selectedPiece]=
    nextPosition;


  renderPieces();


  if(nextPosition>=GOAL){

    showPopup(
      "🏆",
      "GOAL！",
      selectedPiece+
      "がゴールしました！"
    );

    return;

  }


  triggerTrick(
    selectedPiece,
    nextPosition,
    icon
  );

}


/* ==================================================
   仕掛け発動
================================================== */

function triggerTrick(
  name,
  position,
  giftIcon
){

  const trick=
    tricks[position];


  if(
    !trick ||
    !trick.enabled ||
    trick.type==="none"
  ){

    showPopup(
      giftIcon,
      "コマが進んだ！",
      name+
      "が"+
      position+
      "番マスに到着しました。"
    );

    return;

  }


  let message="";

  const popupIcon=
    getTrickIcon(trick.type);


  switch(trick.type){

    /* 自分が進む */

    case "forward":

      positions[name]=
        Math.min(
          GOAL,
          position+
          Number(trick.value)
        );

      message=
        name+
        "は"+
        trick.value+
        "マス進みます！";

      break;


    /* 自分が戻る */

    case "back":

      positions[name]=
        Math.max(
          0,
          position-
          Number(trick.value)
        );

      message=
        name+
        "は"+
        trick.value+
        "マス戻ります！";

      break;


    /* START */

    case "start":

      positions[name]=0;

      message=
        name+
        "はSTARTに戻ります！";

      break;


    /* GOAL */

    case "goal":

      positions[name]=GOAL;

      message=
        name+
        "はGOALへ！";

      break;


    /* もう一度 */

    case "again":

      message=
        name+
        "はもう一度進めます！";

      break;


    /* 表示だけ */

    case "display":

      message=
        name+
        "にイベント発生！";

      break;


    /* 一つ前の県を戻す */

    case "previousBack":

      {

        const previous=
          findPreviousPiece(name);


        if(previous){

          positions[previous]=
            Math.max(
              0,
              positions[previous]-
              Number(trick.value)
            );

          message=
            "一つ前の県「"+
            previous+
            "」が"+
            trick.value+
            "マス戻ります！";

        }
        else{

          message=
            "一つ前の県がいません！";

        }

      }

      break;


    /* 一つ前の県をSTART */

    case "previousStart":

      {

        const previous=
          findPreviousPiece(name);


        if(previous){

          positions[previous]=0;

          message=
            "一つ前の県「"+
            previous+
            "」がSTARTに戻ります！";

        }
        else{

          message=
            "一つ前の県がいません！";

        }

      }

      break;


    /* 一つ前と交換 */

    case "swapPrevious":

      {

        const previous=
          findPreviousPiece(name);


        if(previous){

          const currentPos=
            positions[name];

          const previousPos=
            positions[previous];


          positions[name]=
            previousPos;

          positions[previous]=
            currentPos;


          message=
            name+
            "と"+
            previous+
            "の位置を交換！";

        }
        else{

          message=
            "一つ前の県がいません！";

        }

      }

      break;


    /* 1位を戻す */

    case "leaderBack":

      {

        const leader=
          getLeader(name);


        if(leader){

          positions[leader]=
            Math.max(
              0,
              positions[leader]-
              Number(trick.value)
            );


          message=
            "1位の「"+
            leader+
            "」が"+
            trick.value+
            "マス戻ります！";

        }
        else{

          message=
            "1位の県がいません！";

        }

      }

      break;


    /* 最下位を進める */

    case "lastForward":

      {

        const last=
          getLast(name);


        if(last){

          positions[last]=
            Math.min(
              GOAL,
              positions[last]+
              Number(trick.value)
            );


          message=
            "最下位の「"+
            last+
            "」が"+
            trick.value+
            "マス進みます！";

        }
        else{

          message=
            "最下位の県がいません！";

        }

      }

      break;

  }


  renderPieces();


  const displayText=
    trick.text &&
    trick.text.trim()
      ? trick.text.trim()
      : getTrickDisplay(trick);


  showPopup(
    popupIcon,
    displayText,
    message
  );


  if(
    positions[name]>=GOAL &&
    trick.type!=="display"
  ){

    setTimeout(function(){

      showPopup(
        "🏆",
        "GOAL！",
        name+
        "がGOALしました！"
      );

    },400);

  }

}


/* ==================================================
   前の県
================================================== */

function findPreviousPiece(name){

  const current=
    positions[name] || 0;


  const candidates=
    pieces
      .filter(function(piece){

        return(
          piece!==name &&
          positions[piece]>0 &&
          positions[piece]<current
        );

      })
      .sort(function(a,b){

        return(
          positions[b]-
          positions[a]
        );

      });


  return candidates.length
    ? candidates[0]
    : null;

}


/* ==================================================
   1位
================================================== */

function getLeader(excludeName){

  const list=
    pieces.filter(function(name){

      return name!==excludeName;

    });


  list.sort(function(a,b){

    return(
      positions[b]-
      positions[a]
    );

  });


  return list.length
    ? list[0]
    : null;

}


/* ==================================================
   最下位
================================================== */

function getLast(excludeName){

  const list=
    pieces.filter(function(name){

      return name!==excludeName;

    });


  list.sort(function(a,b){

    return(
      positions[a]-
      positions[b]
    );

  });


  return list.length
    ? list[0]
    : null;

}


/* ==================================================
   仕掛けアイコン
================================================== */

function getTrickIcon(type){

  switch(type){

    case "forward":
      return "🚀";

    case "back":
      return "↩️";

    case "start":
      return "💥";

    case "goal":
      return "🏆";

    case "again":
      return "🔄";

    case "display":
      return "🎁";

    case "previousBack":
      return "🗾";

    case "previousStart":
      return "💥";

    case "swapPrevious":
      return "🔁";

    case "leaderBack":
      return "🥇";

    case "lastForward":
      return "🥉";

    default:
      return "💥";

  }

}

    Math.max(

      Math.min(47,count||1)
    );

  area.innerHTML="";

    input.type="text";

    input.value=
      pieces[i] ||
      "コマ"+(i+1);


    row.appendChild(num);

    row.appendChild(input);

    area.appendChild(row);

  }

}


/* ==================================================
   企画保存
================================================== */

function saveProjectSettings(){

  const title=
    document.getElementById(
      "titleInput"
    ).value.trim();


  const subtitle=
    document.getElementById(
      "subtitleInput"
    ).value.trim();


  let count=
    Number(
      document.getElementById(
        "pieceCountInput"
      ).value
    );


  let goal=
    Number(
      document.getElementById(
        "goalInput"
      ).value
    );


  count=
    Math.max(
      1,
      Math.min(47,count||1)
    );


  goal=
    Math.max(
      1,
      Math.min(30,goal||1)
    );


  const oldPositions=
    {...positions};


  const oldTricks=
    {...tricks};


  const newPieces=[];


  for(
    let i=0;
    i<count;
    i++
  ){

    const input=
      document.getElementById(
        "pieceInput-"+i
      );


    let name=
      input
        ? input.value.trim()
        : "";


    if(!name){

      name="コマ"+(i+1);

    }


    if(newPieces.includes(name)){

      name=
        name+" "+(i+1);

    }


    newPieces.push(name);

  }


  projectTitle=
    title ||
    "すごろく企画";


  projectSubtitle=
    subtitle ||
    "指定ギフトでコマを進めよう！";


  GOAL=goal;

  pieces=newPieces;


  positions={};


  pieces.forEach(function(name){

    positions[name]=
      Math.min(
        oldPositions[name]||0,
        GOAL
      );

  });


  tricks={};


  for(
    let i=1;
    i<=GOAL;
    i++
  ){

    tricks[i]=
      oldTricks[i] ||
      {
        enabled:false,
        type:"none",
        value:2,
        text:""
      };

  }


  if(
    !selectedPiece ||
    !pieces.includes(selectedPiece)
  ){

    selectedPiece=null;

    document.getElementById(
      "selectedName"
    ).textContent=
      "コマを選んでください";

  }


  closeProjectModal();

  updateAll();


  showPopup(
    "⚙️",
    "設定完了！",
    "企画設定を変更しました。"
  );

}

      "</option>"+

      '<option value="leaderBack">'+
      "🥇 1位の県を○マス戻す"+
      "</option>"+

      '<option value="lastForward">'+
      "🥉 最下位の県を○マス進める"+
      "</option>"+

      '</select>'+

      '<input class="input" '+
      'id="trickValue-'+i+'" '+
      'type="number" '+
      'min="1" '+
      'max="100" '+
      'value="'+
      t.value+
      '">'+

      '</div>'+

      '<input class="input trickMessage" '+
      'id="trickText-'+i+'" '+
      'placeholder="表示文字（任意）" '+
      'value="'+
      escapeHTML(t.text)+
      '">';


    area.appendChild(row);


    document.getElementById(
      "trickEnabled-"+i
    ).value=
      t.enabled
        ? "on"
        : "off";


    document.getElementById(
      "trickType-"+i
    ).value=
      t.type;

  }

}


/* ==================================================
   仕掛け保存
================================================== */

function saveTrickSettings(){

  const newTricks={};


  for(
    let i=1;
    i<=GOAL;
    i++
  ){

    const enabled=
      document.getElementById(
        "trickEnabled-"+i
      ).value==="on";


    const type=
      document.getElementById(
        "trickType-"+i
      ).value;


    let value=
      Number(
        document.getElementById(
          "trickValue-"+i
        ).value
      );


    if(!value||value<1){

      value=1;

    }


    const text=
      document.getElementById(
        "trickText-"+i
      ).value.trim();


    newTricks[i]={

      enabled:
        enabled &&
        type!=="none",

      type:type,

      value:value,

      text:text

    };

  }


  tricks=newTricks;


  closeTrickModal();

  updateAll();


  showPopup(
    "💥",
    "仕掛け設定完了！",
    "仕掛けマスを更新しました。"
  );

}


/* ==================================================
   リセット
================================================== */

function resetGame(){

  if(
    !confirm(
      "全てのコマをSTARTに戻しますか？"
    )
  ){

    return;

  }


  pieces.forEach(function(name){

    positions[name]=0;

  });


  updateAll();


  showPopup(
    "🔄",
    "リセット完了",
    "全てのコマがSTARTに戻りました。"
  );

}


/* ==================================================
   全更新
================================================== */

function updateAll(){

  updateTitle();

  createBoard();

  renderPieces();

  createGiftButtons();

}


/* ==================================================
   起動
================================================== */

initializePositions();

initializeTricks();

updateAll();

</script>
