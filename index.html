<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>都道府県すごろく</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,
  "Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  background:#eee8ff;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

button,input,select{
  font-family:inherit;
}

/* =========================
   全体
========================= */

.app{
  width:100%;
  height:100dvh;
  max-width:900px;
  background:#fff;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* =========================
   ヘッダー
========================= */

.header{
  flex:0 0 8.5%;
  min-height:55px;
  background:linear-gradient(135deg,#6d28d9,#8b5cf6);
  color:#fff;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  position:relative;
  padding:4px 65px 4px 8px;
}

.header h1{
  font-size:clamp(15px,3.7vw,28px);
  line-height:1.15;
  font-weight:900;
  text-align:center;
}

.header p{
  margin-top:3px;
  font-size:clamp(9px,2.2vw,15px);
  line-height:1.15;
}

.headerButtons{
  position:absolute;
  right:7px;
  top:50%;
  transform:translateY(-50%);
}

.headerButtons button{
  background:rgba(255,255,255,.2);
  color:#fff;
  border:1px solid rgba(255,255,255,.4);
  border-radius:7px;
  padding:6px 7px;
  font-size:10px;
  font-weight:900;
}

/* =========================
   メイン
========================= */

.main{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  padding:5px;
  gap:4px;
  overflow:hidden;
}

/* =========================
   選択中
========================= */

.selectedBox{
  flex:0 0 7%;
  min-height:38px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:5px;
  padding:3px 7px;
  background:#f3e8ff;
  border:2px solid #8b5cf6;
  border-radius:8px;
}

.selectedLabel{
  font-size:9px;
  color:#555;
}

.selectedName{
  font-size:14px;
  font-weight:900;
  color:#6d28d9;
  line-height:1.1;
}

.moveButton{
  flex:0 0 auto;
  background:#6d28d9;
  color:#fff;
  border-radius:7px;
  padding:7px 10px;
  font-size:10px;
  font-weight:900;
}

/* =========================
   すごろく盤
========================= */

.boardWrap{
  flex:1;
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
}

.board{
  width:100%;
  height:100%;
  display:grid;
  grid-template-columns:repeat(6,1fr);
  grid-template-rows:repeat(5,1fr);
  gap:2px;
  padding:2px;
  border:2px solid #444;
  border-radius:8px;
  background:#d4d4d4;
}

/* =========================
   マス
========================= */

.cell{
  min-width:0;
  min-height:0;
  position:relative;
  overflow:hidden;
  border:1px solid #777;
  border-radius:4px;
  background:#fff;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.cellNumber{
  position:absolute;
  left:2px;
  top:1px;
  font-size:clamp(7px,1.8vw,12px);
  line-height:1;
  font-weight:900;
  color:#555;
}

.cellTrick{
  font-size:clamp(6px,1.35vw,10px);
  font-weight:900;
  line-height:1.05;
  text-align:center;
  padding:1px;
  margin-top:4px;
}

.cell.start{
  background:#e0f2fe;
  border-color:#0284c7;
}

.cell.goal{
  background:#fff7cc;
  border-color:#eab308;
}

.pieces{
  width:100%;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  align-items:center;
  gap:1px;
  padding:1px;
}

.piece{
  max-width:94%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  background:#6d28d9;
  color:#fff;
  border-radius:3px;
  padding:2px 3px;
  font-size:clamp(6px,1.25vw,9px);
  font-weight:900;
  line-height:1;
}

/* =========================
   ギフト
========================= */

.giftArea{
  flex:0 0 13%;
  min-height:60px;
  background:#faf5ff;
  border:2px solid #ddd6fe;
  border-radius:8px;
  padding:3px;
}

.giftTitle{
  height:18px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:10px;
  font-weight:900;
  color:#5b21b6;
}

.giftGrid{
  height:calc(100% - 18px);
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:3px;
}

.giftButton{
  min-width:0;
  min-height:0;
  border-radius:6px;
  color:#fff;
  background:#7c3aed;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:2px;
  font-weight:900;
}

.giftButton:nth-child(2){
  background:#ec4899;
}

.giftButton:nth-child(3){
  background:#f59e0b;
}

.giftIcon{
  font-size:16px;
  line-height:1;
}

.giftName{
  width:95%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  text-align:center;
  font-size:8px;
  line-height:1.1;
  margin-top:2px;
}

.giftMove{
  font-size:7px;
  line-height:1;
  margin-top:2px;
}

/* =========================
   下部ボタン
========================= */

.bottomSettings{
  flex:0 0 7%;
  min-height:38px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:3px;
}

.bottomSettings button{
  min-height:0;
  border-radius:6px;
  background:#eee;
  border:1px solid #ccc;
  font-size:9px;
  font-weight:900;
  color:#333;
}

/* =========================
   モーダル
========================= */

.modal{
  position:fixed;
  inset:0;
  z-index:1000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:10px;
  background:rgba(0,0,0,.55);
}

.modal.show{
  display:flex;
}

.modalBox{
  width:min(94vw,600px);
  max-height:90dvh;
  background:#fff;
  border-radius:12px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

.modalHeader{
  flex:0 0 auto;
  background:#6d28d9;
  color:#fff;
  text-align:center;
  padding:10px;
  font-size:15px;
  font-weight:900;
}

.modalBody{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:10px;
}

.modalFooter{
  flex:0 0 auto;
  display:flex;
  gap:5px;
  padding:6px;
  border-top:1px solid #ddd;
}

.modalFooter button{
  flex:1;
  border-radius:7px;
  padding:9px;
  font-weight:900;
}

.closeBtn{
  background:#eee;
}

.saveBtn{
  background:#6d28d9;
  color:#fff;
}

/* =========================
   コマ選択
========================= */

.info{
  background:#f3e8ff;
  color:#4c1d95;
  border-radius:7px;
  padding:7px;
  font-size:10px;
  line-height:1.4;
  margin-bottom:8px;
}

.pieceGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:4px;
}

.pieceSelect{
  min-height:36px;
  background:#f5f5f5;
  border:2px solid #ddd;
  border-radius:6px;
  font-size:10px;
  font-weight:900;
}

.pieceSelect.selected{
  background:#ede9fe;
  border-color:#7c3aed;
  color:#5b21b6;
}

/* =========================
   フォーム
========================= */

.formGroup{
  margin-bottom:7px;
}

.formGroup label{
  display:block;
  font-size:10px;
  font-weight:900;
  margin-bottom:3px;
}

.formGroup input,
.formGroup select{
  width:100%;
  border:1px solid #bbb;
  border-radius:6px;
  padding:7px;
  font-size:12px;
}

.twoCol{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
}

/* =========================
   ギフト設定
========================= */

.giftSetting{
  border:1px solid #ddd;
  border-radius:8px;
  padding:8px;
  margin-bottom:7px;
  background:#fafafa;
}

.giftSettingTitle{
  color:#5b21b6;
  font-weight:900;
  font-size:12px;
  margin-bottom:5px;
}

/* =========================
   仕掛け設定
========================= */

.trickSetting{
  border:1px solid #ddd;
  border-radius:7px;
  padding:6px;
  margin-bottom:5px;
}

.trickSetting strong{
  display:block;
  font-size:10px;
  margin-bottom:3px;
}

.trickSetting select,
.trickSetting input{
  width:100%;
  border:1px solid #bbb;
  border-radius:5px;
  padding:6px;
  font-size:10px;
  margin-bottom:3px;
}

/* =========================
   通常ポップアップ
========================= */

.popup{
  position:fixed;
  inset:0;
  z-index:2000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  background:rgba(0,0,0,.45);
}

.popup.show{
  display:flex;
}

.popupBox{
  width:min(88vw,400px);
  background:#fff;
  border-radius:14px;
  padding:18px;
  text-align:center;
  box-shadow:0 10px 40px rgba(0,0,0,.3);
}

.popupIcon{
  font-size:40px;
}

.popupTitle{
  margin-top:5px;
  color:#5b21b6;
  font-size:19px;
  font-weight:900;
}

.popupText{
  margin-top:6px;
  font-size:13px;
  line-height:1.5;
  white-space:pre-line;
}

.popupButton{
  margin-top:12px;
  background:#6d28d9;
  color:#fff;
  border-radius:7px;
  padding:9px 24px;
  font-weight:900;
}

/* =========================
   大きなサイコロ演出
========================= */

.diceOverlay{
  position:fixed;
  inset:0;
  z-index:3000;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.72);
}

.diceOverlay.show{
  display:flex;
}

.diceAnimationBox{
  width:240px;
  text-align:center;
}

.bigDice{
  width:150px;
  height:150px;
  margin:0 auto;
  background:#fff;
  border:7px solid #333;
  border-radius:25px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:86px;
  font-weight:900;
  box-shadow:0 12px 45px rgba(0,0,0,.5);
  animation:diceShake .12s infinite alternate;
}

.diceRollingText{
  margin-top:22px;
  color:#fff;
  font-size:19px;
  font-weight:900;
  text-shadow:0 2px 5px rgba(0,0,0,.7);
}

@keyframes diceShake{
  0%{
    transform:rotate(-12deg) scale(.92);
  }

  50%{
    transform:rotate(0deg) scale(1.05);
  }

  100%{
    transform:rotate(12deg) scale(.92);
  }
}

/* =========================
   小型スマホ
========================= */

@media(max-width:390px){

  .header{
    flex-basis:8%;
    min-height:50px;
  }

  .header h1{
    font-size:14px;
  }

  .header p{
    font-size:8px;
  }

  .selectedBox{
    flex-basis:6.5%;
    min-height:34px;
  }

  .selectedName{
    font-size:12px;
  }

  .moveButton{
    padding:6px 8px;
    font-size:9px;
  }

  .giftArea{
    flex-basis:12%;
    min-height:55px;
  }

  .giftIcon{
    font-size:14px;
  }

  .bottomSettings{
    flex-basis:6.5%;
    min-height:34px;
  }

  .bottomSettings button{
    font-size:8px;
  }

  .bigDice{
    width:130px;
    height:130px;
    font-size:74px;
  }

  .diceRollingText{
    font-size:16px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- =========================
       ヘッダー
  ========================== -->

  <header class="header">

    <div class="headerButtons">
      <button onclick="openProjectSettings()">
        ⚙️設定
      </button>
    </div>

    <h1 id="titleText">
      🗾 出身県はどこ？県民パワーでGOALを目指せ！
    </h1>

    <p id="subtitleText">
      指定ギフトでコマを進めよう！
    </p>

  </header>


  <main class="main">

    <!-- =========================
         選択中
    ========================== -->

    <div class="selectedBox">

      <div>
        <div class="selectedLabel">
          現在選択中
        </div>

        <div class="selectedName"
             id="selectedName">
          未選択
        </div>
      </div>

      <button class="moveButton"
              onclick="moveSelected(1,'🎲')">
        🎲 1マス進む
      </button>

    </div>


    <!-- =========================
         盤面
    ========================== -->

    <div class="boardWrap">

      <div class="board"
           id="board">
      </div>

    </div>


    <!-- =========================
         ギフト
    ========================== -->

    <section class="giftArea">

      <div class="giftTitle">
        🎁 指定ギフトでコマを進めよう！
      </div>

      <div class="giftGrid"
           id="giftGrid">
      </div>

    </section>


    <!-- =========================
         操作ボタン
    ========================== -->

    <div class="bottomSettings">

      <button onclick="openPieceModal()">
        🗾 コマを選ぶ
      </button>

      <button onclick="openGiftSettings()">
        🎁 ギフト設定
      </button>

      <button onclick="openTrickSettings()">
        ⭐ 仕掛け設定
      </button>

      <button onclick="resetGame()">
        🔄 リセット
      </button>

    </div>

  </main>

</div>


<!-- =====================================================
     コマ選択
===================================================== -->

<div class="modal"
     id="pieceModal">

  <div class="modalBox">

    <div class="modalHeader">
      🗾 コマを選択
    </div>

    <div class="modalBody">

      <div class="info">
        進めたい都道府県をタップしてください。
      </div>

      <div class="pieceGrid"
           id="pieceGrid">
      </div>

    </div>

    <div class="modalFooter">

      <button class="closeBtn"
              onclick="closeModal('pieceModal')">
        閉じる
      </button>

    </div>

  </div>

</div>


<!-- =====================================================
     ギフト設定
===================================================== -->

<div class="modal"
     id="giftModal">

  <div class="modalBox">

    <div class="modalHeader">
      🎁 ギフト設定
    </div>

    <div class="modalBody">

      <div class="info">
        「固定マス」なら決めたマス数だけ進みます。<br>
        「サイコロ」なら指定回数振って、出た目の合計だけ進みます。
      </div>

      <div id="giftSettingsList">
      </div>

    </div>

    <div class="modalFooter">

      <button class="closeBtn"
              onclick="closeModal('giftModal')">
        キャンセル
      </button>

      <button class="saveBtn"
              onclick="saveGiftSettings()">
        保存する
      </button>

    </div>

  </div>

</div>


<!-- =====================================================
     仕掛け設定
===================================================== -->

<div class="modal"
     id="trickModal">

  <div class="modalBox">

    <div class="modalHeader">
      ⭐ マスの仕掛け設定
    </div>

    <div class="modalBody">

      <div class="info">
        各マスに仕掛けを設定できます。
      </div>

      <div id="trickSettingsList">
      </div>

    </div>

    <div class="modalFooter">

      <button class="closeBtn"
              onclick="closeModal('trickModal')">
        キャンセル
      </button>

      <button class="saveBtn"
              onclick="saveTrickSettings()">
        保存する
      </button>

    </div>

  </div>

</div>


<!-- =====================================================
     プロジェクト設定
===================================================== -->

<div class="modal"
     id="projectModal">

  <div class="modalBox">

    <div class="modalHeader">
      ⚙️ プロジェクト設定
    </div>

    <div class="modalBody">

      <div class="formGroup">

        <label>タイトル</label>

        <input id="projectTitle"
               type="text">

      </div>

      <div class="formGroup">

        <label>サブタイトル</label>

        <input id="projectSubtitle"
               type="text">

      </div>

      <div class="formGroup">

        <label>GOALマス</label>

        <input id="projectGoal"
               type="number"
               min="1"
               max="99">

      </div>

    </div>

    <div class="modalFooter">

      <button class="closeBtn"
              onclick="closeModal('projectModal')">
        キャンセル
      </button>

      <button class="saveBtn"
              onclick="saveProjectSettings()">
        保存する
      </button>

    </div>

  </div>

</div>


<!-- =====================================================
     通常ポップアップ
===================================================== -->

<div class="popup"
     id="popup">

  <div class="popupBox">

    <div class="popupIcon"
         id="popupIcon">
      🎲
    </div>

    <div class="popupTitle"
         id="popupTitle">
      サイコロ
    </div>

    <div class="popupText"
         id="popupText">
    </div>

    <button class="popupButton"
            onclick="closePopup()">
      閉じる
    </button>

  </div>

</div>


<!-- =====================================================
     サイコロ中央演出
===================================================== -->

<div class="diceOverlay"
     id="diceOverlay">

  <div class="diceAnimationBox">

    <div class="bigDice"
         id="bigDice">
      🎲
    </div>

    <div class="diceRollingText"
         id="diceRollingText">
      サイコロを振っています！
    </div>

  </div>

</div>


<script>

/* =====================================================
   基本設定
===================================================== */

let title =
  "🗾 出身県はどこ？県民パワーでGOALを目指せ！";

let subtitle =
  "指定ギフトでコマを進めよう！";

let GOAL = 30;


/* =====================================================
   都道府県
===================================================== */

const prefectures = [
  "北海道","青森県","岩手県","宮城県","秋田県",
  "山形県","福島県","茨城県","栃木県","群馬県",
  "埼玉県","千葉県","東京都","神奈川県","新潟県",
  "富山県","石川県","福井県","山梨県","長野県",
  "岐阜県","静岡県","愛知県","三重県","滋賀県",
  "京都府","大阪府","兵庫県","奈良県","和歌山県",
  "鳥取県","島根県","岡山県","広島県","山口県",
  "徳島県","香川県","愛媛県","高知県","福岡県",
  "佐賀県","長崎県","熊本県","大分県","宮崎県",
  "鹿児島県","沖縄県"
];


/* =====================================================
   コマ位置
===================================================== */

let positions = {};

prefectures.forEach(name=>{
  positions[name] = 0;
});

let selectedPiece = null;


/* =====================================================
   ギフト設定
===================================================== */

let gifts = [

  {
    icon:"❤️",
    name:"ハートミー",
    type:"fixed",
    move:1,
    diceCount:1
  },

  {
    icon:"🍩",
    name:"ドーナツ",
    type:"fixed",
    move:3,
    diceCount:1
  },

  {
    icon:"🎁",
    name:"指定ギフト",
    type:"fixed",
    move:5,
    diceCount:1
  },

  {
    icon:"⭐",
    name:"スペシャル",
    type:"fixed",
    move:10,
    diceCount:1
  },

  {
    icon:"🌟",
    name:"特大ギフト",
    type:"fixed",
    move:20,
    diceCount:1
  }

];


/* =====================================================
   仕掛け
===================================================== */

let tricks = {};

for(let i=1;i<=99;i++){

  tricks[i] = {
    type:"none",
    value:0
  };

}


/* 初期仕掛け */

tricks[5] = {
  type:"forward",
  value:2
};

tricks[8] = {
  type:"back",
  value:2
};

tricks[12] = {
  type:"again",
  value:0
};

tricks[15] = {
  type:"display",
  value:0
};

tricks[18] = {
  type:"previousBack",
  value:2
};

tricks[21] = {
  type:"previousStart",
  value:0
};

tricks[24] = {
  type:"swapPrevious",
  value:0
};

tricks[26] = {
  type:"leaderBack",
  value:2
};

tricks[28] = {
  type:"lastForward",
  value:2
};


/* =====================================================
   仕掛け文字
===================================================== */

function trickText(trick){

  switch(trick.type){

    case "forward":
      return "⬆️"+trick.value+"マス";

    case "back":
      return "⬇️"+trick.value+"マス";

    case "start":
      return "🔵STARTへ";

    case "goal":
      return "🏆GOALへ";

    case "again":
      return "🎲もう1回";

    case "display":
      return "🎁お楽しみ袋";

    case "previousBack":
      return "👥前の県−"+trick.value;

    case "previousStart":
      return "👥前の県START";

    case "swapPrevious":
      return "🔄前の県と入替";

    case "leaderBack":
      return "👑先頭−"+trick.value;

    case "lastForward":
      return "🚀最後尾＋"+trick.value;

    default:
      return "";
  }

}


/* =====================================================
   盤面描画
===================================================== */

function renderBoard(){

  const board =
    document.getElementById("board");

  board.innerHTML = "";


  for(let i=1;i<=GOAL;i++){

    const cell =
      document.createElement("div");

    cell.className = "cell";


    if(i===1){
      cell.classList.add("start");
    }

    if(i===GOAL){
      cell.classList.add("goal");
    }


    const number =
      document.createElement("div");

    number.className =
      "cellNumber";

    number.textContent =
      i;

    cell.appendChild(number);


    const trick =
      tricks[i];


    if(trick &&
       trick.type !== "none"){

      const trickDiv =
        document.createElement("div");

      trickDiv.className =
        "cellTrick";

      trickDiv.textContent =
        trickText(trick);

      cell.appendChild(trickDiv);

    }


    const piecesDiv =
      document.createElement("div");

    piecesDiv.className =
      "pieces";


    prefectures.forEach(name=>{

      if(positions[name] === i){

        const piece =
          document.createElement("div");

        piece.className =
          "piece";

        piece.textContent =
          name;

        piecesDiv.appendChild(piece);

      }

    });


    cell.appendChild(piecesDiv);

    board.appendChild(cell);

  }

}

/* =====================================================
   エスケープ
===================================================== */

function escapeHtml(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   ギフト使用
===================================================== */

function useGift(index){

  if(isRollingDice){
    return;
  }


  if(!selectedPiece){

    showPopup(
      "⚠️",
      "コマを選んでください",
      "先に「🗾 コマを選ぶ」から都道府県を選択してください。"
    );

    return;
  }


  const gift =
    gifts[index];


  if(!gift){
    return;
  }


  if(gift.type === "dice"){

    rollDiceForGift(gift);

  }else{

    const move =
      Math.max(
        0,
        Number(gift.move) || 0
      );

    moveSelected(
      move,
      gift.icon
    );

  }

}


/* =====================================================
   サイコロ
===================================================== */

let isRollingDice = false;


async function rollDiceForGift(gift){

  if(!selectedPiece ||
     isRollingDice){
    return;
  }


  isRollingDice = true;


  const count =
    Math.max(
      1,
      Math.min(
        20,
        Number(gift.diceCount) || 1
      )
    );


  let rolls = [];


  showBigDice();


  for(let i=0;i<count;i++){

    document.getElementById(
      "diceRollingText"
    ).textContent =
      (i+1)+"回目のサイコロを振っています！";


    /*
      サイコロをパラパラ動かす
    */

    for(let j=0;j<12;j++){

      document.getElementById(
        "bigDice"
      ).textContent =
        Math.floor(
          Math.random()*6
        )+1;

      await wait(60);

    }


    const result =
      Math.floor(
        Math.random()*6
      )+1;


    rolls.push(result);


    document.getElementById(
      "bigDice"
    ).textContent =
      result;


    document.getElementById(
      "diceRollingText"
    ).textContent =
      "🎲 出た目は "+result+"！";


    await wait(700);

  }


  const total =
    rolls.reduce(
      (sum,num)=>sum+num,
      0
    );


  document.getElementById(
    "bigDice"
  ).textContent =
    total;


  document.getElementById(
    "diceRollingText"
  ).textContent =
    "🎉 合計 "+total+"マス！";


  await wait(900);


  hideBigDice();


  await wait(150);


  moveSelected(
    total,
    "🎲",
    "🎲 出た目："+rolls.join(" ＋ ")+" ＝ "+total+"マス"
  );


  isRollingDice = false;

}

/* =====================================================
   コマを進める
===================================================== */

function moveSelected(
  move,
  icon="🎲",
  extraText=""
){

  if(!selectedPiece){

    showPopup(
      "⚠️",
      "コマを選んでください",
      "先に都道府県を選択してください。"
    );

    return;
  }


  const current =
    positions[selectedPiece] || 0;


  let newPosition =
    current + Number(move);


  if(newPosition < 1){
    newPosition = 1;
  }


  /* GOAL */

  if(newPosition >= GOAL){

    positions[selectedPiece] =
      GOAL;

    renderBoard();


    showPopup(
      "🏆",
      "GOAL！",
      selectedPiece+
      " がゴールしました！"+
      (extraText ?
        "\n"+extraText :
        "")
    );

    return;
  }


  positions[selectedPiece] =
    newPosition;


  renderBoard();


  let message =
    selectedPiece+
    " が "+
    move+
    "マス進みました！";


  if(extraText){

    message =
      extraText+
      "\n"+
      message;

  }


  const trick =
    tricks[newPosition];


  if(trick &&
     trick.type !== "none"){

    triggerTrick(
      selectedPiece,
      newPosition,
      trick,
      icon,
      message
    );

  }else{

    showPopup(
      icon,
      "コマが進みました！",
      message
    );

  }

}


/* =====================================================
   仕掛け発動
===================================================== */

function triggerTrick(
  piece,
  position,
  trick,
  giftIcon,
  sourceText=""
){

  switch(trick.type){

    case "forward":{

      const amount =
        Number(trick.value)||0;

      positions[piece] =
        Math.min(
          GOAL,
          positions[piece]+amount
        );

      renderBoard();

      showPopup(
        "⬆️",
        "仕掛け発動！",
        sourceText+
        "\n\n"+
        piece+
        " はさらに "+
        amount+
        "マス進みます！"
      );

      break;
    }


    case "back":{

      const amount =
        Number(trick.value)||0;

      positions[piece] =
        Math.max(
          1,
          positions[piece]-amount
        );

      renderBoard();

      showPopup(
        "⬇️",
        "仕掛け発動！",
        sourceText+
        "\n\n"+
        piece+
        " は "+
        amount+
        "マス戻ります！"
      );

      break;
    }


    case "start":{

      positions[piece] = 1;

      renderBoard();

      showPopup(
        "🔵",
        "STARTへ！",
        sourceText+
        "\n\n"+
        piece+
        " はSTARTへ戻りました。"
      );

      break;
    }


    case "goal":{

      positions[piece] =
        GOAL;

      renderBoard();

      showPopup(
        "🏆",
        "GOAL！",
        sourceText+
        "\n\n"+
        piece+
        " がゴールしました！"
      );

      break;
    }


    case "again":{

      showPopup(
        "🎲",
        "もう1回！",
        sourceText+
        "\n\n"+
        piece+
        " はもう一度進めます！"
      );

      break;
    }


    case "display":{

      showPopup(
        "🎁",
        "お楽しみ袋！",
        sourceText+
        "\n\n"+
        "お楽しみ袋が表示されました！"
      );

      break;
    }


    case "previousBack":{

      const index =
        prefectures.indexOf(piece);

      if(index > 0){

        const previous =
          prefectures[index-1];

        const amount =
          Number(trick.value)||0;

        positions[previous] =
          Math.max(
            1,
            positions[previous]-amount
          );

        renderBoard();

        showPopup(
          "👥",
          "前の県が戻ります！",
          sourceText+
          "\n\n"+
          previous+
          " が "+
          amount+
          "マス戻りました。"
        );

      }else{

        showPopup(
          "👥",
          "仕掛け発動！",
          sourceText
        );

      }

      break;
    }


    case "previousStart":{

      const index =
        prefectures.indexOf(piece);

      if(index > 0){

        const previous =
          prefectures[index-1];

        positions[previous] = 1;

        renderBoard();

        showPopup(
          "🔵",
          "前の県がSTARTへ！",
          sourceText+
          "\n\n"+
          previous+
          " がSTARTへ戻りました。"
        );

      }else{

        showPopup(
          "👥",
          "仕掛け発動！",
          sourceText
        );

      }

      break;
    }


    case "swapPrevious":{

      const index =
        prefectures.indexOf(piece);

      if(index > 0){

        const previous =
          prefectures[index-1];

        const temp =
          positions[piece];

        positions[piece] =
          positions[previous];

        positions[previous] =
          temp;

        renderBoard();

        showPopup(
          "🔄",
          "位置入れ替え！",
          sourceText+
          "\n\n"+
          piece+
          " と "+
          previous+
          " の位置が入れ替わりました！"
        );

      }else{

        showPopup(
          "🔄",
          "仕掛け発動！",
          sourceText
        );

      }

      break;
    }


    case "leaderBack":{

      let leader = null;
      let leaderPosition = -1;


      prefectures.forEach(name=>{

        const pos =
          positions[name] || 0;

        if(pos > leaderPosition){

          leaderPosition = pos;
          leader = name;

        }

      });


      if(leader){

        const amount =
          Number(trick.value)||0;

        positions[leader] =
          Math.max(
            1,
            positions[leader]-amount
          );

        renderBoard();

        showPopup(
          "👑",
          "先頭が戻ります！",
          sourceText+
          "\n\n"+
          leader+
          " が "+
          amount+
          "マス戻りました。"
        );

      }else{

        showPopup(
          "👑",
          "仕掛け発動！",
          sourceText
        );

      }

      break;
    }


    case "lastForward":{

      let last = null;
      let lastPosition = Infinity;


      prefectures.forEach(name=>{

        const pos =
          positions[name] || 0;

        if(pos > 0 &&
           pos < lastPosition){

          lastPosition = pos;
          last = name;

        }

      });


      if(last){

        const amount =
          Number(trick.value)||0;

        positions[last] =
          Math.min(
            GOAL,
            positions[last]+amount
          );

        renderBoard();

        showPopup(
          "🚀",
          "最後尾が進みます！",
          sourceText+
          "\n\n"+
          last+
          " が "+
          amount+
          "マス進みました。"
        );

      }else{

        showPopup(
          "🚀",
          "仕掛け発動！",
          sourceText
        );

      }

      break;
    }


    default:

      showPopup(
        giftIcon,
        "コマが進みました！",
        sourceText
      );

  }

}

/* =====================================================
   ギフト設定切替
===================================================== */

function updateGiftSettingFields(index){

  const type =
    document.getElementById(
      "giftType"+index
    )?.value;


  const moveArea =
    document.getElementById(
      "giftMoveArea"+index
    );

  const diceArea =
    document.getElementById(
      "giftDiceArea"+index
    );


  if(!moveArea ||
     !diceArea){
    return;
  }


  if(type === "dice"){

    moveArea.style.display =
      "none";

    diceArea.style.display =
      "block";

  }else{

    moveArea.style.display =
      "block";

    diceArea.style.display =
      "none";

  }

}

/* =====================================================
   ポップアップ
===================================================== */

function showPopup(
  icon,
  titleText,
  text
){

  document.getElementById(
    "popupIcon"
  ).textContent =
    icon;


  document.getElementById(
    "popupTitle"
  ).textContent =
    titleText;


  document.getElementById(
    "popupText"
  ).textContent =
    text;


  document.getElementById(
    "popup"
  ).classList.add("show");

}


function closePopup(){

  document.getElementById(
    "popup"
  ).classList.remove("show");

}


/* =====================================================
   リセット
===================================================== */

function resetGame(){

  const ok =
    confirm(
      "すべてのコマをリセットしますか？"
    );


  if(!ok){
    return;
  }


  prefectures.forEach(name=>{

    positions[name] = 0;

  });


  selectedPiece = null;

  updateSelected();

  renderBoard();


  showPopup(
    "🔄",
    "リセットしました！",
    "すべてのコマをSTART前に戻しました。"
  );

}
