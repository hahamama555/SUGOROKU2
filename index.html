<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>県民パワーすごろく</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
}

.app{
  width:min(100vw,56.25vh);
  height:min(100vh,177.7778vw);
  aspect-ratio:9/16;
  overflow:hidden;
  position:relative;
  background:linear-gradient(180deg,#fff8fc,#f5f2ff 55%,#eefaff);
  color:#222;
}

/* =========================
タイトル
========================= */

.header{
  position:relative;
  height:9%;
  padding:1.5% 3% 0;
  text-align:center;
  overflow:hidden;
}

.title{
  margin:0;
  height:58%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:clamp(13px,4vw,21px);
  line-height:1.05;
  font-weight:1000;
  white-space:nowrap;
}

.subtitle{
  height:38%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:clamp(7px,2vw,10px);
  color:#666;
  font-weight:900;
}

/* =========================
TOP3
========================= */

.rank{
  height:8%;
  margin:0 2.5%;
  padding:1%;
  background:#fff;
  border-radius:12px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
  overflow:hidden;
}

.rank-title{
  height:25%;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:clamp(7px,1.9vw,10px);
  font-weight:1000;
}

.rank-list{
  height:75%;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5px;
}

.rank-item{
  min-width:0;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:3px;
  overflow:hidden;
}

.rank-item:nth-child(1){background:#fff0a5;}
.rank-item:nth-child(2){background:#eee;}
.rank-item:nth-child(3){background:#efdcc7;}

.rank-medal{
  font-size:clamp(9px,2.5vw,14px);
}

.rank-name{
  max-width:62%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:clamp(6px,1.8vw,10px);
  font-weight:1000;
}

/* =========================
コマ選択
========================= */

.select-area{
  height:6%;
  margin:1% 2.5% 0;
}

.select-button{
  width:100%;
  height:100%;
  border:0;
  border-radius:10px;
  background:#222;
  color:#fff;
  font-size:clamp(9px,2.8vw,14px);
  font-weight:1000;
}

.selected{
  height:5%;
  margin:1% 2.5% 0;
  background:#fff;
  border-radius:9px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
  overflow:hidden;
}

.selected-label{
  color:#777;
  font-size:clamp(6px,1.7vw,9px);
  font-weight:900;
}

.selected-name{
  max-width:70%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:clamp(10px,3vw,15px);
  font-weight:1000;
}

/* =========================
すごろく
========================= */

.board-area{
  height:42%;
  margin:1% 2.5% 0;
  padding:1.5%;
  background:#fff;
  border-radius:13px;
  box-shadow:0 4px 14px rgba(0,0,0,.1);
  overflow:hidden;
}

.board-title{
  height:8%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:clamp(8px,2.2vw,12px);
  font-weight:1000;
}

.board{
  height:92%;
  display:grid;
  grid-template-columns:repeat(6,1fr);
  grid-template-rows:repeat(5,1fr);
  gap:4px;
  overflow:hidden;
}

/* =========================
マス
========================= */

.cell{
  position:relative;
  min-width:0;
  min-height:0;
  border:2px solid #d8d8d8;
  border-radius:8px;
  background:#fafafa;
  overflow:hidden;
}

.cell.goal{
  background:#fff0a0;
  border-color:#d3a800;
}

.cell-number{
  position:absolute;
  left:4px;
  top:3px;
  z-index:5;
  font-size:clamp(6px,1.8vw,10px);
  color:#777;
  font-weight:1000;
}

.goal-label{
  position:absolute;
  right:3px;
  top:3px;
  z-index:5;
  font-size:clamp(5px,1.6vw,9px);
  color:#806300;
  font-weight:1000;
}

.pieces{
  position:absolute;
  inset:20% 2px 2px;
  display:flex;
  flex-wrap:wrap;
  align-content:center;
  justify-content:center;
  gap:3px;
  overflow:hidden;
}

/* =========================
大型コマ
========================= */

.piece{
  min-width:48%;
  max-width:98%;
  padding:5px 6px;
  border:2px solid #fff;
  border-radius:20px;
  color:#fff;
  font-size:clamp(6px,2vw,10px);
  line-height:1.05;
  font-weight:1000;
  text-align:center;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  box-shadow:0 2px 5px rgba(0,0,0,.3);
}

.piece.selected-piece{
  outline:3px solid #111;
  transform:scale(1.06);
  z-index:50;
}

/* =========================
ギフト
========================= */

.gift-area{
  height:10%;
  margin:1% 2.5% 0;
  padding:1%;
  background:#fff;
  border-radius:11px;
  box-shadow:0 3px 10px rgba(0,0,0,.08);
  overflow:hidden;
}

.gift-title{
  height:25%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:clamp(6px,1.8vw,10px);
  font-weight:1000;
}

.gifts{
  height:75%;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5px;
}

.gift{
  border:0;
  border-radius:9px;
  background:#f0f0f0;
  font-size:clamp(6px,1.9vw,10px);
  line-height:1.1;
  font-weight:1000;
}

/* =========================
下ボタン
========================= */

.controls{
  height:6%;
  margin:1% 2.5% 0;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5px;
}

.control{
  border:0;
  border-radius:9px;
  color:#fff;
  font-size:clamp(6px,1.8vw,10px);
  font-weight:1000;
}

.project{background:#5e35b1;}
.gift-setting{background:#00897b;}
.reset{background:#222;}

/* =========================
モーダル
========================= */

.modal{
  position:absolute;
  inset:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.68);
  opacity:0;
  pointer-events:none;
  transition:.2s;
}

.modal.show{
  opacity:1;
  pointer-events:auto;
}

.modal-box{
  width:94%;
  max-height:92%;
  background:#fff;
  border-radius:17px;
  padding:13px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.modal-head{
  min-height:42px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.modal-title{
  font-size:clamp(14px,4vw,20px);
  font-weight:1000;
}

.close{
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  background:#eee;
  font-size:20px;
  font-weight:1000;
}

/* =========================
設定
========================= */

.scroll{
  flex:1;
  overflow:auto;
  padding-bottom:5px;
}

.setting-label{
  display:block;
  margin:10px 0 4px;
  font-size:11px;
  font-weight:1000;
}

.input{
  width:100%;
  height:39px;
  border:1px solid #ddd;
  border-radius:8px;
  padding:0 8px;
  font-size:12px;
  font-weight:800;
  outline:none;
}

.small-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
}

.help{
  margin-top:4px;
  color:#777;
  font-size:9px;
}

.piece-edit-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:5px;
}

.piece-edit{
  display:grid;
  grid-template-columns:26px 1fr;
  gap:4px;
}

.num{
  display:flex;
  align-items:center;
  justify-content:center;
  background:#eee;
  border-radius:6px;
  font-size:9px;
  font-weight:1000;
}

.piece-edit input{
  width:100%;
  height:34px;
  border:1px solid #ddd;
  border-radius:7px;
  padding:0 5px;
  font-size:10px;
  font-weight:800;
}

.modal-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  margin-top:8px;
}

.modal-button{
  height:42px;
  border:0;
  border-radius:9px;
  font-weight:1000;
}

.save{
  background:#222;
  color:#fff;
}

.cancel{
  background:#eee;
}

/* =========================
コマ選択
========================= */

.choose-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  padding:6px 1px;
}

.choose-btn{
  min-height:48px;
  border:1px solid #ddd;
  border-radius:10px;
  background:#f7f7f7;
  font-size:clamp(8px,2.5vw,13px);
  font-weight:1000;
}

.choose-btn.current{
  background:#222;
  color:#fff;
}

/* =========================
ギフト設定
========================= */

.gift-setting-row{
  margin-bottom:11px;
}

.gift-setting-title{
  margin-bottom:4px;
  font-size:10px;
  font-weight:1000;
}

.gift-input-row{
  display:grid;
  grid-template-columns:45px 1fr 70px;
  gap:5px;
}

/* =========================
ポップアップ
========================= */

.popup{
  position:absolute;
  inset:0;
  z-index:300;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.45);
  opacity:0;
  pointer-events:none;
}

.popup.show{
  opacity:1;
  pointer-events:auto;
}

.popup-box{
  width:78%;
  max-width:300px;
  background:#fff;
  border-radius:20px;
  padding:20px 15px;
  text-align:center;
}

.popup-icon{
  font-size:42px;
}

.popup-title{
  margin-top:4px;
  font-size:18px;
  font-weight:1000;
}

.popup-text{
  margin-top:6px;
  font-size:12px;
  line-height:1.5;
  color:#555;
  font-weight:800;
}

.popup-close{
  width:100%;
  height:42px;
  margin-top:13px;
  border:0;
  border-radius:10px;
  background:#222;
  color:#fff;
  font-weight:1000;
}

</style>
</head>

<body>

<div class="app">

  <!-- タイトル -->
  <div class="header">
    <h1 class="title" id="title">
      🗾 出身県はどこ？県民パワーでGOALを目指せ！
    </h1>

    <div class="subtitle" id="subtitle">
      指定ギフトでコマを進めよう！
    </div>
  </div>


  <!-- TOP3 -->
  <div class="rank">
    <div class="rank-title">🏆 現在のTOP3</div>
    <div class="rank-list" id="rankList"></div>
  </div>


  <!-- コマ選択 -->
  <div class="select-area">
    <button class="select-button" onclick="openChoose()">
      🎯 コマを選ぶ
    </button>
  </div>


  <!-- 選択中 -->
  <div class="selected">
    <span class="selected-label">現在選択中</span>
    <span class="selected-name" id="selectedName">
      まだ選択されていません
    </span>
  </div>


  <!-- すごろく -->
  <div class="board-area">

    <div class="board-title" id="boardTitle">
      🏁 30マス先がGOAL！
    </div>

    <div class="board" id="board"></div>

  </div>


  <!-- ギフト -->
  <div class="gift-area">

    <div class="gift-title">
      🎁 指定ギフトが来たらコマを進める！
    </div>

    <div class="gifts" id="giftButtons"></div>

  </div>


  <!-- 操作 -->
  <div class="controls">

    <button class="control project" onclick="openProjectSettings()">
      🎯 企画設定
    </button>

    <button class="control gift-setting" onclick="openGiftSettings()">
      🎁 ギフト設定
    </button>

    <button class="control reset" onclick="resetGame()">
      🔄 リセット
    </button>

  </div>


  <!-- 企画設定 -->
  <div class="modal" id="projectModal">

    <div class="modal-box">

      <div class="modal-head">
        <div class="modal-title">🎯 企画設定</div>

        <button class="close" onclick="closeProjectSettings()">×</button>
      </div>

      <div class="scroll">

        <label class="setting-label">企画タイトル</label>

        <input class="input" id="titleInput">


        <label class="setting-label">サブタイトル</label>

        <input class="input" id="subtitleInput">


        <label class="setting-label">コマ数 ／ GOAL</label>

        <div class="small-row">

          <input
            class="input"
            id="pieceCountInput"
            type="number"
            min="1"
            max="47"
            onchange="buildPieceInputs()"
          >

          <input
            class="input"
            id="goalInput"
            type="number"
            min="1"
            max="30"
          >

        </div>

        <div class="help">
          9:16画面で大型表示するため、GOALは1～30マスです。
        </div>


        <label class="setting-label">
          コマの名称
        </label>

        <div
          class="piece-edit-grid"
          id="pieceEditGrid">
        </div>

      </div>


      <div class="modal-buttons">

        <button
          class="modal-button save"
          onclick="saveProjectSettings()">
          保存
        </button>

        <button
          class="modal-button cancel"
          onclick="closeProjectSettings()">
          キャンセル
        </button>

      </div>

    </div>

  </div>


  <!-- コマ選択 -->
  <div class="modal" id="chooseModal">

    <div class="modal-box" style="height:88%;">

      <div class="modal-head">

        <div class="modal-title">🎯 コマを選ぶ</div>

        <button class="close" onclick="closeChoose()">×</button>

      </div>

      <div class="scroll">

        <div class="choose-grid" id="chooseGrid"></div>

      </div>

    </div>

  </div>


  <!-- ギフト設定 -->
  <div class="modal" id="giftModal">

    <div class="modal-box" style="height:88%;">

      <div class="modal-head">

        <div class="modal-title">🎁 ギフト設定</div>

        <button class="close" onclick="closeGiftSettings()">×</button>

      </div>

      <div class="scroll" id="giftSettingsRows"></div>

      <div class="modal-buttons">

        <button
          class="modal-button save"
          onclick="saveGiftSettings()">
          保存
        </button>

        <button
          class="modal-button cancel"
          onclick="closeGiftSettings()">
          キャンセル
        </button>

      </div>

    </div>

  </div>


  <!-- ポップアップ -->
  <div class="popup" id="popup">

    <div class="popup-box">

      <div class="popup-icon" id="popupIcon">🎁</div>

      <div class="popup-title" id="popupTitle">
        コマが進んだ！
      </div>

      <div class="popup-text" id="popupText"></div>

      <button
        class="popup-close"
        onclick="closePopup()">
        閉じる
      </button>

    </div>

  </div>

</div>


<script>

/* =========================
基本設定
========================= */

let projectTitle =
"🗾 出身県はどこ？県民パワーでGOALを目指せ！";

let projectSubtitle =
"指定ギフトでコマを進めよう！";

let GOAL=30;


/* =========================
47都道府県
========================= */

let pieces=[
"北海道",
"青森県","岩手県","宮城県","秋田県","山形県","福島県",
"茨城県","栃木県","群馬県","埼玉県","千葉県","東京都","神奈川県",
"新潟県","富山県","石川県","福井県","山梨県","長野県","岐阜県","静岡県","愛知県",
"三重県","滋賀県","京都府","大阪府","兵庫県","奈良県","和歌山県",
"鳥取県","島根県","岡山県","広島県","山口県",
"徳島県","香川県","愛媛県","高知県",
"福岡県","佐賀県","長崎県","熊本県","大分県","宮崎県","鹿児島県","沖縄県"
];


/* =========================
コマカラー
========================= */

const colors=[
"#e53935","#8e24aa","#3949ab","#1e88e5",
"#00897b","#43a047","#7cb342","#c0ca33",
"#f9a825","#ff8f00","#fb8c00","#f4511e",
"#d81b60","#ad1457","#6d4c41","#546e7a",
"#5e35b1","#00acc1","#00838f","#2e7d32",
"#558b2f","#827717","#ef6c00","#bf360c",
"#c62828","#6a1b9a","#283593","#1565c0",
"#00695c","#689f38","#9e9d24","#ff6f00",
"#e65100","#b71c1c","#880e4f","#4527a0",
"#311b92","#0277bd","#00838f","#00695c",
"#33691e","#827717","#ff8f00","#e65100",
"#4e342e","#3949ab","#00897b"
];


/* =========================
位置
========================= */

let positions={};

let selectedPiece=null;

function initializePositions(){

  const old={...positions};

  positions={};

  pieces.forEach(name=>{
    positions[name]=old[name] ?? 0;
  });
}


/* =========================
ギフト
========================= */

let gifts=[
  {icon:"❤️",name:"ハートミー",move:1},
  {icon:"🍩",name:"ドーナツ",move:3},
  {icon:"🎁",name:"指定ギフト",move:5},
  {icon:"⭐",name:"スペシャル",move:10},
  {icon:"🌟",name:"特大ギフト",move:20}
];


/* =========================
タイトル
========================= */

function updateTitle(){

  document.getElementById("title").textContent=projectTitle;

  document.getElementById("subtitle").textContent=projectSubtitle;

  document.getElementById("boardTitle").textContent=
    "🏁 "+GOAL+"マス先がGOAL！";
}


/* =========================
盤面
========================= */

function createBoard(){

  const board=document.getElementById("board");

  board.innerHTML="";

  board.style.gridTemplateColumns="repeat(6,1fr)";
  board.style.gridTemplateRows="repeat(5,1fr)";

  for(let i=1;i<=GOAL;i++){

    const cell=document.createElement("div");

    cell.className="cell";
    cell.id="cell-"+i;

    const number=document.createElement("div");

    number.className="cell-number";
    number.textContent=i;

    const area=document.createElement("div");

    area.className="pieces";
    area.id="pieces-"+i;

    cell.appendChild(number);
    cell.appendChild(area);

    if(i===GOAL){

      cell.classList.add("goal");

      const label=document.createElement("div");

      label.className="goal-label";
      label.textContent="🏁GOAL";

      cell.appendChild(label);
    }

    board.appendChild(cell);
  }
}


/* =========================
コマ表示
========================= */

function renderPieces(){

  document.querySelectorAll(".pieces").forEach(el=>{
    el.innerHTML="";
  });

  pieces.forEach((name,index)=>{

    const pos=positions[name] || 0;

    if(pos<=0) return;

    const area=document.getElementById("pieces-"+pos);

    if(!area) return;

    const piece=document.createElement("div");

    piece.className="piece";

    if(name===selectedPiece){
      piece.classList.add("selected-piece");
    }

    piece.textContent=name;

    piece.style.background=
      colors[index%colors.length];

    piece.onclick=(e)=>{
      e.stopPropagation();
      selectPiece(name);
    };

    area.appendChild(piece);
  });
}


/* =========================
TOP3
========================= */

function updateRanking(){

  const list=document.getElementById("rankList");

  list.innerHTML="";

  const sorted=pieces
    .map(name=>({
      name,
      pos:positions[name]||0
    }))
    .sort((a,b)=>b.pos-a.pos);

  const top3=sorted.slice(0,3);

  const medals=["🥇","🥈","🥉"];

  top3.forEach((item,index)=>{

    const div=document.createElement("div");

    div.className="rank-item";

    div.innerHTML=`
      <div class="rank-medal">${medals[index]}</div>
      <div class="rank-name">${item.name}</div>
    `;

    list.appendChild(div);
  });
}


/* =========================
コマ選択
========================= */

function selectPiece(name){

  selectedPiece=name;

  document.getElementById("selectedName").textContent=name;

  renderPieces();

}


function openChoose(){

  createChoose();

  document
    .getElementById("chooseModal")
    .classList.add("show");
}


function closeChoose(){

  document
    .getElementById("chooseModal")
    .classList.remove("show");
}


function createChoose(){

  const grid=document.getElementById("chooseGrid");

  grid.innerHTML="";

  pieces.forEach(name=>{

    const btn=document.createElement("button");

    btn.className="choose-btn";

    if(name===selectedPiece){
      btn.classList.add("current");
    }

    btn.textContent=name;

    btn.onclick=()=>{
      selectPiece(name);
      closeChoose();
    };

    grid.appendChild(btn);
  });
}


/* =========================
ギフト
========================= */

function createGiftButtons(){

  const area=document.getElementById("giftButtons");

  area.innerHTML="";

  gifts.slice(0,3).forEach(gift=>{

    const button=document.createElement("button");

    button.className="gift";

    button.innerHTML=
      gift.icon+" "+gift.name+
      "<br>＋"+gift.move+"マス";

    button.onclick=()=>{
      moveSelected(gift.move,gift.icon);
    };

    area.appendChild(button);
  });
}


/* =========================
移動
========================= */

function moveSelected(move,icon){

  if(!selectedPiece){

    showPopup(
      "⚠️",
      "コマを選んでね！",
      "先に「🎯 コマを選ぶ」からコマを選択してください。"
    );

    return;
  }

  const old=positions[selectedPiece]||0;

  if(old>=GOAL){

    showPopup(
      "🏁",
      "すでにGOAL！",
      selectedPiece+"はゴールしています。"
    );

    return;
  }

  const next=Math.min(GOAL,old+move);

  positions[selectedPiece]=next;

  updateAll();

  if(next>=GOAL){

    showPopup(
      "🏆",
      "GOAL！",
      selectedPiece+"がゴールしました！"
    );

  }else{

    showPopup(
      icon,
      "コマが進んだ！",
      selectedPiece+
      "が"+
      (next-old)+
      "マス進みました！"
    );
  }
}


/* =========================
企画設定
========================= */

function openProjectSettings(){

  document.getElementById("titleInput").value=projectTitle;

  document.getElementById("subtitleInput").value=projectSubtitle;

  document.getElementById("pieceCountInput").value=pieces.length;

  document.getElementById("goalInput").value=GOAL;

  buildPieceInputs();

  document
    .getElementById("projectModal")
    .classList.add("show");
}


function closeProjectSettings(){

  document
    .getElementById("projectModal")
    .classList.remove("show");
}


function buildPieceInputs(){

  const count=Math.max(
    1,
    Math.min(
      47,
      Number(
        document.getElementById("pieceCountInput").value
      )||1
    )
  );

  const grid=document.getElementById("pieceEditGrid");

  grid.innerHTML="";

  for(let i=0;i<count;i++){

    const wrapper=document.createElement("div");

    wrapper.className="piece-edit";

    wrapper.innerHTML=`
      <div class="num">${i+1}</div>
      <input
        id="pieceInput-${i}"
        value="${pieces[i]||"コマ"+(i+1)}"
        maxlength="20">
    `;

    grid.appendChild(wrapper);
  }
}


/* =========================
設定保存
========================= */

function saveProjectSettings(){

  const title=
    document.getElementById("titleInput").value.trim();

  const subtitle=
    document.getElementById("subtitleInput").value.trim();

  const count=Math.max(
    1,
    Math.min(
      47,
      Number(
        document.getElementById("pieceCountInput").value
      )||1
    )
  );

  const goal=Math.max(
    1,
    Math.min(
      30,
      Number(
        document.getElementById("goalInput").value
      )||30
    )
  );

  const newPieces=[];

  for(let i=0;i<count;i++){

    const input=document.getElementById("pieceInput-"+i);

    let name=input ? input.value.trim() : "";

    if(!name){
      name="コマ"+(i+1);
    }

    if(newPieces.includes(name)){
      name=name+" "+(i+1);
    }

    newPieces.push(name);
  }

  const oldPositions={...positions};

  projectTitle=title||"すごろく企画";

  projectSubtitle=
    subtitle||
    "指定ギフトでコマを進めよう！";

  GOAL=goal;

  pieces=newPieces;

  positions={};

  pieces.forEach(name=>{

    positions[name]=Math.min(
      oldPositions[name]??0,
      GOAL
    );
  });

  if(!selectedPiece||!pieces.includes(selectedPiece)){

    selectedPiece=null;

    document.getElementById("selectedName").textContent=
      "まだ選択されていません";
  }

  closeProjectSettings();

  updateAll();

  showPopup(
    "🎯",
    "設定を保存しました！",
    "企画内容を変更しました。"
  );
}


/* =========================
ギフト設定
========================= */

function openGiftSettings(){

  const area=document.getElementById("giftSettingsRows");

  area.innerHTML="";

  gifts.forEach((gift,index)=>{

    const row=document.createElement("div");

    row.className="gift-setting-row";

    row.innerHTML=`

      <div class="gift-setting-title">
        🎁 ギフト${index+1}
      </div>

      <div class="gift-input-row">

        <input
          class="input"
          id="giftIcon-${index}"
          value="${gift.icon}"
          maxlength="3">

        <input
          class="input"
          id="giftName-${index}"
          value="${gift.name}"
          maxlength="12">

        <input
          class="input"
          id="giftMove-${index}"
          type="number"
          min="0"
          max="100"
          value="${gift.move}">

      </div>
    `;

    area.appendChild(row);
  });

  document
    .getElementById("giftModal")
    .classList.add("show");
}


function closeGiftSettings(){

  document
    .getElementById("giftModal")
    .classList.remove("show");
}


function saveGiftSettings(){

  gifts.forEach((gift,index)=>{

    const icon=
      document.getElementById("giftIcon-"+index).value.trim();

    const name=
      document.getElementById("giftName-"+index).value.trim();

    const move=
      Number(
        document.getElementById("giftMove-"+index).value
      );

    gift.icon=icon||"🎁";

    gift.name=name||"ギフト";

    gift.move=Math.max(
      0,
      Math.min(
        100,
        isNaN(move)?0:move
      )
    );
  });

  closeGiftSettings();

  createGiftButtons();

  showPopup(
    "🎁",
    "ギフト設定完了！",
    "ギフト名と進むマス数を変更しました。"
  );
}


/* =========================
リセット
========================= */

function resetGame(){

  if(!confirm("全コマをSTARTに戻しますか？")){
    return;
  }

  pieces.forEach(name=>{
    positions[name]=0;
  });

  updateAll();

  showPopup(
    "🔄",
    "リセット完了",
    "全コマがSTARTに戻りました。"
  );
}


/* =========================
POPUP
========================= */

function showPopup(icon,title,text){

  document.getElementById("popupIcon").textContent=icon;

  document.getElementById("popupTitle").textContent=title;

  document.getElementById("popupText").textContent=text;

  document
    .getElementById("popup")
    .classList.add("show");
}


function closePopup(){

  document
    .getElementById("popup")
    .classList.remove("show");
}


/* =========================
全更新
========================= */

function updateAll(){

  updateTitle();

  createBoard();

  renderPieces();

  updateRanking();

  createGiftButtons();
}


/* =========================
起動
========================= */

initializePositions();

updateAll();

</script>
