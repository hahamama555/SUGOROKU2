<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>都道府県すごろく</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
  background:#f3f4f6;
}

body{
  display:flex;
  justify-content:center;
}

.app{
  width:100%;
  max-width:520px;
  height:100dvh;
  background:#f8f8fb;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  position:relative;
}

/* =========================
   ヘッダー
========================= */

.header{
  flex:0 0 auto;
  height:8.5dvh;
  min-height:58px;
  background:linear-gradient(135deg,#6d28d9,#9333ea);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  box-shadow:0 2px 8px rgba(0,0,0,.18);
}

.title{
  font-size:clamp(18px,5vw,25px);
  font-weight:900;
  letter-spacing:.5px;
}

.headerSub{
  position:absolute;
  bottom:5px;
  font-size:9px;
  opacity:.9;
  font-weight:700;
}

/* =========================
   選択中コマ
========================= */

.selectedBox{
  flex:0 0 auto;
  height:7dvh;
  min-height:48px;
  margin:7px 10px 5px;
  border-radius:12px;
  background:#fff;
  border:2px solid #ddd6fe;
  box-shadow:0 2px 7px rgba(0,0,0,.08);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}

.selectedLabel{
  font-size:11px;
  font-weight:800;
  color:#777;
}

.selectedLine{
  display:flex;
  align-items:center;
  gap:7px;
}

.selectedColorDot{
  width:17px;
  height:17px;
  border-radius:50%;
  display:none;
  border:2px solid #fff;
  box-shadow:0 1px 4px rgba(0,0,0,.3);
}

.selectedName{
  font-size:16px;
  font-weight:900;
  color:#4c1d95;
}

/* =========================
   盤面
========================= */

.boardWrap{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  padding:4px 8px 8px;
}

.board{
  width:100%;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:5px;
}

.cell{
  min-height:63px;
  aspect-ratio:1/1;
  border-radius:9px;
  background:#fff;
  border:2px solid #ddd;
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  overflow:hidden;
  box-shadow:0 1px 3px rgba(0,0,0,.08);
}

.cell.start{
  background:#ede9fe;
  border-color:#8b5cf6;
}

.cell.goal{
  background:#fef3c7;
  border-color:#f59e0b;
}

.cellNumber{
  position:absolute;
  top:3px;
  left:4px;
  font-size:9px;
  font-weight:900;
  color:#777;
}

.cellName{
  width:100%;
  font-size:clamp(9px,2.7vw,13px);
  font-weight:900;
  text-align:center;
  line-height:1.05;
  padding:12px 2px 1px;
}

/* =========================
   仕掛け表示
========================= */

.trickDisplay{
  width:94%;
  margin:1px auto 2px;
  padding:3px 2px;
  border-radius:5px;
  background:#fef3c7;
  border:1px solid #f59e0b;
  color:#92400e;
  font-size:clamp(7px,2vw,10px);
  line-height:1.05;
  font-weight:900;
  text-align:center;
  white-space:normal;
  overflow:hidden;
}

.trickDisplay.forward{
  background:#dcfce7;
  border-color:#22c55e;
  color:#166534;
}

.trickDisplay.back{
  background:#fee2e2;
  border-color:#ef4444;
  color:#991b1b;
}

.trickDisplay.previous{
  background:#dbeafe;
  border-color:#3b82f6;
  color:#1e40af;
}

.trickDisplay.twoBack{
  background:#e0e7ff;
  border-color:#6366f1;
  color:#3730a3;
}

.trickDisplay.gift{
  background:#fce7f3;
  border-color:#ec4899;
  color:#9d174d;
}

/* =========================
   コマ
========================= */

.piecesInCell{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  align-items:center;
  gap:2px;
  width:100%;
  padding:1px 2px 3px;
}

.miniPiece{
  min-width:18px;
  height:18px;
  padding:0 4px;
  border-radius:9px;
  color:#fff;
  font-size:7px;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 1px 3px rgba(0,0,0,.25);
  white-space:nowrap;
}

/* =========================
   下部操作
========================= */

.controls{
  flex:0 0 auto;
  background:#fff;
  border-top:1px solid #ddd;
  padding:6px 7px calc(6px + env(safe-area-inset-bottom));
  box-shadow:0 -2px 8px rgba(0,0,0,.08);
}

.giftButtons{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:4px;
  margin-bottom:5px;
}

.giftBtn{
  border:none;
  border-radius:8px;
  background:#f3f4f6;
  min-height:40px;
  font-size:10px;
  font-weight:900;
  padding:3px 1px;
}

.giftBtn:active{
  transform:scale(.94);
}

.giftBtn:nth-child(1){
  background:#fee2e2;
}

.giftBtn:nth-child(2){
  background:#fef3c7;
}

.giftBtn:nth-child(3){
  background:#dcfce7;
}

.giftBtn:nth-child(4){
  background:#dbeafe;
}

.giftBtn:nth-child(5){
  background:#ede9fe;
}

.bottomButtons{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:4px;
}

.bottomBtn{
  border:none;
  border-radius:8px;
  background:#eee;
  min-height:35px;
  font-size:9px;
  font-weight:900;
}

.bottomBtn:active{
  transform:scale(.95);
}

/* =========================
   モーダル
========================= */

.modalOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:1000;
  display:none;
  align-items:flex-end;
  justify-content:center;
}

.modalOverlay.show{
  display:flex;
}

.modal{
  width:100%;
  max-width:520px;
  max-height:88dvh;
  background:#fff;
  border-radius:18px 18px 0 0;
  padding:14px 12px calc(14px + env(safe-area-inset-bottom));
  overflow-y:auto;
  box-shadow:0 -5px 25px rgba(0,0,0,.25);
}

.modalHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
}

.modalTitle{
  font-size:17px;
  font-weight:900;
}

.closeBtn{
  width:32px;
  height:32px;
  border:none;
  border-radius:50%;
  background:#eee;
  font-size:18px;
  font-weight:900;
}

.sectionTitle{
  font-size:13px;
  font-weight:900;
  color:#4c1d95;
  margin:8px 0 6px;
}

.currentSelection{
  background:#f5f3ff;
  border:1px solid #ddd6fe;
  border-radius:9px;
  padding:8px;
  text-align:center;
  font-size:12px;
  font-weight:900;
  margin-bottom:7px;
}

.pieceSelectList{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:5px;
  max-height:30dvh;
  overflow-y:auto;
  padding:2px;
}

.pieceSelectButton{
  min-width:0;
  display:flex;
  align-items:center;
  gap:6px;
  border:2px solid #ddd;
  background:#fff;
  border-radius:8px;
  padding:7px 6px;
  font-size:10px;
  font-weight:900;
  text-align:left;
}

.pieceSelectButton.selected{
  border-color:#7c3aed;
  background:#f3e8ff;
  box-shadow:0 0 0 1px #a78bfa inset;
}

.pieceSelectDot{
  flex:0 0 15px;
  width:15px;
  height:15px;
  border-radius:50%;
  box-shadow:0 1px 3px rgba(0,0,0,.25);
}

.divider{
  height:1px;
  background:#ddd;
  margin:12px 0;
}

.countRow{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:8px;
}

.countRow label{
  font-size:11px;
  font-weight:900;
}

.countInput{
  width:80px;
  height:34px;
  border:2px solid #ddd;
  border-radius:7px;
  text-align:center;
  font-size:14px;
  font-weight:900;
}

.pieceSetting{
  display:grid;
  grid-template-columns:28px 1fr 45px;
  gap:5px;
  align-items:center;
  margin-bottom:5px;
}

.pieceIndex{
  font-size:10px;
  font-weight:900;
  text-align:center;
}

.nameInput{
  width:100%;
  height:31px;
  border:1px solid #ccc;
  border-radius:6px;
  padding:0 6px;
  font-size:11px;
  font-weight:800;
}

.colorInput{
  width:45px;
  height:31px;
  border:1px solid #ccc;
  border-radius:6px;
  padding:2px;
  background:#fff;
}

.modalAction{
  width:100%;
  height:42px;
  margin-top:8px;
  border:none;
  border-radius:9px;
  background:#7c3aed;
  color:#fff;
  font-size:13px;
  font-weight:900;
}

/* =========================
   ギフト設定
========================= */

.giftSettingRow{
  display:grid;
  grid-template-columns:70px 1fr 70px;
  gap:5px;
  align-items:center;
  margin-bottom:6px;
}

.giftSettingRow input{
  height:33px;
  border:1px solid #ccc;
  border-radius:6px;
  font-size:11px;
  font-weight:800;
  padding:0 6px;
}

.giftSettingRow label{
  font-size:10px;
  font-weight:900;
}

.giftSave{
  width:100%;
  height:42px;
  border:none;
  border-radius:9px;
  background:#db2777;
  color:#fff;
  font-weight:900;
}

/* =========================
   仕掛け設定
========================= */

.trickSettingRow{
  display:grid;
  grid-template-columns:60px 1fr 70px;
  gap:5px;
  align-items:center;
  margin-bottom:6px;
}

.trickSettingRow input,
.trickSettingRow select{
  height:33px;
  border:1px solid #ccc;
  border-radius:6px;
  font-size:10px;
  font-weight:800;
}

.trickSave{
  width:100%;
  height:42px;
  border:none;
  border-radius:9px;
  background:#2563eb;
  color:#fff;
  font-weight:900;
}

/* =========================
   ポップアップ
========================= */

.popup{
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%) scale(.7);
  width:min(88vw,400px);
  background:#fff;
  border-radius:18px;
  box-shadow:0 12px 40px rgba(0,0,0,.35);
  z-index:2500;
  padding:22px 18px;
  text-align:center;
  opacity:0;
  pointer-events:none;
  transition:.25s;
}

.popup.show{
  opacity:1;
  transform:translate(-50%,-50%) scale(1);
}

.popupIcon{
  font-size:42px;
  margin-bottom:8px;
}

.popupTitle{
  font-size:20px;
  font-weight:900;
  margin-bottom:6px;
}

.popupText{
  font-size:13px;
  font-weight:700;
  line-height:1.5;
}

/* =========================
   🎲 サイコロ
========================= */

.diceOverlay{
  position:fixed;
  inset:0;
  background:rgba(20,10,35,.82);
  z-index:2000;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
}

.diceOverlay.show{
  display:flex;
}

.diceCaption{
  color:#fff;
  font-size:18px;
  font-weight:900;
  margin-bottom:20px;
  text-shadow:0 2px 8px rgba(0,0,0,.5);
}

.bigDice{
  width:190px;
  height:190px;
  border-radius:34px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  box-shadow:
    0 15px 40px rgba(0,0,0,.4),
    0 0 0 5px rgba(255,255,255,.15);
  transform-style:preserve-3d;
}

.bigDice.rolling{
  animation:
    diceSpin .18s linear infinite,
    diceBounce .36s ease-in-out infinite alternate;
}

.diceEmoji{
  font-size:115px;
  line-height:1;
  display:block;
  filter:drop-shadow(0 5px 5px rgba(0,0,0,.2));
}

.bigDice.rolling .diceEmoji{
  animation:diceEmojiSpin .18s linear infinite;
}

.diceNumber{
  position:absolute;
  right:-12px;
  bottom:-12px;
  min-width:65px;
  height:65px;
  padding:0 10px;
  border-radius:50%;
  background:#7c3aed;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:31px;
  font-weight:1000;
  border:5px solid #fff;
  box-shadow:0 5px 15px rgba(0,0,0,.3);
}

.diceResult{
  margin-top:27px;
  color:#fff;
  font-size:32px;
  font-weight:1000;
  opacity:0;
  transform:scale(.4);
}

.diceResult.show{
  animation:resultPop .45s ease-out forwards;
}

@keyframes diceSpin{
  0%{
    transform:rotateX(0deg) rotateY(0deg) rotateZ(0deg);
  }
  25%{
    transform:rotateX(18deg) rotateY(35deg) rotateZ(-10deg);
  }
  50%{
    transform:rotateX(-25deg) rotateY(90deg) rotateZ(12deg);
  }
  75%{
    transform:rotateX(30deg) rotateY(145deg) rotateZ(-15deg);
  }
  100%{
    transform:rotateX(0deg) rotateY(180deg) rotateZ(0deg);
  }
}

@keyframes diceBounce{
  from{
    margin-top:-12px;
  }
  to{
    margin-top:12px;
  }
}

@keyframes diceEmojiSpin{
  0%{
    transform:rotate(-15deg) scale(.92);
  }
  50%{
    transform:rotate(180deg) scale(1.05);
  }
  100%{
    transform:rotate(375deg) scale(.92);
  }
}

@keyframes resultPop{
  0%{
    opacity:0;
    transform:scale(.4);
  }
  60%{
    opacity:1;
    transform:scale(1.18);
  }
  100%{
    opacity:1;
    transform:scale(1);
  }
}

@media(max-height:700px){

  .header{
    height:7.5dvh;
  }

  .selectedBox{
    height:6.5dvh;
  }

  .cell{
    min-height:53px;
  }

  .giftBtn{
    min-height:34px;
    font-size:9px;
  }

  .bottomBtn{
    min-height:31px;
  }

  .boardWrap{
    padding-top:2px;
  }

}
</style>
</head>

<body>

<div class="app">

  <!-- ヘッダー -->
  <div class="header">
    <div class="title">🗾 都道府県すごろく</div>
    <div class="headerSub">ギフトでコマを進めよう！</div>
  </div>


  <!-- 選択中コマ -->
  <div class="selectedBox">

    <div class="selectedLabel">
      現在のコマ
    </div>

    <div class="selectedLine">

      <span
        id="selectedColorDot"
        class="selectedColorDot">
      </span>

      <div
        class="selectedName"
        id="selectedName">
        未選択
      </div>

    </div>

  </div>


  <!-- 盤面 -->
  <div class="boardWrap">

    <div
      class="board"
      id="board">
    </div>

  </div>


  <!-- 操作 -->
  <div class="controls">

    <div
      class="giftButtons"
      id="giftButtons">
    </div>


    <div class="bottomButtons">

      <button
        class="bottomBtn"
        onclick="openPieceModal()">
        🏃 コマを選ぶ
      </button>

      <button
        class="bottomBtn"
        onclick="openGiftModal()">
        🎁 ギフト設定
      </button>

      <button
        class="bottomBtn"
        onclick="openTrickModal()">
        ⭐ 仕掛け設定
      </button>

      <button
        class="bottomBtn"
        onclick="resetGame()">
        🔄 リセット
      </button>

    </div>

  </div>

</div>


<!-- =====================================================
     コマ選択・設定
===================================================== -->

<div
  class="modalOverlay"
  id="pieceModal">

  <div class="modal">

    <div class="modalHeader">

      <div class="modalTitle">
        🏃 コマを選択・設定
      </div>

      <button
        class="closeBtn"
        onclick="closeModal('pieceModal')">
        ×
      </button>

    </div>


    <div class="sectionTitle">
      🏃 コマを選択
    </div>


    <div
      class="currentSelection"
      id="currentSelection">
      現在：未選択
    </div>


    <div
      class="pieceSelectList"
      id="pieceSelectList">
    </div>


    <div class="divider"></div>


    <div class="sectionTitle">
      📝 コマの数・名前・色
    </div>


    <div class="countRow">

      <label>
        コマの数
      </label>

      <input
        class="countInput"
        id="pieceCount"
        type="number"
        min="1"
        max="50"
        value="47"
        onchange="renderPieceSettings()">

      <span
        style="font-size:10px;font-weight:800;">
        最大50コマ
      </span>

    </div>


    <div id="pieceSettings"></div>


    <button
      class="modalAction"
      onclick="savePieceSettings()">
      💾 コマ設定を保存
    </button>

  </div>

</div>


<!-- =====================================================
     ギフト設定
===================================================== -->

<div
  class="modalOverlay"
  id="giftModal">

  <div class="modal">

    <div class="modalHeader">

      <div class="modalTitle">
        🎁 ギフト設定
      </div>

      <button
        class="closeBtn"
        onclick="closeModal('giftModal')">
        ×
      </button>

    </div>


    <div id="giftSettings"></div>


    <button
      class="giftSave"
      onclick="saveGiftSettings()">
      💾 ギフト設定を保存
    </button>

  </div>

</div>


<!-- =====================================================
     仕掛け設定
===================================================== -->

<div
  class="modalOverlay"
  id="trickModal">

  <div class="modal">

    <div class="modalHeader">

      <div class="modalTitle">
        ⭐ 仕掛け設定
      </div>

      <button
        class="closeBtn"
        onclick="closeModal('trickModal')">
        ×
      </button>

    </div>


    <div id="trickSettings"></div>


    <button
      class="trickSave"
      onclick="saveTrickSettings()">
      💾 仕掛け設定を保存
    </button>

  </div>

</div>


<!-- =====================================================
     🎲 サイコロ
===================================================== -->

<div
  class="diceOverlay"
  id="diceOverlay">

  <div
    class="diceCaption"
    id="diceCaption">
    🎲 サイコロを振っています！
  </div>


  <div
    class="bigDice"
    id="bigDice">

    <span
      class="diceEmoji"
      id="diceEmoji">
      🎲
    </span>


    <div
      class="diceNumber"
      id="diceNumber">
      1
    </div>

  </div>


  <div
    class="diceResult"
    id="diceResult">
  </div>

</div>


<!-- =====================================================
     ポップアップ
===================================================== -->

<div
  class="popup"
  id="popup">

  <div
    class="popupIcon"
    id="popupIcon">
    🎉
  </div>

  <div
    class="popupTitle"
    id="popupTitle">
    完了！
  </div>

  <div
    class="popupText"
    id="popupText">
  </div>

</div>


<script>

/* =====================================================
   基本設定
===================================================== */

const GOAL = 50;


/* =====================================================
   都道府県コマ
===================================================== */

let pieces = [

  {name:"北海道",color:"#ef4444"},
  {name:"青森県",color:"#f97316"},
  {name:"岩手県",color:"#f59e0b"},
  {name:"宮城県",color:"#eab308"},
  {name:"秋田県",color:"#84cc16"},
  {name:"山形県",color:"#22c55e"},
  {name:"福島県",color:"#10b981"},
  {name:"茨城県",color:"#14b8a6"},
  {name:"栃木県",color:"#06b6d4"},
  {name:"群馬県",color:"#0ea5e9"},
  {name:"埼玉県",color:"#3b82f6"},
  {name:"千葉県",color:"#6366f1"},
  {name:"東京都",color:"#8b5cf6"},
  {name:"神奈川県",color:"#a855f7"},
  {name:"新潟県",color:"#d946ef"},
  {name:"富山県",color:"#ec4899"},
  {name:"石川県",color:"#f43f5e"},
  {name:"福井県",color:"#ef4444"},
  {name:"山梨県",color:"#f97316"},
  {name:"長野県",color:"#f59e0b"},
  {name:"岐阜県",color:"#eab308"},
  {name:"静岡県",color:"#84cc16"},

/* =====================================================
   選択中表示
===================================================== */

function updateSelected(){

  const nameEl =
    document.getElementById("selectedName");

  const dot =
    document.getElementById("selectedColorDot");

  const current =
    document.getElementById("currentSelection");


  if(!selectedPiece){

    nameEl.textContent =
      "未選択";

    dot.style.display =
      "none";

    current.textContent =
      "現在：未選択";

    return;

  }


  const piece =
    pieces.find(
      p=>p.name===selectedPiece
    );


  if(!piece){

    selectedPiece = null;

    updateSelected();

    return;

  }


  nameEl.textContent =
    piece.name;

  dot.style.display =
    "block";

  dot.style.backgroundColor =
    piece.color;

  current.textContent =
    "現在：" +
    piece.name +
    " を選択中";

}

function getTrickDisplayText(trick){

  if(!trick){

    return "";

  }


  switch(trick.type){

    case "forward":

      return "➡️ " +
        trick.value +
        "マス進む";

    case "back":

      return "⬅️ " +
        trick.value +
        "マス戻る";

    case "previous":

      return "↩️ 1コマ戻る";

    case "twoBack":

      return "⬅️ 2コマ戻る";

    case "gift":

      return "🎁 お楽しみ袋";

    default:

      return "⭐ 仕掛け";

  }

}


/* =====================================================
   仕掛けクラス
===================================================== */

function getTrickClass(type){

  switch(type){

    case "forward":
      return "forward";

    case "back":
      return "back";

    case "previous":
      return "previous";

    case "twoBack":
      return "twoBack";

    case "gift":
      return "gift";

    default:
      return "";

  }

}


/* =====================================================
   盤面
===================================================== */

function renderBoard(){

  const board =
    document.getElementById(
      "board"
    );

  board.innerHTML = "";


  for(let i=1;i<=GOAL;i++){

    const cell =
      document.createElement("div");

    cell.className =
      "cell";


    if(i===1){

      cell.classList.add(
        "start"
      );

    }


    if(i===GOAL){

      cell.classList.add(
        "goal"
      );

    }


    /* マス番号 */

    const number =
      document.createElement("div");

    number.className =
      "cellNumber";

    number.textContent =
      i;


    cell.appendChild(number);


    /* マス名 */

    const name =
      document.createElement("div");

    name.className =
      "cellName";


    if(i===1){

      name.textContent =
        "START";

    }
    else if(i===GOAL){

      name.textContent =
        "GOAL";

    }
    else{

      name.textContent =
        "マス " + i;

    }


    cell.appendChild(name);


    /* =================================================
       ⭐ 仕掛けをマスに表示
    ================================================= */

    if(tricks[i]){

      const trick =
        document.createElement("div");

      trick.className =
        "trickDisplay " +
        getTrickClass(
          tricks[i].type
        );

      trick.textContent =
        getTrickDisplayText(
          tricks[i]
        );


      cell.appendChild(trick);

    }


    /* =================================================
       コマ
    ================================================= */

    const pieceArea =
      document.createElement("div");

    pieceArea.className =
      "piecesInCell";


    pieces.forEach(piece=>{

      /*
        位置0はSTART前なので
        画面には表示しない
      */

      if(
        positions[piece.name]===i
      ){

        const mini =
          document.createElement("div");

        mini.className =
          "miniPiece";

        mini.style.backgroundColor =
          piece.color;


        let text =
          piece.name
            .replace("県","")
            .replace("府","");


        if(piece.name==="北海道"){

          text =
            "北海道";

        }


        if(piece.name==="東京都"){

          text =
            "東京";

        }


        mini.textContent =
          text;


        pieceArea.appendChild(
          mini
        );

      }

    });


    cell.appendChild(
      pieceArea
    );


    board.appendChild(
      cell
    );

  }

}

/* =====================================================
   🎲 サイコロ
===================================================== */

function rollDiceForGift(move){

  const overlay =
    document.getElementById(
      "diceOverlay"
    );

  const dice =
    document.getElementById(
      "bigDice"
    );

  const number =
    document.getElementById(
      "diceNumber"
    );

  const emoji =
    document.getElementById(
      "diceEmoji"
    );

  const result =
    document.getElementById(
      "diceResult"
    );

  const caption =
    document.getElementById(
      "diceCaption"
    );


  overlay.classList.add(
    "show"
  );


  dice.classList.add(
    "rolling"
  );


  result.classList.remove(
    "show"
  );


  caption.textContent =
    "🎲 サイコロを振っています！";


  let finalNumber =
    Math.floor(
      Math.random()*6
    )+1;


  /*
    ギフトの指定マスが1〜6なら
    その数字を最終結果にする
  */

  if(
    move>=1 &&
    move<=6
  ){

    finalNumber =
      move;

  }


  let count = 0;

  const maxCount = 22;


  const timer =
    setInterval(()=>{

      const random =
        Math.floor(
          Math.random()*6
        )+1;


      number.textContent =
        random;


      count++;


      if(
        count>=maxCount
      ){

        clearInterval(
          timer
        );


        dice.classList.remove(
          "rolling"
        );


        number.textContent =
          finalNumber;


        emoji.textContent =
          "🎲";


        caption.textContent =
          "🎉 出ました！";


        result.textContent =
          finalNumber +
          "マス！";


        result.classList.add(
          "show"
        );


        setTimeout(()=>{

          overlay.classList.remove(
            "show"
          );


          result.classList.remove(
            "show"
          );


          moveSelected(
            finalNumber
          );


        },900);

      }

    },70);

}


/* =====================================================
   コマを進める
===================================================== */

function moveSelected(move){

  if(!selectedPiece){

    return;

  }


  const current =
    positions[selectedPiece] || 0;


  let next =
    current + move;


  /*
    最初の移動は
    0 → 1
  */

  if(next<1){

    next = 1;

  }


  if(next>GOAL){

    next = GOAL;

  }


  positions[selectedPiece] =
    next;


  renderBoard();


  const piece =
    pieces.find(
      p=>p.name===selectedPiece
    );


  if(next===GOAL){

    showPopup(
      "🏆",
      "GOAL！",
      piece.name +
      " がゴールしました！"
    );

    return;

  }


  /*
    仕掛けチェック
  */

  if(tricks[next]){

    setTimeout(()=>{

      triggerTrick(next);

    },500);

    return;

  }


  showPopup(
    "🎲",
    "コマが進みました！",
    piece.name +
    " → " +
    next +
    "マス目"
  );

}


/* =====================================================
   仕掛け発動
===================================================== */

function triggerTrick(position){

  const trick =
    tricks[position];


  if(!trick){

    return;

  }


  const pieceName =
    selectedPiece;


  if(!pieceName){

    return;

  }


  switch(trick.type){

    case "forward":

      positions[pieceName] =
        Math.min(
          GOAL,
          positions[pieceName] +
          trick.value
        );


      renderBoard();


      showPopup(
        "➡️",
        "仕掛け発動！",
        trick.value +
        "マス進みます！"
      );

      break;


    case "back":

      positions[pieceName] =
        Math.max(
          1,
          positions[pieceName] -
          trick.value
        );


      renderBoard();


      showPopup(
        "⬅️",
        "仕掛け発動！",
        trick.value +
        "マス戻ります！"
      );

      break;


    case "previous":

      const index =
        pieces.findIndex(
          p=>p.name===pieceName
        );


      if(index>0){

        const previous =
          pieces[index-1].name;


        positions[pieceName] =
          Math.max(
            1,
            positions[previous] || 1
          );

      }


      renderBoard();


      showPopup(
        "↩️",
        "前のコマへ！",
        "一つ前のコマの位置へ戻ります！"
      );

      break;


    case "twoBack":

      positions[pieceName] =
        Math.max(
          1,
          positions[pieceName]-2
        );


      renderBoard();


      showPopup(
        "⬅️",
        "2コマ戻る！",
        "2コマ戻ります！"
      );

      break;


    case "gift":

      showPopup(
        "🎁",
        "お楽しみ袋！",
        "お楽しみ袋を出します！"
      );

      break;


    default:

      showPopup(
        "⭐",
        "仕掛け発動！",
        "仕掛けが発動しました！"
      );

  }

}

/* =====================================================
   コマ設定保存
===================================================== */

function savePieceSettings(){

  const oldPieces =
    pieces.slice();

  const oldPositions =
    {...positions};


  const oldSelectedIndex =
    pieces.findIndex(
      p=>p.name===selectedPiece
    );


  const rows =
    document.querySelectorAll(
      "#pieceSettings .pieceSetting"
    );


  const newPieces = [];


  rows.forEach(
    (row,index)=>{

      const nameInput =
        row.querySelector(
          ".nameInput"
        );

      const colorInput =
        row.querySelector(
          ".colorInput"
        );


      let name =
        nameInput.value.trim();


      if(!name){

        name =
          "コマ"+(index+1);

      }


      let baseName =
        name;

      let suffix =
        2;


      while(
        newPieces.some(
          p=>p.name===name
        )
      ){

        name =
          baseName +
          suffix;

        suffix++;

      }


      newPieces.push({

        name:name,

        color:
          colorInput.value ||
          getDefaultColor(index)

      });

    }
  );


  pieces =
    newPieces;


  positions = {};


  newPieces.forEach(
    (piece,index)=>{

      const old =
        oldPieces[index];


      if(old){

        positions[piece.name] =
          oldPositions[old.name] ||
          0;

      }
      else{

        positions[piece.name] =
          0;

      }

    }
  );


  /*
    選択中コマを維持
  */

  if(
    oldSelectedIndex>=0 &&
    newPieces[oldSelectedIndex]
  ){

    selectedPiece =
      newPieces[
        oldSelectedIndex
      ].name;

  }
  else{

    selectedPiece =
      null;

  }


  updateSelected();

  renderBoard();

  renderPieceSelectList();


  closeModal(
    "pieceModal"
  );


  showPopup(
    "💾",
    "保存しました！",
    "コマの設定を更新しました。"
  );

}

   仕掛け保存
===================================================== */

function saveTrickSettings(){

  tricks = {};


  const rows =
    document.querySelectorAll(
      "#trickSettings .trickSettingRow"
    );


  rows.forEach(
    (row,index)=>{

      const position =
        index+2;


      const type =
        row.querySelector(
          ".trickType"
        ).value;


      const value =
        Number(
          row.querySelector(
            ".trickValue"
          ).value
        );


      if(type==="none"){

        return;

      }


      let icon =
        "⭐";

      let text =
        "仕掛け発動！";


      if(type==="forward"){

        icon =
          "➡️";

        text =
          value +
          "マス進みます！";

      }


      if(type==="back"){

        icon =
          "⬅️";

        text =
          value +
          "マス戻ります！";

      }


      if(type==="previous"){

        icon =
          "↩️";

        text =
          "一つ前の都道府県へ戻ります！";

      }


      if(type==="twoBack"){

        icon =
          "⬅️";

        text =
          "2コマ戻ります！";

      }


      if(type==="gift"){

        icon =
          "🎁";

        text =
          "お楽しみ袋を出します！";

      }


      tricks[position] = {

        type:type,

        value:
          value || 1,

        icon:icon,

        text:text

      };

    }
  );


  renderBoard();


  closeModal(
    "trickModal"
  );


  showPopup(
    "⭐",
    "保存しました！",
    "仕掛けをマスに表示しました。"
  );

}


/* =====================================================
   リセット
===================================================== */

function resetGame(){

  const ok =
    confirm(
      "ゲームを最初からやり直しますか？"
    );


  if(!ok){

    return;

  }


  pieces.forEach(
    piece=>{

      /*
        全コマをSTART前へ
      */

      positions[piece.name] =
        0;

    }
  );


  selectedPiece =
    null;


  updateSelected();

  renderBoard();


  showPopup(
    "🔄",
    "リセットしました！",
    "全コマがSTART前に戻りました。"
  );

}


/* =====================================================
   初期表示
===================================================== */

renderBoard();

renderGiftButtons();

updateSelected();

</script>
